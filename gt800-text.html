{\\infty}\\frac{2^{n}}{n^{2}}$","a":"C","s":"$\\sum\\frac{(-1)^{n-1}+1}{n}=\\sum\\left[\\frac{(-1)^{n-1}}{n}+\\frac1n\\right]$，前者收敛、后者发散，故发散（D 通项不趋于 0 也发散，但按答案册选 C）。"},{"id":317,"ch":9,"chName":"无穷级数","sec":"选择题","q":"下列级数收敛的是（ ） A. $\\sum_{n=1}^{\\infty}\\frac{n+1}{n}$  B. $\\sum_{n=1}^{\\infty}\\frac{n^{n}}{3^{n}}$  C. $\\sum_{n=1}^{\\infty}\\frac{2^{n}}{n!}$  D. $\\sum_{n=1}^{\\infty}\\left(1+\\frac{1}{n}\\right)^{n}$","a":"C","s":"比值法：$\\lim\\frac{u_{n+1}}{u_n}=\\lim\\frac{2}{n+1}=0<1$，收敛。"},{"id":318,"ch":9,"chName":"无穷级数","sec":"选择题","q":"下列说法中，正确的是（ ） A. 若 $\\sum_{n=1}^{\\infty}u_{n}$ 收敛，则 $\\sum_{n=1}^{\\infty}|u_{n}|$ 收敛  B. 若 $\\sum_{n=1}^{\\infty}|u_{n}|$ 收敛，则 $\\sum_{n=1}^{\\infty}u_{n}$ 收敛  C. 若 $\\lim_{n\\to\\infty}u_{n}=0$，则 $\\sum_{n=1}^{\\infty}u_{n}$ 收敛  D. 若 $\\sum_{n=1}^{\\infty}(-1)^{n}u_{n}$ 收敛，则 $\\sum_{n=1}^{\\infty}|u_{n}|$ 收敛","a":"B","s":"绝对收敛必收敛；A、C、D 均可由 $u_n=\\frac1n$ 或 $\\frac{(-1)^n}{n}$ 举反例。"},{"id":319,"ch":9,"chName":"无穷级数","sec":"选择题","q":"下列级数，条件收敛的是（ ） A. $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}}{n^{2}}$  B. $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}}{\\sqrt{n}}$  C. $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}}{\\sqrt[3]{n^{3}}}$  D. $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}}{n^{n}}$","a":"B","s":"$\\sum\\frac{1}{\\sqrt n}$ 发散（$p=\\frac12$）而交错级数收敛，故条件收敛。"},{"id":320,"ch":9,"chName":"无穷级数","sec":"选择题","q":"下列级数，绝对收敛的是（ ） A. $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}}{n+1}$  B. $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{n}$  C. $\\sum_{n=1}^{\\infty}\\frac{\\cos n\\pi}{3^{n}}$  D. $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}\\cdot3^{n}}{2^{n}}$","a":"C","s":"$\\left|\\frac{\\cos n\\pi}{3^n}\\right|=\\frac{1}{3^n}$，与几何级数比较收敛，故绝对收敛。"},{"id":321,"ch":9,"chName":"无穷级数","sec":"选择题","q":"幂级数 $x-\\frac{x^{2}}{2}+\\frac{x^{3}}{3}+\\cdots+(-1)^{n-1}\\frac{x^{n}}{n}+\\cdots$ 的收敛域为（ ） A. $(-1,1)$  B. $[-1,1]$  C. $(-1,1]$  D. $[-1,1)$","a":"C","s":"$R=1$；$x=1$ 时为交错调和级数收敛，$x=-1$ 时化为 $\\sum\\frac{-1}{n}$ 发散，故收敛域 $(-1,1]$。"},{"id":322,"ch":9,"chName":"无穷级数","sec":"选择题","q":"幂级数 $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}x^{n}}{n+3}$ 的收敛域为（ ） A. $(-1,1)$  B. $(-1,1]$  C. $[-1,1]$  D. $[-1,1)$","a":"B","s":"$R=1$；$x=1$ 时 $\\sum\\frac{(-1)^n}{n+3}$ 收敛，$x=-1$ 时 $\\sum\\frac{1}{n+3}$ 发散。"},{"id":323,"ch":9,"chName":"无穷级数","sec":"选择题","q":"幂级数 $\\sum_{n=1}^{\\infty}\\frac{nx^{2n}}{3^{n}}$ 的收敛半径为（ ） A. $\\frac{1}{3}$  B. $3$  C. $\\sqrt{3}$  D. $\\frac{\\sqrt{3}}{3}$","a":"C","s":"令 $t=x^2$，$\\sum\\frac{nt^n}{3^n}$ 的 $R_t=3$，故 $x^2<3$，$R=\\sqrt3$。"},{"id":324,"ch":9,"chName":"无穷级数","sec":"选择题","q":"设 $\\sum_{n=1}^{\\infty}a_{n}x^{n}$ 的收敛域为 $(-1,1]$，则 $\\sum_{n=1}^{\\infty}a_{n}(x-1)^{n}$ 的收敛域为（ ） A. $(-2,0]$  B. $[-2,0)$  C. $(0,2)$  D. $(0,2]$","a":"D","s":"由 $-1<x-1\\leqslant1$ 得 $0<x\\leqslant2$。"},{"id":325,"ch":9,"chName":"无穷级数","sec":"选择题","q":"幂级数 $\\sum_{n=1}^{\\infty}n!x^{n}$ 的收敛半径为（ ） A. $0$  B. $1$  C. $\\infty$  D. 不存在","a":"A","s":"$\\lim\\left|\\frac{u_{n+1}}{u_n}\\right|=\\lim(n+1)=+\\infty$，故 $R=0$，仅在 $x=0$ 收敛。"},{"id":326,"ch":9,"chName":"无穷级数","sec":"选择题","q":"幂级数 $\\sum_{n=1}^{\\infty}\\frac{2x^{n}}{n^{2}}$ 的收敛区间为（ ） A. $(-1,1)$  B. $(-\\infty,+\\infty)$  C. $(-2,2)$  D. 不存在","a":"B","s":"系数 $\\frac{2}{n^2}$，$\\lim\\left|\\frac{u_{n+1}}{u_n}\\right|=0$，故 $R=+\\infty$，收敛区间为 $(-\\infty,+\\infty)$。"},{"id":327,"ch":9,"chName":"无穷级数","sec":"选择题","q":"幂级数 $\\sum_{n=0}^{\\infty}\\frac{(-1)^{n}x^{n}}{n!}$ 在 $(-\\infty,+\\infty)$ 上的和函数为（ ） A. $\\mathrm{e}^{-x}$  B. $\\mathrm{e}^{-x}-1-x$  C. $\\mathrm{e}^{-x}-1+x$  D. $\\mathrm{e}^{x}$","a":"A","s":"$\\sum\\frac{(-x)^n}{n!}=\\mathrm{e}^{-x}$，$x\\in(-\\infty,+\\infty)$。"},{"id":328,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"函数 $y=\\ln\\ln x$ 的定义域为 ______。","a":"$(1,+\\infty)$","s":"由 $x>0$ 且 $\\ln x>0$ 解得 $x>1$。"},{"id":329,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知函数 $f(x)$ 的定义域是 $[0,1]$，则函数 $f(\\mathrm{e}^{x})$ 的定义域为 ______。","a":"$(-\\infty,0]$","s":"由 $0\\leqslant\\mathrm{e}^x\\leqslant1$ 解得 $x\\leqslant0$。"},{"id":330,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(\\sin x)=1-\\cos 2x$，则 $f(x^{3})=$ ______。","a":"$2x^{6}$","s":"$1-\\cos2x=2\\sin^2x$，故 $f(x)=2x^2$，于是 $f(x^3)=2x^6$。"},{"id":331,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f\\left(x+\\frac{1}{x}\\right)=x^{2}+\\frac{1}{x^{2}}$，则 $\\lim_{x\\to0}f(x)=$ ______。","a":"$-2$","s":"$f\\left(x+\\frac1x\\right)=\\left(x+\\frac1x\\right)^2-2$，故 $f(x)=x^2-2$，极限为 $-2$。"},{"id":332,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$y=\\frac{1-3x}{1+2x}$ 的反函数为 ______。","a":"$y=\\frac{1-x}{2x+3}$，$x\\ne-\\frac{3}{2}$","s":"解出 $x=\\frac{1-y}{2y+3}$，交换字母得反函数。"},{"id":333,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$y=3+\\ln(x+2)$ 的反函数为 ______。","a":"$y=\\mathrm{e}^{x-3}-2$，$x\\in\\mathbf{R}$","s":"由 $\\ln(x+2)=y-3$ 得 $x=\\mathrm{e}^{y-3}-2$，交换字母。"},{"id":334,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"函数 $y=\\ln^{2}\\sin\\sqrt{x+1}$ 的复合过程是 ______。","a":"$y=u^{2},\\ u=\\ln v,\\ v=\\sin w,\\ w=\\sqrt{t},\\ t=x+1$","s":"由外到内逐层分解为五个基本初等函数。"},{"id":335,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"函数 $y=\\ln(x+\\sqrt{1+x^{2}})$ 是 ______。（奇函数还是偶函数）","a":"奇函数","s":"$y(-x)=\\ln\\frac{1}{x+\\sqrt{1+x^2}}=-y(x)$，故为奇函数。"},{"id":336,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $\\lim_{x\\to\\infty}\\frac{(a^{3}x+1)(x^{2}+2)}{x^{3}+1}=8$，则 $a=$ ______。","a":"$2$","s":"分子最高次项系数为 $a^3$，故 $a^3=8$，得 $a=2$。"},{"id":337,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $\\lim_{n\\to\\infty}\\frac{n(an^{2}-bn+1)}{n^{2}+1}=2$，则 $a=$ ______，$b=$ ______。","a":"$a=0$，$b=-2$","s":"分子三次项须消失得 $a=0$；此时原式 $=\\lim\\frac{-bn^2+n}{n^2+1}=-b=2$，故 $b=-2$。"},{"id":338,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to+\\infty}\\frac{2x+\\mathrm{e}^{x}}{3x+\\mathrm{e}^{x}}=$ ______。","a":"$1$","s":"分子分母同除以 $\\mathrm{e}^x$ 后用洛必达法则，极限为 1。"},{"id":339,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{n\\to\\infty}\\frac{1+2+\\cdots+n}{n^{2}}=$ ______。","a":"$\\frac{1}{2}$","s":"分子为 $\\frac12n(n+1)$，除以 $n^2$ 后极限为 $\\frac12$。"},{"id":340,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知极限 $\\lim_{x\\to+\\infty}(2x-\\sqrt{ax^{2}-x+1})$ 存在，则 $a=$ ______。","a":"$4$","s":"有理化后分子二次项系数为 $4-a$，极限存在须 $4-a=0$。"},{"id":341,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to1}\\left(\\frac{1}{1-x}-\\frac{3}{1-x^{3}}\\right)=$ ______。","a":"$-1$","s":"通分得 $\\frac{x^2+x-2}{(1-x)(x^2+x+1)}$，约去 $(x-1)$ 后极限为 $-1$。"},{"id":342,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to1}\\left(\\frac{1}{x-1}-\\frac{1}{\\ln x}\\right)=$ ______。","a":"$-\\frac{1}{2}$","s":"通分 $\\frac{\\ln x-x+1}{(x-1)\\ln x}$，两次洛必达得 $-\\frac12$。"},{"id":343,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{n\\to\\infty}\\left(1+\\frac{1}{n}\\right)^{n\\sin n}=$ ______。","a":"$1$","s":"指数 $n\\sin n\\cdot\\ln(1+\\frac1n)\\to0$，故极限为 $\\mathrm{e}^0=1$。"},{"id":344,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)=\\sqrt[x]{1-5x}$（即 $(1-5x)^{\\frac{1}{x}}$），则 $\\lim_{x\\to0}f(x)=$ ______。","a":"$\\mathrm{e}^{-5}$","s":"$\\lim(1-5x)^{1/x}=\\mathrm{e}^{-5}$。注：原书根指数印刷不清，按答案与解析收录为 $x$ 次根。"},{"id":345,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to0}\\frac{(x-\\sin x)(\\tan x-x)}{x^{2}(\\mathrm{e}^{x}+1)\\ln(1-x^{4})}=$ ______。","a":"$-\\frac{1}{36}$","s":"用等价无穷小 $x-\\sin x\\sim\\frac{x^3}{6}$、$\\tan x-x\\sim\\frac{x^3}{3}$，分母 $\\sim2\\cdot(-x^4)\\cdot x^2$，得 $-\\frac1{36}$。"},{"id":346,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to0}\\frac{x}{\\sqrt{x+1}-1}=$ ______。","a":"$2$","s":"分母 $\\sqrt{1+x}-1\\sim\\frac x2$，故极限为 2。"},{"id":347,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to0}\\frac{\\mathrm{e}^{\\sin x}-\\mathrm{e}^{\\tan x}}{\\mathrm{e}^{x^{3}}-1}=$ ______。","a":"$-\\frac{1}{2}$","s":"分子 $\\approx\\mathrm{e}^{\\tan x}(\\sin x-\\tan x)$，而 $\\sin x-\\tan x\\sim-\\frac{x^3}{2}$，分母 $\\sim x^3$。"},{"id":348,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to0}\\frac{\\mathrm{e}^{2x}-1+\\sin 2x}{x}=$ ______。","a":"$4$","s":"拆为两项：$\\lim\\frac{\\mathrm{e}^{2x}-1}{x}=2$，$\\lim\\frac{\\sin2x}{x}=2$。"},{"id":349,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to\\infty}x^{2}\\sin\\frac{2x}{x^{3}+1}=$ ______。","a":"$2$","s":"$\\sin\\frac{2x}{x^3+1}\\sim\\frac{2x}{x^3+1}$，乘 $x^2$ 后极限为 2。"},{"id":350,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to1}\\frac{\\ln x}{\\sin(x-1)}=$ ______。","a":"$1$","s":"$\\ln x=\\ln(1+x-1)\\sim x-1$，$\\sin(x-1)\\sim x-1$。"},{"id":351,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to0}(1+\\tan^{2}x)^{\\frac{1}{2x\\arcsin x}}=$ ______。","a":"$\\mathrm{e}^{\\frac{1}{2}}$","s":"指数部分 $\\frac{\\tan^2x}{2x\\arcsin x}\\to\\frac{x^2}{2x^2}=\\frac12$，故为 $\\mathrm{e}^{1/2}$。"},{"id":352,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)$ 处处连续，且 $f(1)=3$，则 $\\lim_{x\\to0}\\frac{2x}{\\tan x}f\\left(\\frac{\\sin x}{x}\\right)=$ ______。","a":"$6$","s":"$\\frac{2x}{\\tan x}\\to2$，内层 $\\frac{\\sin x}{x}\\to1$，由连续性得 $2f(1)=6$。"},{"id":353,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to0^{+}}\\ln(1+x)\\ln x=$ ______。","a":"$0$","s":"$\\ln(1+x)\\sim x$，问题化为 $\\lim x\\ln x=0$。"},{"id":354,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to+\\infty}x^{2}\\mathrm{e}^{-2x}=$ ______。","a":"$0$","s":"化为 $\\frac{x^2}{\\mathrm{e}^{2x}}$ 后两次洛必达，极限为 0。"},{"id":355,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to1}(1-x)\\tan\\left(\\frac{\\pi}{2}x\\right)=$ ______。","a":"$\\frac{2}{\\pi}$","s":"化为 $\\frac{1-x}{\\cos\\frac{\\pi}{2}x}$，用洛必达得 $\\frac{2}{\\pi}$。"},{"id":356,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\lim_{x\\to1^{+}}(x-1)^{\\ln x}=$ ______。","a":"$1$","s":"写成 $\\mathrm{e}^{\\ln x\\ln(x-1)}$，指数部分 $\\to0$（因 $\\ln x\\sim x-1$），得 $\\mathrm{e}^0=1$。"},{"id":357,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $\\lim_{x\\to1}\\frac{x^{2}+2x-a}{x-1}=4$，则 $a=$ ______。","a":"$3$","s":"分母趋于 0 而极限存在，故分子在 $x=1$ 处为 0，得 $a=3$。"},{"id":358,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"极限 $\\lim_{x\\to0}(1+|x|)^{\\frac{1}{x}}$ 是否存在 ______。","a":"不存在","s":"右极限 $=\\mathrm{e}$，左极限 $=\\mathrm{e}^{-1}$，左右不等故不存在。"},{"id":359,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)=\\begin{cases}\\frac{\\sin(1-x)}{2x-2},&x\\ne1\\ a,&x=1\\end{cases}$ 在 $x=1$ 处连续，则 $a=$ ______。","a":"$-\\frac{1}{2}$","s":"$\\lim_{x\\to1}f(x)=\\lim\\frac{1-x}{2(x-1)}=-\\frac12$，连续则 $a$ 等于该极限。"},{"id":360,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"当 $a=$ ______ 时，$f(x)=\\begin{cases}-\\frac{2}{\\mathrm{e}}(1+x)^{\\frac{1}{x}}+a,&x\\ne0\\ 1,&x=0\\end{cases}$ 在 $x=0$ 处连续。","a":"$3$","s":"$\\lim_{x\\to0}f(x)=-\\frac2{\\mathrm{e}}\\cdot\\mathrm{e}+a=a-2$，令其等于 1 得 $a=3$。"},{"id":361,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$x=1$ 为函数 $f(x)=\\frac{\\sin(x-1)}{x^{2}-1}$ 的 ______ 间断点。","a":"可去","s":"极限 $=\\lim\\frac{x-1}{(x+1)(x-1)}=\\frac12$ 存在，故为可去间断点。"},{"id":362,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$x=0$ 为函数 $f(x)=\\mathrm{e}^{\\frac{2}{x}}$ 的 ______ 间断点。","a":"无穷","s":"右极限为 $+\\infty$、左极限为 0，故为无穷间断点。"},{"id":363,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"要使函数 $f(x)=\\frac{\\sin x}{x}$ 在 $x=0$ 处连续，应补充定义 $f(0)=$ ______。","a":"$1$","s":"$\\lim_{x\\to0}\\frac{\\sin x}{x}=1$，故补充定义 $f(0)=1$。"},{"id":364,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知 $f'(1)=2$，则 $\\lim_{x\\to0}\\frac{x}{f(1-x)-f(1+3x)}=$ ______。","a":"$-\\frac{1}{8}$","s":"分母极限 $=-f'(1)-3f'(1)=-8$，故原式为 $-\\frac18$。"},{"id":365,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)=(\\mathrm{e}^{x}-1)(\\mathrm{e}^{x}-2)\\cdots(\\mathrm{e}^{x}-n)$，则 $f'(0)=$ ______。","a":"$(-1)^{n-1}(n-1)!$","s":"按导数定义 $f'(0)=\\lim\\frac{f(x)}{x}=(-1)(-2)\\cdots[-(n-1)]$。"},{"id":366,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设函数 $f(x)=x|x|$，则 $f'(0)=$ ______。","a":"$0$","s":"左右导数分别由 $\\frac{x^2}{x}$、$\\frac{-x^2}{x}$ 求极限，均为 0。"},{"id":367,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设函数 $f(x)=\\begin{cases}\\ln(1+3x),&-\\frac{1}{2}<x\\le0\\ ax+b,&x>0\\end{cases}$ 在 $x=0$ 处可导，则 $a=$ ______，$b=$ ______。","a":"$a=3$，$b=0$","s":"连续得 $b=0$；左导数 $=3$，右导数 $=a$，可导则 $a=3$。"},{"id":368,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f\\left(\\frac{1}{x}\\right)=x^{2}+\\frac{1}{x}+1$，则 $f'(-1)=$ ______。","a":"$3$","s":"$f(x)=\\frac{1}{x^2}+x+1$，$f'(x)=-\\frac{2}{x^3}+1$，故 $f'(-1)=3$。"},{"id":369,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$y=\\ln\\left(x+\\sqrt{a^{2}+x^{2}}\\right)$，则 $y'=$ ______。","a":"$\\frac{1}{\\sqrt{a^{2}+x^{2}}}$","s":"按复合求导化简，括号内恰与分母约去。"},{"id":370,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$y=xf(\\sin^{2}x)$，且 $f(u)$ 可导，则 $y'=$ ______。","a":"$f(\\sin^{2}x)+x\\sin 2x\\,f'(\\sin^{2}x)$","s":"乘积法则加复合求导，$2\\sin x\\cos x=\\sin2x$。"},{"id":371,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知 $f(x)=x^{3}+1$，则 $\\frac{\\mathrm{d}}{\\mathrm{d}x}f(x^{2})=$ ______。","a":"$6x^{5}$","s":"$f'(u)=3u^2$，$\\frac{\\mathrm{d}}{\\mathrm{d}x}f(x^2)=3x^4\\cdot2x=6x^5$。"},{"id":372,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $y=3^{x\\sin 2x}$，则 $\\mathrm{d}y=$ ______。","a":"$\\ln 3\\cdot(\\sin 2x+2x\\cos 2x)3^{x\\sin 2x}\\mathrm{d}x$","s":"指数函数求导乘内层导数。"},{"id":373,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)=\\lim_{t\\to0}x(1+2t)^{\\frac{x}{t}}$，则 $f'(x)=$ ______。","a":"$(2x+1)\\mathrm{e}^{2x}$","s":"内层极限 $=\\mathrm{e}^{2x}$，故 $f(x)=x\\mathrm{e}^{2x}$，求导得 $(2x+1)\\mathrm{e}^{2x}$。"},{"id":374,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)=\\int_{0}^{1}t\\sin x^{2}\\,\\mathrm{d}t$，则 $f'(x)=$ ______。","a":"$x\\cos x^{2}$","s":"$f(x)=\\frac12\\sin x^2$，求导得 $x\\cos x^2$。"},{"id":375,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)$ 连续且 $F(x)=\\int_{0}^{x}(x-t)f(t)\\,\\mathrm{d}t$，则 $F''(x)=$ ______。","a":"$f(x)$","s":"$F'(x)=\\int_0^xf(t)\\mathrm{d}t$，再求导得 $f(x)$。"},{"id":376,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)$ 连续且 $F(x)=\\int_{0}^{x}f(x-t)\\,\\mathrm{d}t$，则 $F'(x)=$ ______。","a":"$f(x)$","s":"换元 $u=x-t$ 得 $F(x)=\\int_0^xf(u)\\mathrm{d}u$，求导即 $f(x)$。"},{"id":377,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $y=y(x)$ 由 $xy+\\mathrm{e}^{y}=x+1$ 确定，则 $\\left.\\frac{\\mathrm{d}y}{\\mathrm{d}x}\\right|_{x=0}=$ ______。","a":"$1$","s":"隐函数求导 $\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{1-y}{x+\\mathrm{e}^y}$，$x=0$ 时 $y=0$，得 1。"},{"id":378,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知 $\\begin{cases}x=\\arctan t\\ y=\\ln(1+t^{2})\\end{cases}$，则 $\\frac{\\mathrm{d}^{2}y}{\\mathrm{d}x^{2}}=$ ______。","a":"$2(1+t^{2})$","s":"$\\frac{\\mathrm{d}y}{\\mathrm{d}x}=2t(1+t^2)$，再对 $t$ 求导除以 $x'(t)$ 得 $2(1+t^2)$。"},{"id":379,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)=\\begin{cases}x\\cos\\frac{1}{x},&x\\ne0\\ 0,&x=0\\end{cases}$，则 $f'(x)=$ ______。","a":"$f'(0)$ 不存在；$x\\ne0$ 时 $f'(x)=\\cos\\frac{1}{x}+\\frac{1}{x}\\sin\\frac{1}{x}$","s":"$f'(0)=\\lim\\cos\\frac1x$ 不存在；$x\\ne0$ 时用乘积法则求导。"},{"id":380,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $y=\\frac{1}{3x+4}$，则 $y^{(n)}=$ ______。","a":"$\\frac{(-1)^{n}n!\\,3^{n}}{(3x+4)^{n+1}}$","s":"套用 $\\left(\\frac{1}{ax+b}\\right)^{(n)}=\\frac{(-1)^nn!a^n}{(ax+b)^{n+1}}$。"},{"id":381,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"曲线 $y=-x^{2}+4\\ (x>0)$ 与 $x$ 轴交点处的切线方程是 ______。","a":"$y=-4x+8$","s":"交点为 $(2,0)$，$y'(2)=-4$，点斜式得 $y=-4(x-2)$。"},{"id":382,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"曲线 $\\begin{cases}x=3\\mathrm{e}^{-t}\\ y=\\mathrm{e}^{t}\\end{cases}$ 在 $t=0$ 处的法线方程是 ______。","a":"$y=3x-8$","s":"切线斜率 $-\\frac13$，法线斜率 3，过点 $(3,1)$。"},{"id":383,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设曲线 $y=x^{2}$ 与曲线 $y=a\\ln x\\ (a\\ne0)$ 相切，则 $a=$ ______。","a":"$2\\mathrm{e}$","s":"切点处函数值与导数值均相等：$x_0^2=a\\ln x_0$，$2x_0=\\frac{a}{x_0}$，解得 $a=2\\mathrm{e}$。"},{"id":384,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设函数 $f(x)=3x^{2}+ax+2$ 在 $x=2$ 处取得极值，则 $\\lim_{x\\to0}\\frac{\\sin ax}{2x}=$ ______。","a":"$-6$","s":"$f'(2)=12+a=0$ 得 $a=-12$，极限 $=\\frac a2=-6$。"},{"id":385,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $x=2$ 为函数 $f(x)=x^{3}+2ax^{2}+x+1$ 的拐点，则 $a=$ ______。","a":"$-3$","s":"$f''(x)=6x+4a$，令 $f''(2)=12+4a=0$ 得 $a=-3$。"},{"id":386,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"函数 $y=x\\mathrm{e}^{-x}$ 的水平渐近线为 ______。","a":"$y=0$","s":"$\\lim_{x\\to+\\infty}x\\mathrm{e}^{-x}=0$，故 $y=0$ 为水平渐近线。"},{"id":387,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"函数 $y=\\frac{x^{4}}{(1+x)^{3}}$ 的垂直渐近线为 ______。","a":"$x=-1$","s":"$x\\to-1$ 时函数趋于无穷。"},{"id":388,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"曲线 $y=x\\mathrm{e}^{\\frac{1}{x}}$ 的斜渐近线方程为 ______。","a":"$y=x+1$","s":"$k=\\lim\\frac yx=1$，$b=\\lim(y-kx)=\\lim x(\\mathrm{e}^{1/x}-1)=1$。"},{"id":389,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $\\frac{\\mathrm{e}^{x}}{x}$ 是 $f(x)$ 的一个原函数，则 $\\int xf'(x)\\,\\mathrm{d}x=$ ______。","a":"$\\frac{x\\mathrm{e}^{x}-2\\mathrm{e}^{x}}{x}+C$","s":"$f(x)=\\left(\\frac{\\mathrm{e}^x}{x}\\right)'=\\frac{\\mathrm{e}^x(x-1)}{x^2}$，分部积分得 $xf(x)-\\int f$。"},{"id":390,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{(x-1)^{3}}{2x^{2}}\\,\\mathrm{d}x=$ ______。","a":"$\\frac{1}{4}x^{2}-\\frac{3}{2}x+\\frac{3}{2}\\ln|x|+\\frac{1}{2x}+C$","s":"展开分子后逐项积分。"},{"id":391,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{x^{2}}{1+x^{6}}\\,\\mathrm{d}x=$ ______。","a":"$\\frac{1}{3}\\arctan x^{3}+C$","s":"凑微分 $x^2\\mathrm{d}x=\\frac13\\mathrm{d}(x^3)$。"},{"id":392,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{2}{\\mathrm{e}^{x}+\\mathrm{e}^{-x}}\\,\\mathrm{d}x=$ ______。","a":"$2\\arctan\\mathrm{e}^{x}+C$","s":"分子分母同乘 $\\mathrm{e}^x$，凑 $\\mathrm{d}(\\mathrm{e}^x)$。"},{"id":393,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{(1+2\\ln x)^{2}}{x}\\,\\mathrm{d}x=$ ______。","a":"$\\frac{1}{6}(1+2\\ln x)^{3}+C$","s":"凑微分 $\\frac{\\mathrm{d}x}{x}=\\frac12\\mathrm{d}(1+2\\ln x)$。"},{"id":394,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{x}{(1-2x^{2})^{3}}\\,\\mathrm{d}x=$ ______。","a":"$\\frac{1}{8(1-2x^{2})^{2}}+C$","s":"令 $u=1-2x^2$，化为幂函数积分。"},{"id":395,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{1+\\cos x}{(x+\\sin x)^{2}}\\,\\mathrm{d}x=$ ______。","a":"$-\\frac{1}{x+\\sin x}+C$","s":"分子恰为分母的导数，凑微分。"},{"id":396,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{1}{\\sqrt{x}(1+x)}\\,\\mathrm{d}x=$ ______。","a":"$2\\ln(\\sqrt{x}+\\sqrt{1+x})+C$","s":"令 $t=\\sqrt x$，化为 $\\int\\frac{2\\mathrm{d}t}{1+t^2}$。"},{"id":397,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{x}{\\sqrt{2x+1}}\\,\\mathrm{d}x=$ ______。","a":"$\\frac{1}{6}(2x+1)^{\\frac{3}{2}}-\\frac{1}{2}(2x+1)^{\\frac{1}{2}}+C$","s":"令 $t=\\sqrt{2x+1}$，$x=\\frac12(t^2-1)$，$\\mathrm{d}x=t\\mathrm{d}t$。"},{"id":398,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{1}{\\sqrt{1+\\mathrm{e}^{x}}}\\,\\mathrm{d}x=$ ______。","a":"$\\ln\\left|\\frac{\\sqrt{1+\\mathrm{e}^{x}}-1}{\\sqrt{1+\\mathrm{e}^{x}}+1}\\right|+C$","s":"令 $t=\\sqrt{1+\\mathrm{e}^x}$，化为 $\\int\\frac{2}{t^2-1}\\mathrm{d}t$。"},{"id":399,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{1}{x^{2}\\sqrt{x^{2}-1}}\\,\\mathrm{d}x=$ ______。","a":"$\\frac{\\sqrt{x^{2}-1}}{x}+C$","s":"令 $x=\\sec t$，化为 $\\int\\cos t\\,\\mathrm{d}t$。"},{"id":400,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\arctan\\sqrt{x}\\,\\mathrm{d}x=$ ______。","a":"$x\\arctan\\sqrt{x}-\\sqrt{x}+\\arctan\\sqrt{x}+C$","s":"令 $t=\\sqrt x$ 后用分部积分。"},{"id":401,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{\\ln(1+x^{2})}{x^{2}}\\,\\mathrm{d}x=$ ______。","a":"$-\\frac{1}{x}\\ln(1+x^{2})+2\\arctan x+C$","s":"分部积分，令 $\\mathrm{d}\\left(-\\frac1x\\right)$。"},{"id":402,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int\\frac{1}{x^{2}+4x-5}\\,\\mathrm{d}x=$ ______。","a":"$-\\frac{1}{6}\\ln\\left|\\frac{5+x}{1-x}\\right|+C$","s":"配方为 $(x+2)^2-9$，套 $\\int\\frac{\\mathrm{d}u}{u^2-a^2}$ 公式。"},{"id":403,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f'(2x)=\\mathrm{e}^{-x}$，则 $f(\\ln x)=$ ______。","a":"$-2x^{-\\frac{1}{2}}+C$","s":"由 $f'(x)=\\mathrm{e}^{-x/2}$ 积分得 $f(x)=-2\\mathrm{e}^{-x/2}+C$，代入 $x=\\ln x$ 的表达式为 $-2x^{-1/2}+C$。"},{"id":404,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{-1}^{1}x^{2}\\left[\\ln\\left(x+\\sqrt{1+x^{2}}\\right)+1\\right]\\mathrm{d}x=$ ______。","a":"$\\frac{2}{3}$","s":"奇函数部分积分为 0，余下 $\\int_{-1}^1x^2\\mathrm{d}x=\\frac23$。"},{"id":405,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{-\\frac{\\pi}{2}}^{\\frac{\\pi}{2}}(x^{3}+1)\\cos^{2}x\\,\\mathrm{d}x=$ ______。","a":"$\\frac{\\pi}{2}$","s":"$x^3\\cos^2x$ 为奇函数积分为 0，余下 $2\\int_0^{\\pi/2}\\cos^2x\\mathrm{d}x=\\frac{\\pi}{2}$。"},{"id":406,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{-\\pi}^{\\pi}\\left(\\sin^{3}x+\\sqrt{\\pi^{2}-x^{2}}\\right)\\mathrm{d}x=$ ______。","a":"$\\frac{1}{2}\\pi^{3}$","s":"奇函数项为 0，余下为半圆面积 $\\frac12\\pi\\cdot\\pi^2$。"},{"id":407,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{-1}^{1}(x^{2}+x^{3})^{2}\\,\\mathrm{d}x=$ ______。","a":"$\\frac{24}{35}$","s":"展开后奇次项积分为 0，余 $\\int_{-1}^1(x^4+x^6)\\mathrm{d}x=\\frac{24}{35}$。"},{"id":408,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)=x+\\sqrt{1-x^{2}}-2\\int_{0}^{1}f(x)\\,\\mathrm{d}x$，则 $f(x)=$ ______。","a":"$x+\\sqrt{1-x^{2}}-\\frac{1}{3}-\\frac{\\pi}{6}$","s":"设 $A=\\int_0^1f$，两边在 $[0,1]$ 积分得 $A=\\frac12+\\frac{\\pi}{4}-2A$，解得 $A=\\frac16+\\frac{\\pi}{12}$。"},{"id":409,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"函数 $f(x)=x\\mathrm{e}^{x^{2}}$ 在 $[0,2]$ 上的平均值为 ______。","a":"$\\frac{1}{4}(\\mathrm{e}^{4}-1)$","s":"平均值 $=\\frac12\\int_0^2x\\mathrm{e}^{x^2}\\mathrm{d}x=\\frac14\\mathrm{e}^{x^2}\\Big|_0^2$。"},{"id":410,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{1}^{\\mathrm{e}^{2}}\\frac{\\ln^{3}x}{2x}\\,\\mathrm{d}x=$ ______。","a":"$2$","s":"凑微分得 $\\frac18\\ln^4x\\Big|_1^{\\mathrm{e}^2}=2$。"},{"id":411,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{0}^{\\frac{\\pi}{4}}\\frac{\\tan^{4}x}{\\cos^{2}x}\\,\\mathrm{d}x=$ ______。","a":"$\\frac{1}{5}$","s":"化为 $\\int\\tan^4x\\,\\mathrm{d}(\\tan x)=\\frac15\\tan^5x\\Big|_0^{\\pi/4}$。"},{"id":412,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{0}^{\\ln2}\\mathrm{e}^{-x+\\mathrm{e}^{-x}}\\,\\mathrm{d}x=$ ______。","a":"$\\mathrm{e}-\\sqrt{\\mathrm{e}}$","s":"凑 $\\mathrm{d}(\\mathrm{e}^{-x})$，得 $-\\mathrm{e}^{\\mathrm{e}^{-x}}\\Big|_0^{\\ln2}$。"},{"id":413,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{0}^{\\frac{\\pi}{2}}x^{2}\\cos x\\,\\mathrm{d}x=$ ______。","a":"$\\frac{\\pi^{2}}{4}-2$","s":"两次分部积分。"},{"id":414,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{0}^{\\pi}\\sqrt{1-\\sin^{2}x}\\,\\mathrm{d}x=$ ______。","a":"$2$","s":"化为 $\\int_0^{\\pi}|\\cos x|\\mathrm{d}x$，分段去绝对值后为 2。"},{"id":415,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{0}^{2}\\max\\{x,x^{2}\\}\\,\\mathrm{d}x=$ ______。","a":"$\\frac{11}{6}$","s":"$[0,1]$ 上取 $x^2$、$[1,2]$ 上取 $x$，得 $\\frac13+\\frac32=\\frac{11}{6}$。"},{"id":416,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)=\\begin{cases}\\mathrm{e}^{2x},&x\\le1\\ x\\ln x,&x>1\\end{cases}$，则 $\\int_{0}^{\\mathrm{e}}f(x)\\,\\mathrm{d}x=$ ______。","a":"$\\frac{3}{4}\\mathrm{e}^{2}-\\frac{1}{4}$","s":"分段积分，后段用分部积分得 $\\frac14(\\mathrm{e}^2+1)$，合计 $\\frac34\\mathrm{e}^2-\\frac14$。"},{"id":417,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $\\int_{0}^{x^{3}}f(t)\\,\\mathrm{d}t=6x+1$，则 $f(8)=$ ______。","a":"$\\frac{1}{2}$","s":"两边求导得 $3x^2f(x^3)=6$，取 $x=2$ 得 $12f(8)=6$。"},{"id":418,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f'(2x)=\\frac{1}{1+4x}$，则 $\\int_{0}^{4}f'(x)\\,\\mathrm{d}x=$ ______。","a":"$\\ln 3$","s":"$f'(x)=\\frac{1}{1+2x}$，积分得 $\\frac12\\ln(1+2x)\\Big|_0^4=\\frac12\\ln9=\\ln3$。"},{"id":419,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"反常积分 $\\int_{0}^{+\\infty}\\mathrm{e}^{-2x}\\,\\mathrm{d}x$ 的敛散性为 ______。","a":"收敛","s":"原式 $=-\\frac12\\mathrm{e}^{-2x}\\Big|_0^{+\\infty}=\\frac12$，收敛。"},{"id":420,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"反常积分 $\\int_{1}^{+\\infty}\\frac{1}{x^{2}+2x+5}\\,\\mathrm{d}x$ 的值为 ______。","a":"$\\frac{\\pi}{8}$","s":"配方为 $(x+1)^2+4$，得 $\\frac12\\arctan\\frac{x+1}{2}\\Big|_1^{+\\infty}=\\frac{\\pi}{8}$。"},{"id":421,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"反常积分 $\\int_{0}^{1}\\frac{1}{(1-x)^{2}}\\,\\mathrm{d}x$ 的敛散性为 ______。","a":"发散","s":"原函数 $\\frac{1}{1-x}$ 在 $x\\to1$ 时趋于无穷，故发散。"},{"id":422,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$y=\\sin x\\left(\\frac{\\pi}{4}\\le x\\le\\pi\\right)$，$y=\\cos x\\left(\\frac{\\pi}{4}\\le x\\le\\frac{\\pi}{2}\\right)$ 与 $x$ 轴所围成平面图形的面积 $S=$ ______。","a":"$\\sqrt{2}$","s":"$S=\\int_{\\pi/4}^{\\pi}\\sin x\\mathrm{d}x-\\int_{\\pi/4}^{\\pi/2}\\cos x\\mathrm{d}x=\\sqrt2$。"},{"id":423,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"曲线 $y=\\ln x$，$y$ 轴与直线 $y=\\ln 3$、$y=\\ln 5$ 所围平面图形面积为 ______。","a":"$2$","s":"对 $y$ 积分，$x=\\mathrm{e}^y$，$\\int_{\\ln3}^{\\ln5}\\mathrm{e}^y\\mathrm{d}y=5-3=2$。"},{"id":424,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"函数 $y=\\sin x\\ (0\\le x\\le\\pi)$ 与 $x$ 轴所围成平面图形的面积 $S=$ ______，该平面图形绕 $x$ 轴旋转后所得旋转体体积 $V_{x}=$ ______。","a":"$S=2$；$V_{x}=\\frac{\\pi^{2}}{2}$","s":"$S=\\int_0^{\\pi}\\sin x\\mathrm{d}x=2$；$V_x=\\pi\\int_0^{\\pi}\\sin^2x\\mathrm{d}x=\\frac{\\pi^2}{2}$。"},{"id":425,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"微分方程 $\\mathrm{d}y-(1+x^{2})\\mathrm{d}x=y^{2}(1+x^{2})\\mathrm{d}x$ 的通解为 ______。","a":"$y=\\tan\\left(x+\\frac{1}{3}x^{3}+C\\right)$","s":"化为 $\\frac{\\mathrm{d}y}{1+y^2}=(1+x^2)\\mathrm{d}x$，两边积分得 $\\arctan y=x+\\frac13x^3+C$。"},{"id":426,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"微分方程 $x\\frac{\\mathrm{d}y}{\\mathrm{d}x}=y+x\\cot\\frac{y}{x}$ 的通解为 ______。","a":"$\\sec\\frac{y}{x}=Cx$","s":"令 $u=\\frac yx$，方程化为 $x\\frac{\\mathrm{d}u}{\\mathrm{d}x}=\\cot u$，分离变量积分得 $\\sec u=Cx$。"},{"id":427,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"微分方程 $y'+y\\cot x=\\frac{1}{\\sin x}$ 的通解为 ______。","a":"$y=\\csc x\\,(x+C)$","s":"一阶线性公式，积分因子 $\\sin x$，得 $y=\\frac1{\\sin x}(x+C)$。"},{"id":428,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"微分方程 $\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{1}{x+y}$ 的通解为 ______。","a":"$x=-y-1+C\\mathrm{e}^{y}$","s":"视为 $\\frac{\\mathrm{d}x}{\\mathrm{d}y}-x=y$，一阶线性求解得 $x=-y-1+C\\mathrm{e}^y$。"},{"id":429,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $f(x)$ 连续，且 $f(x)=2\\int_{0}^{x}f(t)\\,\\mathrm{d}t+x+1$，则 $f(x)=$ ______。","a":"$-\\frac{1}{2}+\\frac{3}{2}\\mathrm{e}^{2x}$","s":"两边求导得 $f'-2f=1$，通解得 $f=C\\mathrm{e}^{2x}-\\frac12$，由 $f(0)=1$ 定出 $C=\\frac32$。"},{"id":430,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"微分方程 $y''+y'-2y=0$ 满足 $y(0)=3$、$y'(0)=0$ 的特解为 ______。","a":"$2\\mathrm{e}^{x}+\\mathrm{e}^{-2x}$","s":"特征根 1、-2，通解 $y=C_1\\mathrm{e}^x+C_2\\mathrm{e}^{-2x}$，代入条件得 $C_1=2,\\,C_2=1$。"},{"id":431,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知函数 $y=y(x)$ 满足 $y''+2y'+y=0$，且 $\\lim_{x\\to0}\\frac{y(x)}{x}=1$，则 $y=$ ______。","a":"$x\\mathrm{e}^{-x}$","s":"由极限得 $y(0)=0,\\,y'(0)=1$；特征根 $-1$（二重），代入得 $C_1=0,\\,C_2=1$。"},{"id":432,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"微分方程 $y''-2y'+y=(x+1)\\mathrm{e}^{x}$ 的特解形式可设为 ______。","a":"$y^{*}=x^{2}(ax+b)\\mathrm{e}^{x}$","s":"$r=1$ 为二重特征根，故乘 $x^2$。"},{"id":433,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"微分方程 $y''-y=x+\\mathrm{e}^{x}$ 的特解形式可设为 ______。","a":"$y^{*}=ax+b+cx\\mathrm{e}^{x}$","s":"分别设 $y_1^*=ax+b$、$y_2^*=cx\\mathrm{e}^x$，由叠加原理相加。"},{"id":434,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"二元函数 $f(x,y)=\\frac{\\ln(x+y)}{\\sqrt{x^{2}+y^{2}}}$ 的定义域为 ______。","a":"$\\{(x,y)\\mid x+y>0\\ \\text{且}\\ x^{2}+y^{2}>0\\}$","s":"对数要求 $x+y>0$，分母要求 $x^{2}+y^{2}>0$，两者取交集。"},{"id":435,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $z=x^{x^{-y}}$，则 $\\left.\\frac{\\partial z}{\\partial x}\\right|_{(1,0)}=$ ______，$\\left.\\frac{\\partial z}{\\partial y}\\right|_{(1,0)}=$ ______。","a":"$1$；$0$","s":"写成 $z=\\mathrm{e}^{x^{-y}\\ln x}$ 后对 $x$、$y$ 分别求偏导，再代入 $(1,0)$。"},{"id":436,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $z=\\frac{x\\cos(y-1)}{1+\\sin(y-1)}+y^{2}$，则 $\\left.\\frac{\\partial z}{\\partial y}\\right|_{(0,1)}=$ ______。","a":"$2$","s":"先代 $x=0$ 得 $z(0,y)=y^{2}$，故 $z'_{y}(0,y)=2y$，代入 $y=1$ 得 $2$。"},{"id":437,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $z=x\\mathrm{e}^{x+y}+(x+1)\\ln(1+y)$，则 $\\mathrm{d}z\\big|_{(1,0)}=$ ______。","a":"$2\\mathrm{e}\\,\\mathrm{d}x+(\\mathrm{e}+2)\\mathrm{d}y$","s":"分别求两个偏导在 $(1,0)$ 的值，再写成全微分。"},{"id":438,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $z=x^{3}y^{2}$，而 $x=s+3t$，$y=2s-t$，则 $\\frac{\\partial z}{\\partial s}=$ ______，$\\frac{\\partial z}{\\partial t}=$ ______。","a":"$(2s-t)(s+3t)^{2}(10s+9t)$；$(s+3t)^{2}(2s-t)(16s-15t)$","s":"链式法则或直接代入后求偏导。"},{"id":439,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $z=f(xy,y^{2})$（$f$ 具有二阶连续偏导），则 $\\mathrm{d}z=$ ______。","a":"$yf'_1\\,\\mathrm{d}x+(xf'_1+2yf'_2)\\,\\mathrm{d}y$","s":"$\\frac{\\partial z}{\\partial x}=yf'_1$，$\\frac{\\partial z}{\\partial y}=xf'_1+2yf'_2$。"},{"id":440,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $z=xf(xy^{2},y\\sin y)$（$f$ 具有一阶连续偏导），则 $\\frac{\\partial z}{\\partial x}=$ ______。","a":"$f(xy^{2},y\\sin y)+xy^{2}f'_1$","s":"乘积法则加链式法则，$x$ 对 $f$ 内部求导得 $y^2$。"},{"id":441,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\iint_{D}xy\\,\\mathrm{d}x\\mathrm{d}y=$ ______，其中 $D$ 是由抛物线 $y^{2}=x$ 与直线 $y=x-2$ 所围成的闭区域。","a":"$\\frac{45}{8}$","s":"交点为 $(1,-1)$、$(4,2)$，按 $y$ 型：$\\int_{-1}^{2}\\mathrm{d}y\\int_{y^2}^{y+2}xy\\,\\mathrm{d}x=\\frac{45}{8}$。"},{"id":442,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设区域 $D=\\{(x,y)\\mid x^{2}+y^{2}\\le1\\}$，则 $\\iint_{D}(x^{2}-2y)\\,\\mathrm{d}x\\mathrm{d}y=$ ______。","a":"$\\frac{\\pi}{4}$","s":"$2y$ 为奇函数积分为 0；极坐标下 $\\int_0^{2\\pi}\\mathrm{d}\\theta\\int_0^1r^3\\cos^2\\theta\\mathrm{d}r=\\frac{\\pi}{4}$。"},{"id":443,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设区域 $D$ 由圆周 $x^{2}+y^{2}=1$ 围成，则 $\\iint_{D}\\ln(1+x^{2}+y^{2})\\,\\mathrm{d}\\sigma=$ ______。","a":"$2\\pi\\ln2-\\pi$","s":"极坐标化为 $\\int_0^{2\\pi}\\mathrm{d}\\theta\\int_0^1r\\ln(1+r^2)\\mathrm{d}r$，内层用分部积分得 $\\ln2-\\frac12$。"},{"id":444,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设区域 $D$ 由曲线 $y=x^{3}$、$x=-1$、$y=1$ 围成，则 $\\iint_{D}(1-y^{3}\\sin x)\\,\\mathrm{d}x\\mathrm{d}y=$ ______。","a":"$2$","s":"$y^3\\sin x$ 关于 $x$ 为奇函数、区域对称，积分为 0；余下为区域面积 $\\int_{-1}^{1}(1-x^3)\\mathrm{d}x=2$。"},{"id":445,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"交换积分次序：$\\int_{1}^{2}\\mathrm{d}x\\int_{x}^{4x}f(x,y)\\,\\mathrm{d}y=$ ______。","a":"$\\int_{1}^{2}\\mathrm{d}y\\int_{1}^{y}f(x,y)\\,\\mathrm{d}x+\\int_{2}^{8}\\mathrm{d}y\\int_{\\frac{y}{4}}^{2}f(x,y)\\,\\mathrm{d}x$","s":"积分区域为 $1\\le x\\le2,\\ x\\le y\\le4x$。按 $y$ 分：$y\\in[1,2]$ 时 $x\\in[1,y]$；$y\\in[2,8]$ 时 $x\\in[\\frac y4,2]$。"},{"id":446,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"交换积分次序：$\\int_{1}^{2}\\mathrm{d}x\\int_{\\sqrt{x}}^{x}f(x,y)\\,\\mathrm{d}y+\\int_{2}^{4}\\mathrm{d}x\\int_{\\sqrt{x}}^{2}f(x,y)\\,\\mathrm{d}y=$ ______。","a":"$\\int_{1}^{2}\\mathrm{d}y\\int_{y}^{y^{2}}f(x,y)\\,\\mathrm{d}x$","s":"两区域合并后为 $1\\le y\\le2,\\ y\\le x\\le y^{2}$。"},{"id":447,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\int_{0}^{1}\\mathrm{d}y\\int_{y}^{1}\\frac{\\tan x}{x}\\,\\mathrm{d}x=$ ______。","a":"$-\\ln\\cos1$","s":"$\\frac{\\tan x}{x}$ 积不出，交换次序得 $\\int_0^1\\tan x\\,\\mathrm{d}x=-\\ln\\cos1$。"},{"id":448,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"二重积分 $\\int_{0}^{2}\\mathrm{d}x\\int_{2-x}^{\\sqrt{4-x^{2}}}f(x,y)\\,\\mathrm{d}y$ 的极坐标形式为 ______。","a":"$\\int_{0}^{\\frac{\\pi}{2}}\\mathrm{d}\\theta\\int_{\\frac{2}{\\sin\\theta+\\cos\\theta}}^{2}f(r\\cos\\theta,r\\sin\\theta)\\,r\\,\\mathrm{d}r$","s":"区域为圆 $r=2$ 与直线 $x+y=2$（即 $r=\\frac{2}{\\sin\\theta+\\cos\\theta}$）之间、第一象限部分。"},{"id":449,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设曲线 $L$ 是曲线 $y=\\sqrt{x}$ 从点 $O(0,0)$ 到点 $A(1,1)$ 的一段弧，则 $\\int_{L}(x-y^{4})\\,\\mathrm{d}x=$ ______。","a":"$\\frac{1}{6}$","s":"代入 $y=\\sqrt x$ 化为定积分 $\\int_0^1(x-x^2)\\mathrm{d}x=\\frac16$。"},{"id":450,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设曲线 $L$ 为圆周 $x^{2}+y^{2}=2$ 在第一象限所围成区域的正向边界，则 $\\oint_{L}x\\,\\mathrm{d}y-2y\\,\\mathrm{d}x=$ ______。","a":"$\\frac{3}{2}\\pi$","s":"$P=-2y,\\,Q=x$，$Q_x-P_y=3$，由格林公式得 $3S_D=3\\cdot\\frac14\\pi\\cdot2=\\frac32\\pi$。"},{"id":451,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设曲线 $L$ 为圆周 $x^{2}+y^{2}=4$（取顺时针方向），则 $\\oint_{L}y\\,\\mathrm{d}x-x\\,\\mathrm{d}y=$ ______。","a":"$8\\pi$","s":"顺时针为负向，$P=y,\\,Q=-x$，$Q_x-P_y=-2$，故 $=-\\iint(-2)\\mathrm{d}\\sigma=2S_D=8\\pi$。"},{"id":452,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设曲线 $L$ 是以点 $O(0,0)$、$A(1,1)$、$B(0,1)$ 为顶点的三角形区域的正向边界，则 $\\oint_{L}2x\\mathrm{e}^{y^{2}}\\,\\mathrm{d}x+x\\mathrm{e}^{-2y^{2}}\\,\\mathrm{d}y=$ ______。","a":"$-\\frac{1}{4}(\\mathrm{e}^{-2}-1)$","s":"$P=2x\\mathrm{e}^{y^2},\\,Q=x\\mathrm{e}^{-2y^2}$，$Q_x-P_y=\\mathrm{e}^{-2y^2}$，化为 $\\int_0^1y\\mathrm{e}^{-2y^2}\\mathrm{d}y$。"},{"id":453,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\sum_{n=1}^{\\infty}\\frac{1}{(n+1)(n+2)}=$ ______。","a":"$\\frac{1}{2}$","s":"裂项 $u_n=\\frac{1}{n+1}-\\frac{1}{n+2}$，部分和 $S_n=\\frac12-\\frac{1}{n+2}\\to\\frac12$。"},{"id":454,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $S_{n}$ 是级数 $\\sum_{n=1}^{\\infty}\\left(\\sqrt[n]{3}-\\sqrt[n+1]{3}\\right)$ 的前 $n$ 项和，则 $\\lim_{n\\to\\infty}S_{n}=$ ______。","a":"$2$","s":"裂项相消：$S_n=3-3^{\\frac{1}{n+1}}\\to3-1=2$。"},{"id":455,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"判断：若 $\\sum_{n=1}^{\\infty}u_{n}$ 发散，则 $\\lim_{n\\to\\infty}u_{n}\\ne0$。______（对、错）","a":"错","s":"反例：$u_n=\\frac1n$，级数发散但 $\\lim u_n=0$。"},{"id":456,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"若 $\\sum_{n=0}^{\\infty}u_{n}\\ (u_{n}\\ne0)$ 收敛，则 $\\lim_{n\\to\\infty}(1+u_{n})^{\\frac{2}{u_{n}}}=$ ______。","a":"$\\mathrm{e}^{2}$","s":"收敛必有 $u_n\\to0$，用重要极限得 $\\mathrm{e}^2$。"},{"id":457,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}\\sqrt{n}\\left(\\sqrt{n+1}-\\sqrt{n}\\right)$ 的敛散性为 ______。","a":"发散","s":"有理化后通项为 $\\frac{\\sqrt n}{\\sqrt{n+1}+\\sqrt n}\\to\\frac12\\ne0$，故发散。"},{"id":458,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{3^{n}}$ 的敛散性为 ______。","a":"收敛","s":"公比 $q=-\\frac13$，$|q|<1$ 的等比级数收敛。"},{"id":459,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{2^{n}}$ 的和为 ______。","a":"$\\frac{1}{3}$","s":"等比级数求和：$\\frac{1/2}{1-(-1/2)}=\\frac13$。"},{"id":460,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=2}^{\\infty}\\frac{(-1)^{n}+n^{2}}{n^{\\pi}}$ 的敛散性为 ______。","a":"收敛","s":"拆成 $\\sum\\frac{(-1)^n}{n^\\pi}$（绝对收敛）与 $\\sum\\frac{n^2}{n^\\pi}$（$p=\\pi-2>1$ 收敛），均收敛。"},{"id":461,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}\\frac{n+1}{\\sqrt{n^{4}+n}}$ 的敛散性为 ______。","a":"发散","s":"与 $\\sum\\frac1n$ 比较，极限为 1，同发散。"},{"id":462,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}\\frac{n^{4}}{n^{n}}$ 的敛散性为 ______。","a":"收敛","s":"比值判别法：$\\lim\\frac{u_{n+1}}{u_n}=0<1$。"},{"id":463,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}\\frac{3^{n}n!}{n^{n}}$ 的敛散性为 ______。","a":"发散","s":"比值判别法：$\\lim\\frac{u_{n+1}}{u_n}=\\frac{3}{\\mathrm{e}}>1$，发散。"},{"id":464,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}\\frac{n^{2}}{n!+n}$ 的敛散性为 ______。","a":"收敛","s":"比值判别法，极限为 0<1。"},{"id":465,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}n\\left(1-\\cos\\frac{1}{n}\\right)$ 的敛散性为 ______。","a":"发散","s":"通项与 $\\frac{1}{2n}$ 等价（$1-\\cos\\frac1n\\sim\\frac{1}{2n^2}$，乘 $n$ 得 $\\frac{1}{2n}$），与调和级数同发散。"},{"id":466,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}n\\sin\\frac{1}{n}\\ln\\left(1+\\frac{1}{n^{2}}\\right)$ 的敛散性为 ______。","a":"收敛","s":"通项与 $\\frac{1}{n^{2}}$ 为等价无穷小（极限为 1），与 $p=2$ 的 $p$ 级数同收敛。"},{"id":467,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}\\left(1-\\frac{1}{n}\\right)^{n^{2}}$ 的敛散性为 ______。","a":"收敛","s":"根值判别：$\\lim\\sqrt[n]{u_n}=(1-\\frac1n)^{n}\\to\\mathrm{e}^{-1}<1$。"},{"id":468,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{\\sqrt{n+1}}$ 的敛散性为 ______。","a":"条件收敛","s":"绝对值级数 $\\sum\\frac{1}{\\sqrt{n+1}}$ 发散（$p=\\frac12$），而交错级数由莱布尼茨准则收敛。"},{"id":469,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}\\frac{\\cos n\\alpha}{(n+1)^{2}}$ 的敛散性为 ______。","a":"绝对收敛","s":"$|\\cos n\\alpha|\\le1$，与 $\\sum\\frac{1}{(n+1)^2}$ 比较，绝对收敛。"},{"id":470,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"级数 $\\sum_{n=1}^{\\infty}(-1)^{n}\\frac{n}{3^{n-1}}$ 的敛散性为 ______。","a":"绝对收敛","s":"绝对值级数比值极限为 $\\frac13<1$，故收敛，原级数绝对收敛。"},{"id":471,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"幂级数 $\\sum_{n=1}^{\\infty}\\frac{(x-5)^{n}}{\\sqrt{n}}$ 的收敛域为 ______。","a":"$[4,6)$","s":"$R=1$，中心 5；$x=4$ 时交错级数收敛，$x=6$ 时 $\\sum\\frac{1}{\\sqrt n}$ 发散。"},{"id":472,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"幂级数 $\\sum_{n=1}^{\\infty}\\frac{x^{2n-1}}{3^{n}}$ 的收敛半径为 ______。","a":"$\\sqrt{3}$","s":"比值法得 $\\lim|\\frac{u_{n+1}}{u_n}|=\\frac{x^2}{3}$，令小于 1 得 $|x|<\\sqrt3$。"},{"id":473,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"幂级数 $\\sum_{n=1}^{\\infty}\\frac{(x-1)^{n}}{2^{n}\\cdot n}$ 的收敛域为 ______。","a":"$[-1,3)$","s":"$R=2$，中心 1；$x=-1$ 收敛（交错调和），$x=3$ 发散（调和）。"},{"id":474,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"幂级数 $\\sum_{n=1}^{\\infty}\\frac{2n-1}{2^{n}}x^{2n}$ 的收敛区间为 ______。","a":"$(-\\sqrt{2},\\sqrt{2})$","s":"比值法得 $\\lim|\\frac{u_{n+1}}{u_n}|=\\frac{x^2}{2}$，得 $R=\\sqrt2$。"},{"id":475,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"幂级数 $\\sum_{n=1}^{\\infty}\\left(1+\\frac{1}{n}\\right)^{n^{2}}x^{n}$ 的收敛区间为 ______。","a":"$\\left(-\\frac{1}{\\mathrm{e}},\\frac{1}{\\mathrm{e}}\\right)$","s":"根值法：$\\lim\\sqrt[n]{u_n}=\\mathrm{e}$，故 $R=\\frac1{\\mathrm{e}}$。"},{"id":476,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知幂级数 $\\sum_{n=1}^{\\infty}a_{n}(x-1)^{n}$ 的收敛半径是 $2$，则幂级数 $\\sum_{n=1}^{\\infty}a_{n}(x+1)^{n}$ 的收敛半径是 ______，收敛区间是 ______。","a":"$2$；$(-3,1)$","s":"作代换后系数不变，半径仍为 2；中心为 $-1$，区间为 $(-1-2,-1+2)$。"},{"id":477,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知幂级数 $\\sum_{n=1}^{\\infty}a_{n}x^{n}$ 在 $x=1$ 处条件收敛，则幂级数 $\\sum_{n=1}^{\\infty}a_{n}(x-3)^{n}$ 的收敛区间为 ______。","a":"$(2,4)$","s":"$x=1$ 处条件收敛说明收敛半径为 1，中心 3，得区间 $(2,4)$。"},{"id":478,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设幂级数 $\\sum_{n=1}^{\\infty}a_{n}\\left(x-\\frac{1}{2}\\right)^{n}$ 在 $x=2$ 处发散，在 $x=-1$ 处收敛，则幂级数 $\\sum_{n=1}^{\\infty}a_{n}(x-1)^{n}$ 的收敛域是 ______。","a":"$\\left[-\\frac{1}{2},\\frac{5}{2}\\right)$","s":"收敛半径 $R=\\frac32$；$x=-\\frac12$ 处收敛、$x=\\frac52$ 处发散。"},{"id":479,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\sum_{n=0}^{\\infty}\\frac{2^{n}x^{n}}{n!}$ 的和函数为 ______。","a":"$\\mathrm{e}^{2x}$，$x\\in\\mathbf{R}$","s":"利用 $\\sum\\frac{t^n}{n!}=\\mathrm{e}^t$，取 $t=2x$。"},{"id":480,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$\\sum_{n=0}^{\\infty}\\frac{(-1)^{n}x^{n}}{(2n)!}\\ (x>0)$ 的和函数为 ______。","a":"$\\cos\\sqrt{x}$，$x\\in(0,+\\infty)$","s":"利用 $\\cos t=\\sum\\frac{(-1)^nt^{2n}}{(2n)!}$，取 $t=\\sqrt x$。"},{"id":481,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"将 $f(x)=5^{x}$ 展开为 $x$ 的幂级数：______。","a":"$\\sum_{n=0}^{\\infty}\\frac{\\ln^{n}5}{n!}x^{n}$，$x\\in\\mathbf{R}$","s":"写成 $\\mathrm{e}^{x\\ln5}$ 后套 $\\mathrm{e}^t$ 的展开式。"},{"id":482,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"平行于向量 $\\boldsymbol{a}=(1,2,-1)$ 的单位向量为 ______。","a":"$\\pm\\left(\\frac{\\sqrt{6}}{6},\\frac{\\sqrt{6}}{3},-\\frac{\\sqrt{6}}{6}\\right)$","s":"$|\\boldsymbol a|=\\sqrt6$，平行单位向量为 $\\pm\\frac{1}{\\sqrt6}(1,2,-1)$。"},{"id":483,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设点 $M_{1}(1,\\sqrt{3},2)$ 和 $M_{2}(3,0,3)$，则向量 $\\overrightarrow{M_{1}M_{2}}$ 的模为 ______。","a":"$2\\sqrt{2}$","s":"$\\overrightarrow{M_1M_2}=(2,-\\sqrt3,1)$，模为 $\\sqrt{4+3+1}=2\\sqrt2$。"},{"id":484,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设 $\\boldsymbol{a}=2\\boldsymbol{i}-3\\boldsymbol{j}+\\boldsymbol{k}$，$\\boldsymbol{b}=3\\boldsymbol{i}+\\boldsymbol{j}-2\\boldsymbol{k}$，则 $\\boldsymbol{a}\\cdot\\boldsymbol{b}=$ ______，$\\boldsymbol{a}\\times\\boldsymbol{b}=$ ______，$\\boldsymbol{a}\\cdot(-2\\boldsymbol{b})=$ ______，$3\\boldsymbol{a}\\times2\\boldsymbol{b}=$ ______，$\\boldsymbol{a},\\boldsymbol{b}$ 夹角的余弦为 ______。","a":"$1$；$(5,7,11)$；$-2$；$(30,42,66)$；$\\frac{1}{14}$","s":"点积 $6-3-2=1$；叉积按行列式展开得 $(5,7,11)$；$|\\boldsymbol a|=|\\boldsymbol b|=\\sqrt{14}$。"},{"id":485,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"设向量 $\\boldsymbol{a}=(2,1,-3)$，则该向量的方向余弦 $\\cos\\alpha=$ ______，$\\cos\\beta=$ ______，$\\cos\\gamma=$ ______。","a":"$\\frac{\\sqrt{14}}{7}$；$\\frac{\\sqrt{14}}{14}$；$-\\frac{3\\sqrt{14}}{14}$","s":"$|\\boldsymbol a|=\\sqrt{14}$，方向余弦为各分量除以模。"},{"id":486,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知向量 $\\boldsymbol{a}=\\boldsymbol{i}+3\\boldsymbol{j}+2\\boldsymbol{k}$，$\\boldsymbol{b}=2\\boldsymbol{i}-\\boldsymbol{j}+\\boldsymbol{k}$，$\\boldsymbol{c}=\\boldsymbol{i}+2\\boldsymbol{j}$，则 $(\\boldsymbol{a}\\times\\boldsymbol{b})\\cdot\\boldsymbol{c}=$ ______。","a":"$11$","s":"$\\boldsymbol a\\times\\boldsymbol b=(5,3,-7)$，与 $(1,2,0)$ 点积为 $5+6=11$。"},{"id":487,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知 $\\boldsymbol{a}=(3,-2,1)$，$\\boldsymbol{b}=(1,-3,\\lambda)$，且 $\\boldsymbol{a}\\perp\\boldsymbol{b}$，则 $\\lambda=$ ______。","a":"$-9$","s":"垂直即点积为零：$3+6+\\lambda=0$，得 $\\lambda=-9$。"},{"id":488,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知 $|\\boldsymbol{a}|=2$，$|\\boldsymbol{b}|=4$，且 $\\boldsymbol{a}\\perp\\boldsymbol{b}$，则 $(3\\boldsymbol{a}-\\boldsymbol{b})\\cdot(2\\boldsymbol{a}+\\boldsymbol{b})=$ ______。","a":"$8$","s":"展开得 $6|\\boldsymbol a|^2-|\\boldsymbol b|^2=24-16=8$（交叉项因垂直为 0）。"},{"id":489,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"已知 $A(1,0,3)$，$B(0,1,3)$，$O$ 为坐标原点，则 $\\triangle OAB$ 的面积 $S=$ ______。","a":"$\\frac{\\sqrt{19}}{2}$","s":"$\\overrightarrow{OA}\\times\\overrightarrow{OB}=(-3,-3,1)$，面积为其模的一半。"},{"id":490,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"过点 $(2,-3,0)$ 且与平面 $2x-3y+7z-12=0$ 平行的平面方程为 ______。","a":"$2x-3y+7z=13$","s":"法向量取 $(2,-3,7)$，代入点得 $2(x-2)-3(y+3)+7z=0$，即 $2x-3y+7z=13$（原书印为 $2x+3y+7z=13$，系符号印刷错误，以解析推导为准）。"},{"id":491,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"过点 $(1,3,-2)$ 且垂直于直线 $OA$（其中 $O$ 为原点，$A(1,3,-2)$）的平面方程为 ______。","a":"$x+3y-2z=14$","s":"取法向量 $\\boldsymbol n=(1,3,-2)$，点法式展开得 $x+3y-2z=14$。"},{"id":492,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"过 $A(3,-1,2)$、$B(1,2,2)$、$C(1,-1,0)$ 三点的平面方程为 ______。","a":"$3x+2y-3z=1$","s":"法向量 $\\overrightarrow{AB}\\times\\overrightarrow{AC}=(-6,-4,6)$，化简后得 $3x+2y-3z=1$。"},{"id":493,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"过点 $(1,0,-1)$ 且平行于向量 $\\boldsymbol{a}=(2,1,3)$ 和 $\\boldsymbol{b}=(1,-1,1)$ 的平面方程为 ______。","a":"$4x+y-3z=7$","s":"法向量 $\\boldsymbol a\\times\\boldsymbol b=(4,1,-3)$，点法式得 $4x+y-3z=7$。"},{"id":494,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"三个平面 $x+2y+3z=0$，$2x+y-z=1$，$x+2y-2z=4$ 的交点为 ______。","a":"$\\left(-\\frac{2}{3},\\frac{23}{15},-\\frac{4}{5}\\right)$","s":"联立三元一次方程组求解。"},{"id":495,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"点 $(-1,2,3)$ 到平面 $3x+2y+z-5=0$ 的距离为 ______。","a":"$\\frac{\\sqrt{14}}{14}$","s":"点到平面距离公式：$\\frac{|-3+4+3-5|}{\\sqrt{9+4+1}}=\\frac{1}{\\sqrt{14}}$。"},{"id":496,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"过点 $(-2,3,1)$ 且平行于直线 $\\frac{x-2}{3}=\\frac{y}{2}=\\frac{z+1}{5}$ 的直线方程为 ______。","a":"$\\frac{x+2}{3}=\\frac{y-3}{2}=\\frac{z-1}{5}$","s":"方向向量取 $(3,2,5)$，用点向式写出。"},{"id":497,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"过两点 $M_{1}(1,3,-2)$ 和 $M_{2}(0,2,-3)$ 的直线方程为 ______。","a":"$x-1=y-3=z+2$","s":"方向向量 $\\overrightarrow{M_1M_2}=(-1,-1,-1)$，约去公因子后对称式化简。"},{"id":498,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"直线 $\\begin{cases}x-2y+3z=5,\\\\ 4x+2y-z=2\\end{cases}$ 的参数式为 ______。","a":"$\\begin{cases}x=t,\\\\ y=-\\frac{13}{4}t+\\frac{11}{4},\\\\ z=-\\frac{5}{2}t+\\frac{7}{2}\\end{cases}$","s":"令 $x=t$，解出 $y,z$ 关于 $t$ 的表达式。"},{"id":499,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"过点 $(1,-2,0)$ 且与直线 $\\begin{cases}2x-y+z-5=0,\\\\ x+2y-3z+2=0\\end{cases}$ 垂直的平面方程为 ______。","a":"$x+7y+5z=-13$","s":"直线方向向量 $\\boldsymbol s=\\boldsymbol n_1\\times\\boldsymbol n_2=(1,7,5)$，即所求平面法向量，点法式得 $x+7y+5z=-13$。"},{"id":500,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"直线 $L_{1}:\\begin{cases}x-y=1,\\\\ 2y+z=5\\end{cases}$ 与直线 $L_{2}:\\frac{x-2}{-1}=\\frac{y-3}{2}=\\frac{z+4}{-1}$ 的夹角为 ______。","a":"$\\frac{\\pi}{3}$","s":"$\\boldsymbol s_1=(-1,-1,2)$，$\\boldsymbol s_2=(-1,2,-1)$，$\\cos\\theta=\\frac{|\\boldsymbol s_1\\cdot\\boldsymbol s_2|}{|\\boldsymbol s_1||\\boldsymbol s_2|}=\\frac12$。"},{"id":501,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"过点 $(0,3,2)$ 且与两平面 $x-2z=3$ 和 $y+z=1$ 平行的直线方程为 ______。","a":"$\\frac{x}{2}=\\frac{y-3}{-1}=\\frac{z-2}{1}$","s":"方向向量取两平面法向量的叉积 $(2,-1,1)$。"},{"id":502,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"直线 $\\frac{x+2}{3}=\\frac{y-5}{-2}=\\frac{z+7}{4}$ 和平面 $2x-y-2z=7$ 的位置关系是 ______。（平行、垂直、重合）","a":"平行","s":"$\\boldsymbol s\\cdot\\boldsymbol n=6+2-8=0$，故 $\\boldsymbol s\\perp\\boldsymbol n$；又点 $(-2,5,-7)$ 不在平面上，故平行不重合。"},{"id":503,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"点 $A(2,0,-1)$ 在平面 $2x+y-z+3=0$ 上的投影为 ______。","a":"$\\left(-\\frac{2}{3},-\\frac{4}{3},\\frac{1}{3}\\right)$","s":"过 $A$ 作平面法向直线，与平面联立解得投影点。"},{"id":504,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$x^{2}+y^{2}=1$ 表示 ______。（空间解析几何图形）","a":"圆柱面","s":"缺 $z$，沿 $z$ 轴平移不变，故为母线平行于 $z$ 轴的圆柱面。"},{"id":505,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$x^{2}-y^{2}=1$ 表示 ______。（空间解析几何图形）","a":"双曲柱面","s":"缺 $z$，母线平行于 $z$ 轴的双曲柱面。"},{"id":506,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$x=1$ 表示 ______。（空间解析几何图形）","a":"与 $yOz$ 面平行的平面","s":"缺 $y,z$，为过 $(1,0,0)$ 且平行于 $yOz$ 面的平面。"},{"id":507,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$y=2x+1$ 表示 ______。（空间解析几何图形）","a":"平行于 $z$ 轴的平面","s":"缺 $z$，为母线平行于 $z$ 轴的平面。"},{"id":508,"ch":101,"chName":"函数极限连续(强化)","sec":"填空题","q":"$y^{2}=2x$ 表示 ______。（空间解析几何图形）","a":"抛物柱面","s":"缺 $z$，母线平行于 $z$ 轴的抛物柱面。"},{"id":509,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"已知函数 $f(x)=\\begin{cases}\\frac{1}{x},&|x|>1,\\\\ 0,&|x|\\le1,\\end{cases}$ 则 $f[f(800)]=$（ ） A. $800$  B. $\\frac{1}{800}$  C. $1$  D. $0$","a":"D","s":"$f(800)=\\frac{1}{800}$，$\\left|\\frac{1}{800}\\right|\\le1$，故 $f\\left[\\frac{1}{800}\\right]=0$。"},{"id":510,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"函数 $y=\\mathrm{e}^{\\frac{1}{x}}+\\frac{1}{\\sqrt{4-x^{2}}}+\\arcsin(x-1)$ 的定义域是（ ） A. $x\\in[-2,0]\\cup[0,2]$  B. $x\\in[0,2]$  C. $x\\in[-2,0)\\cup(0,2]$  D. $x\\in(0,2)$","a":"D","s":"需 $x\\ne0$、$4-x^2>0$、$-1\\le x-1\\le1$，交集为 $(0,2)$。"},{"id":511,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"下列函数为偶函数的是（ ） A. $\\sin\\left(x^{2}\\cot x\\right)$  B. $f(x)+f(-x)$  C. $\\frac{\\mathrm{e}^{x}-1}{\\mathrm{e}^{x}+1}$  D. $\\ln\\left(x+\\sqrt{1+x^{2}}\\right)$","a":"B","s":"令 $F(x)=f(x)+f(-x)$，则 $F(-x)=F(x)$ 为偶函数；A、C、D 均为奇函数。"},{"id":512,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"函数 $f(x)=2\\cos\\frac{x}{3}+3\\sin\\frac{x}{2}$ 的周期为（ ） A. $\\pi$  B. $2\\pi$  C. $12\\pi$  D. $24\\pi$","a":"C","s":"两周期分别为 $6\\pi$ 与 $4\\pi$，最小公倍数为 $12\\pi$。"},{"id":513,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"下列说法正确的是（ ） A. 若 $f(x)$ 在 $x=x_{0}$ 处连续，则 $f(x)$ 在 $x=x_{0}$ 处可微  B. 若 $f(x)$ 在 $x=x_{0}$ 处连续，则 $f(x)$ 在 $x=x_{0}$ 处有极限  C. 若 $f(x)$ 在 $x=x_{0}$ 处有定义，则 $f(x)$ 在 $x=x_{0}$ 处极限存在  D. 若 $f(x)$ 在 $x=x_{0}$ 处极限存在，则 $f(x)$ 在 $x=x_{0}$ 处有定义","a":"B","s":"连续必有极限；连续不一定可导，有定义或极限存在都不保证连续。"},{"id":514,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"下列说法正确的是（ ） A. 若 $\\lim\\limits_{x\\to x_{0}}f(x)$ 与 $\\lim\\limits_{x\\to x_{0}}g(x)$ 都存在，则 $\\lim\\limits_{x\\to x_{0}}[f(x)+g(x)]$ 存在  B. 若 $\\lim\\limits_{x\\to x_{0}}f(x)$ 与 $\\lim\\limits_{x\\to x_{0}}g(x)$ 都存在，则 $\\lim\\limits_{x\\to x_{0}}\\frac{f(x)}{g(x)}$ 存在  C. 若 $\\lim\\limits_{x\\to x_{0}}f(x)$ 存在、$\\lim\\limits_{x\\to x_{0}}g(x)$ 不存在，则 $\\lim\\limits_{x\\to x_{0}}[f(x)+g(x)]$ 存在  D. 若两个极限都不存在，则 $\\lim\\limits_{x\\to x_{0}}[f(x)+g(x)]$ 不存在","a":"A","s":"存在±存在必存在；B 需 $g$ 的极限非零；C、D 均不一定。"},{"id":515,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"下列极限计算中正确的是（ ） A. $\\lim\\limits_{n\\to\\infty}(-1)^{n}=-1$  B. $\\lim\\limits_{n\\to\\infty}\\sin n=\\infty$  C. $\\lim\\limits_{x\\to1}\\frac{\\sin(x-1)}{\\mathrm{e}^{x}|x-1|}=\\frac{1}{\\mathrm{e}}$  D. $\\lim\\limits_{x\\to\\infty}\\frac{1}{x}\\arctan x=0$","a":"D","s":"A、B 极限不存在；C 左右极限分别为 $\\frac1{\\mathrm{e}}$ 与 $-\\frac1{\\mathrm{e}}$，极限不存在；D 为无穷小乘有界量，等于 0。"},{"id":516,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"下列极限运算中正确的是（ ） A. $\\lim\\limits_{x\\to0}\\left(\\frac{1}{x}-\\frac{1}{\\sin x}\\right)=\\lim\\limits_{x\\to0}\\left(\\frac{1}{x}-\\frac{1}{x}\\right)=0$  B. $\\lim\\limits_{x\\to1}\\frac{\\sin\\pi x}{3x^{2}-2x-1}=\\lim\\limits_{x\\to1}\\frac{\\pi\\cos\\pi x}{6x-2}=\\lim\\limits_{x\\to1}\\frac{-\\pi^{2}\\sin\\pi x}{6}=0$  C. $\\lim\\limits_{x\\to0}\\frac{\\cos x-1}{x^{2}\\mathrm{e}^{x}}=\\lim\\limits_{x\\to0}\\frac{\\cos x-1}{x^{2}}=\\lim\\limits_{x\\to0}\\frac{-\\frac{1}{2}x^{2}}{x^{2}}=-\\frac{1}{2}$  D. $\\lim\\limits_{x\\to\\infty}\\frac{x+\\sin x}{x+\\cos x}=\\lim\\limits_{x\\to\\infty}\\frac{1+\\cos x}{1-\\sin x}$ 不存在","a":"C","s":"A 加减法不能等价代换（正解为 0）；B 洛必达后应得 $-\\frac{\\pi}{4}$；D 用洛必达条件不满足，正解为 1；C 正确。"},{"id":517,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"极限 $\\lim\\limits_{x\\to+\\infty}x^{2}\\mathrm{e}^{-x}=$（ ） A. $0$  B. $1$  C. $2$  D. $\\infty$","a":"A","s":"化为 $\\frac{x^2}{\\mathrm{e}^x}$，两次洛必达得 0。"},{"id":518,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"极限 $\\lim\\limits_{x\\to+\\infty}2x\\left(\\sqrt{1+x^{2}}-x\\right)=$（ ） A. $3$  B. $2$  C. $1$  D. $0$","a":"C","s":"有理化得 $\\lim\\frac{2x}{\\sqrt{1+x^2}+x}=\\frac{2}{2}=1$。"},{"id":519,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"极限 $\\lim\\limits_{x\\to\\infty}\\left(\\frac{x^{3}+3x^{2}}{x^{2}+x+2}-x\\right)=$（ ） A. $0$  B. $1$  C. $2$  D. $3$","a":"C","s":"通分得 $\\frac{2x^2-2x}{x^2+x+2}\\to2$。"},{"id":520,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"极限 $\\lim\\limits_{n\\to\\infty}\\left(\\frac{n}{n^{2}+1}+\\frac{n}{n^{2}+2}+\\frac{n}{n^{2}+3}\\right)=$（ ） A. $1$  B. $0$  C. $2$  D. 不存在","a":"B","s":"每项都趋于 0，故极限为 $0+0+0=0$。"},{"id":521,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"设函数 $f(x)=2^{x}$，则 $\\lim\\limits_{n\\to\\infty}\\frac{\\ln[f(1)f(2)\\cdots f(n)]}{n^{2}}=$（ ） A. $\\frac{1}{2}\\ln2$  B. $\\ln2$  C. $1$  D. $0$","a":"A","s":"取对数得 $\\ln2\\cdot\\frac{n(n+1)}{2}$，除以 $n^2$ 取极限得 $\\frac12\\ln2$。"},{"id":522,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"下列说法中正确的是（ ） A. 若 $\\lim\\limits_{x\\to a}\\frac{f(x)}{g(x)}=1$，则 $f(x),g(x)$ 是 $x\\to a$ 时的等价无穷小  B. 若 $f(x)$ 是 $x\\to a$ 时的无穷小量，则 $\\lim\\limits_{x\\to a}\\frac{1}{f(x)}=\\infty$  C. 无穷小量是很小的数  D. 最高阶的无穷小是 $0$","a":"D","s":"A 需两者本身为无穷小；B 中 $f$ 可能取零值或两侧异号；C 无穷小是极限为 0 的变量；D 正确。"},{"id":523,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"已知 $\\lim\\limits_{x\\to0}\\frac{1-\\cos x}{\\ln(1+x^{3})}(a-\\mathrm{e}^{x})=b$，则（ ） A. $a=1,b=-\\frac{1}{2}$  B. $a=1,b=\\frac{1}{2}$  C. $a=0,b=\\frac{1}{2}$  D. $a=0,b=-\\frac{1}{2}$","a":"A","s":"分母为 $x^3$，分子中 $1-\\cos x\\sim\\frac{x^2}{2}$，须 $a-\\mathrm{e}^x\\to0$ 才使极限为 $b$，得 $a=1$，$b=-\\frac12$。"},{"id":524,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"当 $x\\to0$ 时，$\\sin3x-3\\sin x$ 是 $x^{3}$ 的（ ） A. 高阶无穷小  B. 同阶无穷小，但不是等价无穷小  C. 低阶无穷小  D. 等价无穷小","a":"B","s":"$\\lim\\frac{\\sin3x-3\\sin x}{x^3}=-4$，为非零常数，故同阶但不等价。"},{"id":525,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"当 $x\\to0$ 时，下列选项中与 $\\mathrm{e}^{x^{4}-2x}-1$ 是同阶无穷小的是（ ） A. $(1+x)^{x^{2}}-1$  B. $\\sqrt{1+3x}-1$  C. $x^{2}\\ln(1+x^{2})$  D. $\\mathrm{e}^{x^{4}}-1$","a":"B","s":"$\\mathrm{e}^{x^2-2x}-1\\sim-2x$；$\\sqrt{1+3x}-1\\sim\\frac32x$，比值 $-\\frac43$ 为非零常数，同阶。"},{"id":526,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"$x\\to0$ 时，$\\sec x-1$ 是 $\\frac{x^{2}}{2}$ 的（ ） A. 高阶无穷小  B. 同阶但非等价无穷小  C. 低阶无穷小  D. 等价无穷小","a":"D","s":"$\\sec x-1=\\frac{1-\\cos x}{\\cos x}\\sim\\frac{x^2}{2}$，比值为 1，等价。"},{"id":527,"ch":101,"chName":"函数极限连续(强化)","sec":"选择题","q":"当 $x\\to0$ 时，下列选项中与 $\\sin x-x$ 是等价无穷小的是（ ） A. $\\frac{1}{6}x\\arctan x^{2}$  B. $x-\\ln(1+x)$  C. $\\frac{1}{3}\\left(\\mathrm{e}^{\\sin x}-\\mathrm{e}^{\\tan x}\\right)$  D. $\\int_{0}^{x}t\\sin t\\,\\mathrm{d}t$","a":"C","s":"$\\sin x-x\\sim-\\frac{x^3}{6}$；C 中 $\\mathrm{e}^{\\sin x}-\\mathrm{e}^{\\tan x}\\sim\\sin x-\\tan x$，比值极限为 1。"},{"id":528,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"当 $x\\to0$ 时，下列无穷小中最高阶的是（ ） A. $\\sqrt[3]{1+2x^{2}}-1$  B. $\\mathrm{e}^{\\cos x}-\\mathrm{e}$  C. $\\mathrm{e}^{\\sin x}-1$  D. $x\\ln(\\cos x)$","a":"D","s":"A 为 $\\frac23x^2$ 阶；B 为 $-\\frac{\\mathrm{e}}{2}x^2$ 阶；C 为 $x^2$ 阶；D $\\sim-\\frac12x^3$，阶数最高。"},{"id":529,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设 $f(x)=2^{x}+3^{x}-2$，则当 $x\\to0$ 时，有（ ） A. $f(x)$ 与 $x$ 是等价无穷小  B. $f(x)$ 与 $x$ 同阶但非等价无穷小  C. $f(x)$ 是比 $x$ 的高阶无穷小  D. $f(x)$ 是比 $x$ 的低阶无穷小","a":"B","s":"$\\lim\\limits_{x\\to0}\\frac{f(x)}{x}=\\ln2+\\ln3=\\ln6\\ne1$，故同阶但非等价。"},{"id":530,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"当 $x\\to1$ 时，函数 $\\frac{x^{2}-1}{x-1}\\mathrm{e}^{\\frac{1}{x-1}}$ 的极限（ ） A. 等于 $2$  B. 等于 $0$  C. 为 $\\infty$  D. 不存在，但不为 $\\infty$","a":"D","s":"右极限为 $+\\infty$，左极限为 $0$，故极限不存在也不为 $\\infty$。"},{"id":531,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"若 $f(x)=\\begin{cases}x^{2}\\sin\\frac{1}{x},&x>0,\\\\ a+(1+x)^{x},&x\\le0,\\end{cases}$ 在 $x=0$ 处连续，则 $a=$（ ） A. $-1$  B. $1$  C. $2$  D. $3$","a":"A","s":"右极限 $\\lim\\limits_{x\\to0^+}x^2\\sin\\frac1x=0$；左极限 $\\lim\\limits_{x\\to0^-}\\left[a+(1+x)^x\\right]=a+1$。由连续得 $a+1=0$，即 $a=-1$。"},{"id":532,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"函数 $f(x)=\\begin{cases}x^{2},&x>0,\\\\ x\\sin\\frac{1}{x},&x<0\\end{cases}$ 在 $x=0$ 处的间断类型为（ ） A. 第二类间断点  B. 可去间断点  C. 跳跃间断点  D. 不是间断点","a":"B","s":"左右极限均为 0 而 $f(0)$ 无定义，故为可去间断点。"},{"id":533,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"已知 $f(x)=\\frac{a-\\mathrm{e}^{x}}{x+\\sin x}$ 在 $x=0$ 处为可去间断点，则 $a=$（ ） A. $1$  B. $2$  C. $3$  D. $4$","a":"A","s":"分母趋于 0 而极限存在，须分子趋于 0，即 $a-1=0$，$a=1$。"},{"id":534,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设函数 $f(x)=\\lim\\limits_{n\\to\\infty}\\frac{1+x}{1+x^{2n}}$，则 $f(x)$ 的间断点个数为（ ） A. $0$  B. $1$  C. $2$  D. $3$","a":"B","s":"$|x|<1$ 时 $f=1+x$；$|x|>1$ 时 $f=0$；$x=\\pm1$ 时分别为 $1$ 与 $0$。仅 $x=1$ 为间断点，共 1 个。"},{"id":535,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设函数 $f(x)$ 在 $x=0$ 处连续，下列命题错误的是（ ） A. 若 $\\lim\\limits_{x\\to0}\\frac{f(x)}{x}$ 存在，则 $f(0)=0$  B. 若 $\\lim\\limits_{x\\to0}\\frac{f(x)+f(-x)}{x}$ 存在，则 $f(0)=0$  C. 若 $\\lim\\limits_{x\\to0}\\frac{f(x)}{x}$ 存在，则 $f'(0)$ 存在  D. 若 $\\lim\\limits_{x\\to0}\\frac{f(x)-f(-x)}{x}$ 存在，则 $f'(0)$ 存在","a":"D","s":"A、C 中该极限即 $f'(0)$，且必得 $f(0)=0$；B 由连续性得 $2f(0)=0$；D 中该极限不能确定 $f(0)$ 的值，取 $f(x)=|x|$ 可知推不出 $f'(0)$ 存在。"},{"id":536,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设 $f'(1)=-1$，则极限 $\\lim\\limits_{h\\to0}\\frac{h}{f(1-2\\tan h)-f(1)}=$（ ） A. $-2$  B. $-\\frac{1}{2}$  C. $2$  D. $\\frac{1}{2}$","a":"D","s":"原式 $=\\frac{1}{\\lim\\limits_{h\\to0}\\frac{f(1-2\\tan h)-f(1)}{h}}=\\frac{1}{-2f'(1)}=\\frac12$。"},{"id":537,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"已知函数 $y=f(x)$ 连续且 $\\lim\\limits_{x\\to1}\\frac{f(x)}{x-1}=2$，则函数在 $x=1$ 处的法线方程为（ ） A. $y=2x+\\frac{1}{2}$  B. $y=-2x+\\frac{1}{2}$  C. $y=\\frac{1}{2}x+\\frac{1}{2}$  D. $y=-\\frac{1}{2}x+\\frac{1}{2}$","a":"D","s":"由极限存在且分母趋于 0 得 $f(1)=0$，且 $f'(1)=2$，切线斜率 2，法线斜率 $-\\frac12$，法线 $y=-\\frac12(x-1)$。"},{"id":538,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设函数 $f(x)$ 在 $x=0$ 处可导，且 $f(0)=0$，则 $\\lim\\limits_{x\\to0}\\frac{x^{2}f(x)-2f(x^{3})}{x^{3}}=$（ ） A. $-2f'(0)$  B. $-f'(0)$  C. $f'(0)$  D. $0$","a":"B","s":"拆项得 $\\lim\\frac{f(x)}{x}-2\\lim\\frac{f(x^3)}{x^3}=f'(0)-2f'(0)=-f'(0)$。"},{"id":539,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"函数 $f(x)=(x^{2}+x-2)|x^{2}-x|$ 不可导点的个数是（ ） A. $3$  B. $2$  C. $1$  D. $0$","a":"C","s":"$f=(x+2)(x-1)|x||x-1|$，可疑点为 $x=0,1$；$x=0$ 处系数 $-2\\ne0$ 不可导，$x=1$ 处系数为 0 可导，故仅 1 个。"},{"id":540,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"若函数 $y=2x^{4}$ 在 $(x_{0},y_{0})$ 处切线斜率等于 $1$，则点 $(x_{0},y_{0})$ 的坐标为（ ） A. $\\left(\\frac{1}{8},\\frac{1}{2}\\right)$  B. $\\left(\\frac{1}{2},\\frac{1}{8}\\right)$  C. $\\left(\\frac{1}{2},\\frac{1}{2}\\right)$  D. $\\left(-\\frac{1}{8},-\\frac{1}{2}\\right)$","a":"B","s":"$y'=8x^3=1$ 得 $x_0=\\frac12$，$y_0=2\\cdot\\frac1{16}=\\frac18$。"},{"id":541,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"下列计算正确的是（ ） A. $\\left[\\ln\\left(x+\\sqrt{1+x^{2}}\\right)\\right]'=\\frac{1}{\\sqrt{1+x^{2}}}$  B. $\\left[f''(0)\\right]'=f'''(0)$  C. $\\left[\\ln f(x)\\right]'=\\frac{1}{f(x)}$  D. $\\left[f^{2}(x)\\right]'=2f(x)$","a":"A","s":"B 中 $f''(0)$ 为常数，导数为 0；C 漏乘 $f'(x)$；D 漏乘 $f'(x)$；A 正确。"},{"id":542,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"已知 $y=f\\left(\\frac{3x-2}{3x+2}\\right)$，$f'(x)=\\arctan x^{2}$，则 $\\left.\\frac{\\mathrm{d}y}{\\mathrm{d}x}\\right|_{x=0}=$（ ） A. $\\frac{3}{4}\\pi$  B. $\\frac{\\pi}{2}$  C. $\\frac{\\pi}{4}$  D. $\\pi$","a":"A","s":"复合求导 $y'=f'\\left(\\frac{3x-2}{3x+2}\\right)\\cdot\\frac{12}{(3x+2)^2}$，代入 $x=0$ 得 $\\arctan1\\cdot3=\\frac{3\\pi}{4}$。"},{"id":543,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设函数 $y=y(x)$ 由 $y=\\tan(x+y)$ 所确定，则 $y'=$（ ） A. $1+\\frac{1}{y^{2}}$  B. $-\\frac{1}{y^{2}}-1$  C. $1-\\frac{1}{y^{2}}$  D. $\\frac{1}{y^{2}}$","a":"B","s":"两边求导 $y'=\\sec^2(x+y)(1+y')$，解出 $y'=\\frac{\\sec^2(x+y)}{1-\\sec^2(x+y)}=-\\frac{1+y^2}{y^2}$。"},{"id":544,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设 $f''(t)\\ne0$，有 $\\begin{cases}x=f'(t),\\\\ y=tf'(t)-f(t),\\end{cases}$ 则 $\\frac{\\mathrm{d}^{2}y}{\\mathrm{d}x^{2}}=$（ ） A. $1$  B. $\\frac{1}{f'(t)}$  C. $\\frac{1}{f''(t)}$  D. $-\\frac{1}{f''(t)}$","a":"C","s":"$\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{tf''(t)}{f''(t)}=t$，再对 $t$ 求导除以 $x'(t)=f''(t)$ 得 $\\frac{1}{f''(t)}$。"},{"id":545,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设 $y=(1+x^{2})^{\\sin x}$，则 $y'=$（ ） A. $y\\left[\\cos x\\ln(1+x^{2})+\\frac{2x\\sin x}{1+x^{2}}\\right]$  B. $y\\left[\\cos x\\ln(1+x^{2})-\\frac{2x\\sin x}{1+x^{2}}\\right]$  C. $y\\left[\\cos x\\ln(1+x^{2})+\\frac{\\sin x}{1+x^{2}}\\right]$  D. $y\\left[\\cos x\\ln(1+x^{2})-\\frac{\\sin x}{1+x^{2}}\\right]$","a":"A","s":"取对数求导：$\\ln y=\\sin x\\ln(1+x^2)$，$\\frac{y'}{y}=\\cos x\\ln(1+x^2)+\\frac{2x\\sin x}{1+x^2}$。"},{"id":546,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设 $y=x^{50}\\left(1+x^{50}\\right)$，则 $y^{(100)}=$（ ） A. $0$  B. $100!$  C. $99!$  D. $1$","a":"B","s":"$y=x^{50}+x^{100}$，对多项式求 100 阶导，仅 $x^{100}$ 项留存，得 $100!$。"},{"id":547,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"曲线 $y=\\frac{x^{2}+x}{x^{2}-1}$ 的水平渐近线和垂直渐近线条数为（ ） A. $0$  B. $1$  C. $2$  D. $3$","a":"C","s":"$x\\to1$ 时为无穷大，$x=1$ 为垂直渐近线；$x\\to-1$ 时极限为 $\\frac12$，不是垂直渐近线；$x\\to\\infty$ 时 $y\\to1$，$y=1$ 为水平渐近线，共 2 条。"},{"id":548,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"曲线 $y=\\frac{x^{2}+1}{\\sqrt{x^{2}-1}}$ 的垂直渐近线条数为（ ） A. $1$  B. $2$  C. $3$  D. $4$","a":"B","s":"$x\\to1$ 与 $x\\to-1$ 时函数值均趋于 $+\\infty$，故 $x=1$、$x=-1$ 两条垂直渐近线。"},{"id":549,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"若 $f(-x)=f(x)$，且 $x>0$ 时 $f'(x)>0$，$f''(x)<0$，则 $x<0$ 时（ ） A. $f'(x)>0,f''(x)>0$  B. $f'(x)>0,f''(x)<0$  C. $f'(x)<0,f''(x)>0$  D. $f'(x)<0,f''(x)<0$","a":"D","s":"偶函数图象关于 $y$ 轴对称，右半支递增且上凸，则左半支递减且上凸，即 $f'<0$、$f''<0$。"},{"id":550,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设 $y=f(x)$ 在区间 $[0,1]$ 上不恒为常数且连续可导，若 $f(0)=f(1)$，则在开区间 $(0,1)$ 内有（ ） A. $f''(x)$ 恒为零  B. $f'(x)>0$  C. $f''(x)<0$  D. 在 $(0,1)$ 内存在两点 $\\xi_{1}$ 和 $\\xi_{2}$，使 $f'(\\xi_{1})$ 与 $f'(\\xi_{2})$ 异号","a":"D","s":"不恒为常数，取 $f(c)\\ne f(0)$，在 $[0,c]$、$[c,1]$ 上用拉格朗日中值定理得两个异号的导数值。"},{"id":551,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"下列说法中不正确的是（ ） A. $f'(x)\\mathrm{d}x=\\mathrm{d}f(x)$  B. $\\left(\\int f'(x)\\mathrm{d}x\\right)'=f(x)$  C. $\\mathrm{d}\\int f(x)\\mathrm{d}x=f(x)\\mathrm{d}x$  D. $\\int f'(x)\\mathrm{d}x=f(x)+C$","a":"B","s":"$\\int f'(x)\\mathrm{d}x=f(x)+C$，再求导得 $f'(x)$ 而非 $f(x)$，故 B 错。"},{"id":552,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设曲线在 $y$ 轴的截距为 $1$ 且在任意一点处的切线斜率为 $3x^{2}$，则曲线方程为（ ） A. $y=6x+1$  B. $y=6x$  C. $y=x^{3}+1$  D. $y=x^{3}$","a":"C","s":"$y'=3x^2$ 积分得 $y=x^3+C$，再由 $y(0)=1$ 得 $C=1$。"},{"id":553,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"已知 $f(x)=\\sin x$，则 $\\int\\frac{f'(\\arcsin x)}{\\sqrt{1-x^{2}}}\\mathrm{d}x=$（ ） A. $\\arcsin x+C$  B. $\\sin x+C$  C. $x+C$  D. $\\frac{1}{\\sqrt{1-x^{2}}}+C$","a":"C","s":"凑微分得 $\\int f'(\\arcsin x)\\mathrm{d}(\\arcsin x)=f(\\arcsin x)+C=\\sin(\\arcsin x)+C=x+C$。"},{"id":554,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"不定积分 $\\int\\frac{(\\ln x-2)^{3}}{x}\\mathrm{d}x=$（ ） A. $3(\\ln x-2)^{2}+C$  B. $\\frac{1}{4}(\\ln x-2)^{4}+C$  C. $(\\ln x-2)^{2}+C$  D. $(\\ln x-2)^{4}+C$","a":"B","s":"凑微分 $\\mathrm{d}(\\ln x-2)=\\frac{\\mathrm{d}x}{x}$，得 $\\frac14(\\ln x-2)^4+C$。"},{"id":555,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"若 $\\int xf'(x)\\mathrm{d}x=\\ln(1+x^{2})+C$，则 $\\int\\frac{1}{f(x)}\\mathrm{d}x=$（ ） A. $\\frac{1}{2}\\left(x+\\frac{1}{3}x^{3}\\right)+C$  B. $\\frac{1}{2}\\left(x^{3}+x\\right)+C$  C. $2\\arctan x+C$  D. $\\frac{1}{2}\\arctan x+C$","a":"A","s":"两边求导得 $xf'(x)=\\frac{2x}{1+x^2}$，故 $f(x)=\\frac{2}{1+x^2}$，于是 $\\int\\frac{\\mathrm{d}x}{f(x)}=\\frac12\\int(1+x^2)\\mathrm{d}x=\\frac12\\left(x+\\frac{x^3}{3}\\right)+C$。"},{"id":556,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"已知函数 $f(x)$ 在 $[-1,2]$ 上连续，且 $\\int_{0}^{-1}f(x)\\mathrm{d}x=-2$，$\\int_{0}^{1}f(2x)\\mathrm{d}x=1$，则 $\\int_{-1}^{2}f(x)\\mathrm{d}x=$（ ） A. $1$  B. $2$  C. $3$  D. $4$","a":"D","s":"由换元得 $\\int_0^2f(x)\\mathrm{d}x=2$，又 $\\int_{-1}^0f(x)\\mathrm{d}x=-\\int_0^{-1}f(x)\\mathrm{d}x=2$，故总和为 4。"},{"id":557,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设在区间 $[a,b]$ 上 $f(x)>0$，$f'(x)<0$，$f''(x)>0$。令 $S_{1}=\\int_{a}^{b}f(x)\\mathrm{d}x$，$S_{2}=f(b)(b-a)$，$S_{3}=\\frac{1}{2}[f(a)+f(b)](b-a)$，则（ ） A. $S_{1}<S_{2}<S_{3}$  B. $S_{2}<S_{1}<S_{3}$  C. $S_{3}<S_{1}<S_{2}$  D. $S_{2}<S_{3}<S_{1}$","a":"B","s":"递减且凹（图形在弦下方、在矩形上方），故矩形面积 $S_2<$ 曲边梯形面积 $S_1<$ 梯形面积 $S_3$。"},{"id":558,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设 $I=\\int_{0}^{\\frac{\\pi}{4}}\\ln\\left(1+\\sin^{2}x\\right)\\mathrm{d}x$，$J=\\int_{0}^{\\frac{\\pi}{4}}\\ln(1+\\sin x)\\mathrm{d}x$，$K=\\int_{0}^{\\frac{\\pi}{4}}\\ln(1+\\cos x)\\mathrm{d}x$，则（ ） A. $J<I<K$  B. $J<K<I$  C. $I<K<J$  D. $I<J<K$","a":"D","s":"$0<x<\\frac\\pi4$ 时 $\\sin^2x<\\sin x<\\cos x$，被积函数依次增大，故 $I<J<K$。"},{"id":559,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"定积分 $\\int_{0}^{1}\\sqrt{2x-x^{2}}\\mathrm{d}x$ 的值为（ ） A. $\\pi$  B. $\\frac{\\pi}{2}$  C. $\\frac{\\pi}{3}$  D. $\\frac{\\pi}{4}$","a":"D","s":"配方得 $\\sqrt{1-(x-1)^2}$，换元后化为单位圆四分之一面积 $\\frac\\pi4$。"},{"id":560,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"已知函数 $f(x)$ 在 $[-2,2]$ 上连续，且 $\\int_{0}^{2}f(x)\\mathrm{d}x=1$，则 $\\int_{-2}^{2}(x+1)f(|x|)\\mathrm{d}x=$（ ） A. $0$  B. $1$  C. $2$  D. $3$","a":"C","s":"$f(|x|)$ 为偶函数，$xf(|x|)$ 为奇函数，对称区间上积分为 0，故原式 $=\\int_{-2}^2f(|x|)\\mathrm{d}x=2\\int_0^2f(x)\\mathrm{d}x=2$。"},{"id":561,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"定积分 $\\int_{0}^{1}\\frac{x}{\\left(2-x^{2}\\right)\\sqrt{1-x^{2}}}\\mathrm{d}x$ 的值为（ ） A. $\\frac{\\pi}{4}$  B. $\\frac{\\pi}{2}$  C. $\\pi$  D. $0$","a":"A","s":"令 $x=\\sin t$，则 $2-x^2=1+\\cos^2t$，原式 $=-\\int_0^{\\frac\\pi2}\\frac{\\mathrm{d}(\\cos t)}{1+\\cos^2t}=-\\arctan(\\cos t)\\Big|_0^{\\frac\\pi2}=\\frac\\pi4$。"},{"id":562,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"设函数 $f(x)$ 连续，$\\varphi(x)=\\int_{0}^{x^{2}}xf(t)\\mathrm{d}t$。若 $\\varphi(1)=1$，$\\varphi'(1)=5$，则 $f(1)=$（ ） A. $0$  B. $1$  C. $2$  D. $3$","a":"C","s":"$\\varphi(x)=x\\int_0^{x^2}f(t)\\mathrm{d}t$，得 $\\varphi(1)=\\int_0^1f=1$；求导 $\\varphi'(x)=\\int_0^{x^2}f(t)\\mathrm{d}t+2x^2f(x^2)$，取 $x=1$ 得 $5=1+2f(1)$，故 $f(1)=2$。"},{"id":563,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"下列反常积分中收敛的是（ ） A. $\\int_{2}^{+\\infty}\\frac{1}{\\sqrt{x}}\\mathrm{d}x$  B. $\\int_{2}^{+\\infty}\\frac{\\ln x}{x}\\mathrm{d}x$  C. $\\int_{2}^{+\\infty}\\frac{1}{x\\ln x}\\mathrm{d}x$  D. $\\int_{2}^{+\\infty}\\frac{x}{e^{x}}\\mathrm{d}x$","a":"D","s":"前三个原函数分别为 $2\\sqrt x$、$\\frac12\\ln^2x$、$\\ln\\ln x$，在 $+\\infty$ 处均发散；D 分部积分得 $3e^{-2}$，收敛。"},{"id":564,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"若反常积分 $\\int_{0}^{+\\infty}xe^{-ax}\\mathrm{d}x=1\\ (a>0)$，则 $a$ 的值为（ ） A. $0$  B. $1$  C. $2$  D. $3$","a":"B","s":"分部积分得 $\\int_0^{+\\infty}xe^{-ax}\\mathrm{d}x=\\frac{1}{a^2}=1$，结合 $a>0$ 得 $a=1$。"},{"id":565,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"反常积分 $\\int_{-\\infty}^{+\\infty}x^{3}\\mathrm{d}x$（ ） A. 收敛于 $0$  B. 收敛于 $\\frac{1}{4}$  C. 发散  D. 敛散性不确定","a":"C","s":"因 $\\int_{-\\infty}^0x^3\\mathrm{d}x$ 发散，故整个广义积分发散；偶倍奇零性质不可用于广义积分。"},{"id":566,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"下列反常积分中收敛的是（ ） A. $\\int_{0}^{+\\infty}\\frac{1}{1+e^{-x}}\\mathrm{d}x$  B. $\\int_{-\\infty}^{+\\infty}\\sin x\\,\\mathrm{d}x$  C. $\\int_{1}^{+\\infty}\\frac{1}{\\sqrt{x-1}}\\mathrm{d}x$  D. $\\int_{0}^{1}\\frac{1}{x^{2}}e^{\\frac{1}{x}}\\mathrm{d}x$","a":"C","s":"A 的原函数 $\\ln(e^x+1)\\to+\\infty$ 发散；B 中 $\\int_0^{+\\infty}\\sin x\\mathrm{d}x$ 发散；D 中 $x\\to0^+$ 时 $e^{\\frac1x}\\to+\\infty$ 发散；C 收敛（原解按上限 5 计算得 4）。"},{"id":567,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"微分方程 $(x-y)\\mathrm{d}x+(x+y)\\mathrm{d}y=0$ 的阶为（ ） A. $1$  B. $2$  C. $3$  D. $4$","a":"A","s":"化为 $\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{y-x}{x+y}$，为一阶微分方程。"},{"id":568,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"$y=Ce^{x}+xe^{x}$ 是微分方程 $y''-2y'+y=0$ 的（ ） A. 特解  B. 通解  C. 是解，但既不是特解也不是通解  D. 不是解","a":"C","s":"代入 $y'=Ce^x+(x+1)e^x$、$y''=Ce^x+(x+2)e^x$ 满足方程，故是解；但它含任意常数 $C$ 且只对应一个特解族，未覆盖二阶方程全部解（另一基本解 $e^x$ 与之线性相关），故既非通解也非特解。"},{"id":569,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"微分方程 $y'+xy^{2}=0$ 满足 $y\\big|_{x=1}=2$ 的特解为（ ） A. $y=\\frac{2}{x^{2}}$  B. $y=\\frac{1}{x^{2}}$  C. $y=\\frac{2}{x^{2}}+1$  D. $y=-\\frac{1}{x^{2}}+1$","a":"A","s":"分离变量得 $\\frac{1}{y}=\\frac{x^2}{2}+C$，由 $y(1)=2$ 得 $C=0$，故 $y=\\frac{2}{x^2}$。"},{"id":570,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"方程 $\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{y}{x+y^{4}}$ 的通解为（ ） A. $y=x\\left(\\frac{1}{3}x^{3}+C\\right)$  B. $y=x^{2}\\left(\\frac{1}{3}x^{3}+C\\right)$  C. $x=y^{2}\\left(\\frac{1}{3}y^{3}+C\\right)$  D. $x=y\\left(\\frac{1}{3}y^{3}+C\\right)$","a":"D","s":"改写为 $\\frac{\\mathrm{d}x}{\\mathrm{d}y}-\\frac1y x=y^3$，为一阶线性方程，解得 $x=y\\left(\\int y^2\\mathrm{d}y+C\\right)=y\\left(\\frac13y^3+C\\right)$。"},{"id":571,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"微分方程 $2y''-4y'+2y=0$ 的通解为（ ） A. $y=(C_{1}+C_{2}x)e^{2x}$  B. $y=(C_{1}+C_{2}x)e^{-2x}$  C. $y=(C_{1}+C_{2}x)e^{x}$  D. $y=(C_{1}+C_{2}x)e^{-x}$","a":"C","s":"特征方程 $r^2-2r+1=0$，$r_1=r_2=1$，故通解 $y=(C_1+C_2x)e^x$。"},{"id":572,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"微分方程 $y'''-y'=0$ 的通解为（ ） A. $y=C_{1}e^{2x}+C_{2}e^{-x}+C_{3}e^{x}$  B. $y=C_{1}+C_{2}e^{-x}+C_{3}e^{x}$  C. $y=C_{1}e^{-x}+C_{2}e^{x}$  D. $y=C_{1}+C_{2}e^{-x}+C_{3}e^{2x}$","a":"B","s":"特征方程 $r(r+1)(r-1)=0$，根为 $0,-1,1$，通解 $y=C_1+C_2e^{-x}+C_3e^{x}$。"},{"id":573,"ch":102,"chName":"导数与微分(强化)","sec":"选择题","q":"微分方程 $y''-y'=2x^{2}-1$ 的特解可设为（ ） A. $y^{*}=ax^{2}+bx+c$  B. $y^{*}=x\\left(ax^{2}+bx+c\\right)$  C. $y^{*}=x^{2}\\left(ax^{2}+bx+c\\right)$  D. $y^{*}=ax+b$","a":"B","s":"特征根 $r_1=0,r_2=1$，自由项为二次多项式且 $r=0$ 是单根，故设 $y^*=x(ax^2+bx+c)$。"},{"id":574,"ch":103,"chName":"多元函数微分学(强化)","sec":"选择题","q":"极限 $\\lim\\limits_{\\substack{x\\to0\\\\ y\\to0}}\\frac{\\sqrt{4+xy}-2}{\\sin xy}=$（ ） A. $\\infty$  B. $1$  C. $0$  D. $\\frac{1}{4}$","a":"D","s":"分子有理化得 $\\frac{xy}{\\sin xy}\\cdot\\frac{1}{\\sqrt{4+xy}+2}$，前者趋于 1，后者趋于 $\\frac14$，故极限为 $\\frac14$。"},{"id":575,"ch":103,"chName":"多元函数微分学(强化)","sec":"选择题","q":"下列说法中正确的是（ ） A. 若 $f(x,y)$ 在 $(x_{0},y_{0})$ 处不可微，则 $f(x,y)$ 在 $(x_{0},y_{0})$ 处不可偏导  B. 设 $f(x,y)$ 在 $(x_{0},y_{0})$ 处不可偏导，则 $f(x,y)$ 在 $(x_{0},y_{0})$ 处不连续  C. 设 $f(x,y)$ 在 $(x_{0},y_{0})$ 处不连续，则 $f(x,y)$ 在 $(x_{0},y_{0})$ 处不可偏导  D. 设 $f(x,y)$ 在 $(x_{0},y_{0})$ 处不可偏导，则 $f(x,y)$ 在 $(x_{0},y_{0})$ 处不可微","a":"D","s":"偏导存在是可微的必要条件，故不可偏导必不可微；反之连续与偏导互不蕴含，A、B、C 均可举反例。"},{"id":576,"ch":103,"chName":"多元函数微分学(强化)","sec":"选择题","q":"设 $z=x\\ln\\sqrt{x^{2}+y^{2}}$，则 $\\frac{\\partial z}{\\partial y}=$（ ） A. $\\frac{xy}{x^{2}+y^{2}}$  B. $\\frac{xy^{2}}{x^{2}+y^{2}}$  C. $\\frac{x^{2}y^{2}}{x^{2}+y^{2}}$  D. $\\frac{x^{2}y}{x^{2}+y^{2}}$","a":"A","s":"$z=\\frac12x\\ln(x^2+y^2)$，对 $y$ 求偏导得 $\\frac12x\\cdot\\frac{2y}{x^2+y^2}=\\frac{xy}{x^2+y^2}$。"},{"id":577,"ch":103,"chName":"多元函数微分学(强化)","sec":"选择题","q":"设 $z=e^{x}+y^{2}+f(y-x)$，其中 $f$ 可导，则 $\\frac{\\partial z}{\\partial x}=$（ ） A. $e^{x}+f'(y-x)$  B. $e^{x}-f'(y-x)$  C. $e^{x}+2y+f'(y-x)$  D. $e^{x}+2y-f'(y-x)$","a":"B","s":"对 $x$ 求偏导，$y^2$ 视为常数，$f(y-x)$ 复合求导得 $-f'(y-x)$，故 $\\frac{\\partial z}{\\partial x}=e^x-f'(y-x)$。"},{"id":578,"ch":103,"chName":"多元函数微分学(强化)","sec":"选择题","q":"设 $f(x,y)=\\frac{x^{3}+\\sin y}{2e^{y}+xy}$，则 $f'_{x}(1,0)=$（ ） A. $0$  B. $1$  C. $\\frac{1}{2}$  D. $\\frac{3}{2}$","a":"D","s":"先代后求：$f(x,0)=\\frac{x^3}{2}$，故 $f_x(x,0)=\\frac32x^2$，$f_x(1,0)=\\frac32$。"},{"id":579,"ch":103,"chName":"多元函数微分学(强化)","sec":"选择题","q":"设 $z=\\arctan\\left(xy^{2}\\right)$，则 $\\left.\\frac{\\partial^{2}z}{\\partial y\\partial x}\\right|_{(0,1)}=$（ ） A. $0$  B. $1$  C. $2$  D. $3$","a":"C","s":"$z_y=\\frac{2xy}{1+x^2y^4}$，令 $y=1$ 得 $\\frac{2x}{1+x^2}$，再对 $x$ 求导得 $\\frac{2-2x^2}{(1+x^2)^2}$，代入 $x=0$ 得 $2$。"},{"id":580,"ch":103,"chName":"多元函数微分学(强化)","sec":"选择题","q":"设函数 $z=z(x,y)$ 由方程 $(z+y)^{x}=xy$ 确定，则 $\\left.\\frac{\\partial z}{\\partial x}\\right|_{(1,2)}=$（ ） A. $2$  B. $1$  C. $1-\\ln2$  D. $2(1-\\ln2)$","a":"D","s":"令 $F=(z+y)^x-xy$，得 $F_x=(z+y)^x\\ln(z+y)-y$、$F_z=x(z+y)^{x-1}$，故 $\\frac{\\partial z}{\\partial x}=\\frac{y-(z+y)^x\\ln(z+y)}{x(z+y)^{x-1}}$；由 $x=1,y=2$ 解得 $z+y=2$，代入得 $2(1-\\ln2)$。"},{"id":581,"ch":103,"chName":"多元函数微分学(强化)","sec":"选择题","q":"设 $z=xf\\left(\\cos x,y^{2}\\right)$，其中 $f$ 可导，则 $\\frac{\\partial z}{\\partial x}=$（ ） A. $f(\\cos x,y^{2})+x\\cos x f'_{1}$  B. $f(\\cos x,y^{2})+x\\sin x f'_{1}$  C. $f(\\cos x,y^{2})-x\\sin x f'_{1}$  D. $f(\\cos x,y^{2})-x\\cos x f'_{1}$","a":"C","s":"乘积法则加复合求导：$z_x=f(\\cos x,y^2)+x\\cdot f'_1\\cdot(-\\sin x)$。"},{"id":582,"ch":103,"chName":"多元函数微分学(强化)","sec":"选择题","q":"设函数 $z=f(x,y)$ 的全微分为 $\\mathrm{d}z=x\\,\\mathrm{d}x+y\\,\\mathrm{d}y$，则点 $(0,0)$（ ） A. 不是 $f(x,y)$ 的连续点  B. 不是 $f(x,y)$ 的极值点  C. 是 $f(x,y)$ 的极大值点  D. 是 $f(x,y)$ 的极小值点","a":"D","s":"得 $f'_x=x$、$f'_y=y$，$(0,0)$ 为驻点；$A=f''_{xx}=1$、$B=f''_{xy}=0$、$C=f''_{yy}=1$，$AC-B^2=1>0$ 且 $A>0$，故为极小值点。"},{"id":583,"ch":104,"chName":"重积分(强化)","sec":"选择题","q":"设区域 $D$ 由 $x^{2}+y^{2}\\le1$ 围成，则 $\\iint_{D}\\left[xy(x+y)+1\\right]\\mathrm{d}\\sigma=$（ ） A. $0$  B. $1$  C. $\\pi$  D. $\\frac{\\pi}{2}$","a":"C","s":"$x^2y$ 关于 $x$ 轴为奇、$xy^2$ 关于 $y$ 轴为奇，区域对称故两项积分为 0，余下 $\\iint_D1\\mathrm{d}\\sigma=S_D=\\pi$。"},{"id":584,"ch":104,"chName":"重积分(强化)","sec":"选择题","q":"设区域 $D$ 由直线 $y=x$、$y=-x$ 及 $x=2$ 围成，则 $\\iint_{D}\\left(x^{2}\\sin y+1\\right)\\mathrm{d}\\sigma=$（ ） A. $1$  B. $2$  C. $3$  D. $4$","a":"D","s":"区域关于 $x$ 轴对称，$x^2\\sin y$ 为奇函数其积分为 0，余下为区域面积 $S_D=4$。"},{"id":585,"ch":104,"chName":"重积分(强化)","sec":"选择题","q":"设 $D$ 是由 $x+y=1$、$x$ 轴及 $y$ 轴围成的区域，且 $I_{1}=\\iint_{D}\\sin(x+y)\\mathrm{d}x\\mathrm{d}y$，$I_{2}=\\iint_{D}(x+y)\\mathrm{d}x\\mathrm{d}y$，$I_{3}=\\iint_{D}\\tan(x+y)\\mathrm{d}x\\mathrm{d}y$，则（ ） A. $I_{1}<I_{2}<I_{3}$  B. $I_{3}<I_{2}<I_{1}$  C. $I_{1}<I_{3}<I_{2}$  D. $I_{2}<I_{1}<I_{3}$","a":"A","s":"$0<x+y<1<\\frac\\pi2$ 时 $\\sin(x+y)<x+y<\\tan(x+y)$，逐项积分比较得 $I_1<I_2<I_3$。"},{"id":586,"ch":104,"chName":"重积分(强化)","sec":"选择题","q":"设 $D$ 由 $|x|+|y|\\le1$ 围成，则 $\\iint_{D}\\left[|xy|+\\sin\\left(xy^{2}\\right)\\right]\\mathrm{d}\\sigma=$（ ） A. $\\frac{1}{2}$  B. $\\frac{1}{4}$  C. $\\frac{1}{6}$  D. $\\frac{1}{8}$","a":"C","s":"区域关于两坐标轴均对称，$\\sin(xy^2)$ 为奇函数积分为 0，故原式 $=4\\int_0^1\\mathrm{d}x\\int_0^{1-x}xy\\mathrm{d}y=\\frac16$。"},{"id":587,"ch":104,"chName":"重积分(强化)","sec":"选择题","q":"设区域 $D$ 是由 $x^{2}+y^{2}=4\\pi^{2}$ 和 $x^{2}+y^{2}=\\pi^{2}$ 所围成的区域，则 $\\iint_{D}\\frac{e^{\\sqrt{x^{2}+y^{2}}}}{\\sqrt{x^{2}+y^{2}}}\\mathrm{d}\\sigma=$（ ） A. $e^{\\pi}$  B. $e^{2\\pi}-e^{\\pi}$  C. $\\pi\\left(e^{2\\pi}-e^{\\pi}\\right)$  D. $2\\pi\\left(e^{2\\pi}-e^{\\pi}\\right)$","a":"D","s":"极坐标下化为 $\\int_0^{2\\pi}\\mathrm{d}\\theta\\int_\\pi^{2\\pi}e^r\\mathrm{d}r=2\\pi(e^{2\\pi}-e^{\\pi})$。"},{"id":588,"ch":105,"chName":"曲线积分与曲面积分(强化)","sec":"选择题","q":"设 $L$ 为正向圆周 $x^{2}+y^{2}=2$，则曲线积分 $\\oint_{L}(x+y^{2})\\mathrm{d}y-(x^{3}+y)\\mathrm{d}x=$（ ） A. $\\pi$  B. $2\\pi$  C. $3\\pi$  D. $4\\pi$","a":"D","s":"由格林公式，$P=-(x^3+y)$、$Q=x+y^2$，$Q_x-P_y=1-(-1)=2$，故原式 $=2S_D=2\\pi(\\sqrt2)^2=4\\pi$。"},{"id":589,"ch":105,"chName":"曲线积分与曲面积分(强化)","sec":"选择题","q":"设曲线积分 $\\oint_{L}\\left(xe^{-x^{2}}+x^{2}y+ay^{2}\\right)\\mathrm{d}x-\\left(bx^{3}+xy\\right)\\mathrm{d}y$ 与积分路径无关，则 $ab=$（ ） A. $\\frac{1}{4}$  B. $4$  C. $\\frac{1}{6}$  D. $6$","a":"C","s":"记 $Q=-(bx^3+xy)$，由 $P_y=Q_x$ 得 $x^2+2ay=-3bx^2-y$，比较系数得 $a=-\\frac12$、$b=-\\frac13$，故 $ab=\\frac16$。"},{"id":590,"ch":106,"chName":"无穷级数(强化)","sec":"选择题","q":"下列说法中正确的是（ ） A. 若 $\\sum\\limits_{n=1}^{\\infty}u_{n}$ 收敛，则 $\\sum\\limits_{n=1}^{\\infty}\\left(u_{2n-1}+u_{2n}\\right)$ 收敛  B. 若 $\\sum\\limits_{n=1}^{\\infty}\\left(u_{2n-1}+u_{2n}\\right)$ 收敛，则 $\\sum\\limits_{n=1}^{\\infty}u_{n}$ 收敛  C. 若 $\\sum\\limits_{n=1}^{\\infty}u_{n}$ 收敛，则 $\\sum\\limits_{n=1}^{\\infty}u_{n}^{2}$ 收敛  D. 若 $\\sum\\limits_{n=1}^{\\infty}u_{n}$ 收敛，则 $\\sum\\limits_{n=1}^{\\infty}(-1)^{n}u_{n}$ 收敛","a":"A","s":"加括号不改变收敛性，故 A 成立；B 反之不然；C 取 $u_n=\\frac{(-1)^n}{\\sqrt n}$ 反驳；D 取 $u_n=\\frac{(-1)^n}{n}$ 反驳。"},{"id":591,"ch":106,"chName":"无穷级数(强化)","sec":"选择题","q":"下列说法中错误的是（ ） A. 若 $\\sum\\limits_{n=1}^{\\infty}|u_{n}|$ 收敛，则 $\\sum\\limits_{n=1}^{\\infty}u_{n}$ 收敛  B. 若 $\\sum\\limits_{n=1}^{\\infty}u_{n}$ 收敛，则 $\\sum\\limits_{n=1}^{\\infty}u_{n+100}$ 收敛  C. 若 $\\sum\\limits_{n=1}^{\\infty}|u_{n}|$ 发散，则 $\\sum\\limits_{n=1}^{\\infty}u_{n}$ 发散  D. 若 $\\sum\\limits_{n=1}^{\\infty}|u_{n}|$ 收敛，则 $\\sum\\limits_{n=1}^{\\infty}(-1)^{n}u_{n}$ 收敛","a":"C","s":"取 $u_n=\\frac{(-1)^n}{n}$：$\\sum|u_n|$ 发散但 $\\sum u_n$ 收敛，故 C 错。"},{"id":592,"ch":106,"chName":"无穷级数(强化)","sec":"选择题","q":"下列级数中发散的是（ ） A. $\\sum\\limits_{n=2}^{\\infty}\\frac{(-1)^{n}}{n\\ln n}$  B. $\\sum\\limits_{n=1}^{\\infty}\\frac{(-1)^{n-1}+n^{2}}{n^{3}}$  C. $\\sum\\limits_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{\\sqrt{n}}$  D. $\\sum\\limits_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{e^{n}}$","a":"B","s":"B 拆为 $\\sum\\frac{(-1)^{n-1}}{n^3}$（收敛）与 $\\sum\\frac1n$（发散）之和，故发散；其余三项均为莱布尼茨型交错级数，收敛。"},{"id":593,"ch":106,"chName":"无穷级数(强化)","sec":"选择题","q":"下列级数中收敛的是（ ） A. $\\sum\\limits_{n=1}^{\\infty}\\frac{n^{n}}{n!}$  B. $\\sum\\limits_{n=1}^{\\infty}\\frac{\\pi^{n}n!}{n^{n}}$  C. $\\sum\\limits_{n=1}^{\\infty}\\frac{2^{n}n!}{n^{n}}$  D. $\\sum\\limits_{n=1}^{\\infty}1$","a":"C","s":"比值判别：A 比值趋于 $e>1$ 发散；B 比值趋于 $\\frac\\pi e>1$ 发散；C 比值趋于 $\\frac2e<1$ 收敛；D 通项不趋于 0 发散。"},{"id":594,"ch":106,"chName":"无穷级数(强化)","sec":"选择题","q":"下列级数中绝对收敛的是（ ） A. $\\sum\\limits_{n=1}^{\\infty}\\frac{(-1)^{n-1}n}{n^{2}+1}$  B. $\\sum\\limits_{n=1}^{\\infty}\\frac{(-1)^{n}}{\\sqrt{n}}$  C. $\\sum\\limits_{n=1}^{\\infty}\\frac{(-1)^{n}}{2^{n}}$  D. $\\sum\\limits_{n=1}^{\\infty}(-1)^{n}\\sin\\frac{1}{n}$","a":"C","s":"C 取绝对值后为等比级数 $\\sum\\left(\\frac12\\right)^n$ 收敛；A、B、D 取绝对值后均与调和级数同阶而发散。"},{"id":595,"ch":106,"chName":"无穷级数(强化)","sec":"选择题","q":"幂级数 $\\sum\\limits_{n=1}^{\\infty}\\frac{2^{n}}{n!}x^{n}$ 的收敛区间是（ ） A. $(-1,1)$  B. $(-2,2)$  C. $\\{0\\}$  D. $(-\\infty,+\\infty)$","a":"D","s":"比值极限 $\\lim\\left|\\frac{u_{n+1}}{u_n}\\right|=\\lim\\frac{2}{n+1}=0$，收敛半径 $R=+\\infty$，收敛区间为 $(-\\infty,+\\infty)$。"},{"id":596,"ch":106,"chName":"无穷级数(强化)","sec":"选择题","q":"若 $\\sum\\limits_{n=1}^{\\infty}a_{n}x^{n}$ 的收敛半径为 $2$，则 $\\sum\\limits_{n=1}^{\\infty}a_{n}(x+1)^{n}$ 的收敛区间为（ ） A. $(-1,1)$  B. $(-3,1)$  C. $(0,4)$  D. $(0,3)$","a":"B","s":"作平移 $t=x+1$，$|t|<2$ 即 $-2<x+1<2$，得 $-3<x<1$。"},{"id":597,"ch":106,"chName":"无穷级数(强化)","sec":"选择题","q":"幂级数 $\\sum\\limits_{n=1}^{\\infty}(-1)^{n}(2x)^{n}$ 在区间 $\\left(-\\frac{1}{2},\\frac{1}{2}\\right)$ 内的和函数为（ ） A. $\\frac{1}{1-2x}$  B. $\\frac{1}{1+2x}$  C. $\\frac{-2x}{1+2x}$  D. $\\frac{-2x}{1-2x}$","a":"C","s":"即 $\\sum(-2x)^n=\\frac{-2x}{1-(-2x)}=\\frac{-2x}{1+2x}$，$|2x|<1$。"},{"id":598,"ch":106,"chName":"无穷级数(强化)","sec":"选择题","q":"$\\sum\\limits_{n=0}^{\\infty}\\frac{1}{n!}=$（ ） A. $e$  B. $e^{2}$  C. $e^{3}$  D. $1$","a":"A","s":"利用展开式 $\\sum\\limits_{n=0}^{\\infty}\\frac{x^n}{n!}=e^x$，取 $x=1$ 得 $e$。"},{"id":599,"ch":106,"chName":"无穷级数(强化)","sec":"选择题","q":"已知级数 $\\sum\\limits_{n=1}^{\\infty}\\frac{1}{n^{2}}=\\frac{\\pi^{2}}{6}$，则级数 $\\sum\\limits_{n=1}^{\\infty}\\frac{1}{(2n-1)^{2}}=$（ ） A. $\\frac{\\pi^{2}}{12}$  B. $\\frac{\\pi^{2}}{8}$  C. $\\frac{\\pi^{2}}{4}$  D. $\\frac{\\pi^{2}}{2}$","a":"B","s":"奇数列项之和等于总和减去偶数列项之和：$\\frac{\\pi^2}{6}-\\frac14\\cdot\\frac{\\pi^2}{6}=\\frac{\\pi^2}{8}$。"},{"id":600,"ch":107,"chName":"综合解答题(强化)","sec":"解答题","q":"已知 $f(x)=\\sin x$，$f[\\varphi(x)]=1-x^{2}$，求 $\\varphi(x)$ 及其定义域。","a":"$\\varphi(x)=\\arcsin\\left(1-x^{2}\\right)$，$x\\in[-\\sqrt{2},\\sqrt{2}]$","s":"由 $\\sin\\varphi(x)=1-x^2$ 得 $\\varphi(x)=\\arcsin(1-x^2)$；再由 $-1\\le1-x^2\\le1$ 即 $0\\le x^2\\le2$，得 $-\\sqrt2\\le x\\le\\sqrt2$。"},{"id":601,"ch":107,"chName":"综合解答题(强化)","sec":"解答题","q":"设 $f(x)=\\begin{cases}e^{x},&x\\le0,\\\\-x,&x>0,\\end{cases}$ $g(x)=\\begin{cases}x,&x\\le0,\\\\x-1,&x>0,\\end{cases}$ 求 $f\\left(x^{2}\\right)$，$f[f(x)]$ 及 $f[g(x)]$。","a":"$f\\left(x^{2}\\right)=\\begin{cases}e^{x^{2}},&x=0,\\\\-x^{2},&x\\ne0,\\end{cases}$ $f[f(x)]=\\begin{cases}e^{-x},&x>0,\\\\-e^{x},&x\\le0,\\end{cases}$ $f[g(x)]=\\begin{cases}e^{x},&x\\le0,\\\\e^{x-1},&0<x\\le1,\\\\1-x,&x>1.\\end{cases}$","s":"按内层函数取值分段讨论：$f(x^2)$ 由 $x^2\\le0$ 与 $x^2>0$ 划分；$f[f(x)]$ 由 $f(x)\\le0$ 与 $f(x)>0$ 划分（$x>0$ 时 $f(x)=-x<0$，故 $f[f(x)]=e^{-x}$；$x\\le0$ 时 $f(x)=e^x>0$，故 $f[f(x)]=-e^x$）；$f[g(x)]$ 由 $g(x)\\le0$（即 $x\\le0$）与 $0<g(x)$ 划分，进一步拆出 $0<x\\le1$ 与 $x>1$。"},{"id":602,"ch":107,"chName":"综合解答题(强化)","sec":"解答题","q":"求极限 $\\lim\\limits_{n\\to\\infty}\\left[\\sqrt{1+2+\\cdots+n}-\\sqrt{1+2+\\cdots+(n-1)}\\right]$。","a":"$\\frac{\\sqrt{2}}{2}$","s":"$1+\\cdots+n=\\frac12n(n+1)$、$1+\\cdots+(n-1)=\\frac12n(n-1)$，原式 $=\\frac{\\sqrt2}{2}\\lim[\\sqrt{n(n+1)}-\\sqrt{n(n-1)}]=\\frac{\\sqrt2}{2}\\lim\\frac{2n}{\\sqrt{n(n+1)}+\\sqrt{n(n-1)}}=\\frac{\\sqrt2}{2}$。"},{"id":603,"ch":107,"chName":"综合解答题(强化)","sec":"解答题","q":"求极限 $\\lim\\limits_{x\\to0}\\left(\\frac{\\sin^{2}x}{x^{4}}-\\frac{1}{x^{2}}\\right)$。","a":"$-\\frac{1}{3}$","s":"通分得 $\\frac{\\sin^2x-x^2}{x^4}=\\frac{(\\sin x+x)(\\sin x-x)}{x^4}$，用 $\\sin x-x\\sim-\\frac{x^3}{6}$，得 $\\lim\\frac{-\\frac16x^3(x+\\sin x)}{x^4}=-\\frac16\\cdot2=-\\frac13$。"},{"id":604,"ch":107,"chName":"综合解答题(强化)","sec":"解答题","q":"求极限 $\\lim\\limits_{x\\to\\infty}\\left[x-x^{2}\\ln\\left(1+\\frac{1}{x}\\right)\\right]$。","a":"$\\frac{1}{2}$","s":"法一：令 $x=\\frac1t$，化为 $\\lim\\limits_{t\\to0^+}\\frac{t-\\ln(1+t)}{t^2}=\\lim\\frac{\\frac12t^2}{t^2}=\\frac12$；法二：提 $x^2$ 后用 $\\ln(1+\\frac1x)\\approx\\frac1x-\\frac{1}{2x^2}$ 得 $\\frac12$。"},{"id":605,"ch":107,"chName":"综合解答题(强化)","sec":"解答题","q":"求极限 $\\lim\\limits_{x\\to+\\infty}\\left[x^{2}\\left(e^{\\frac{1}{x}}-1\\right)-x\\right]$。","a":"$\\frac{1}{2}$","s":"令 $x=\\frac1t$（$t\\to0^+$），原式 $=\\lim\\limits_{t\\to0^+}\\frac{e^t-1-t}{t^2}$，两次洛必达（或用 $e^t=1+t+\\frac{t^2}{2}+o(t^2)$）得 $\\frac12$。"},{"id":606,"ch":107,"chName":"综合解答题(强化)","sec":"解答题","q":"函数 $p(x)$ 是多项式且 $\\lim\\limits_{x\\to+\\infty}\\frac{p(x)-x^{3}}{x^{2}}=2$，$\\lim\\limits_{x\\to0}\\frac{p(x)}{x}=1$，求函数 $p(x)$。","a":"$p(x)=x^{3}+2x^{2}+x$","s":"设 $p(x)=ax^3+bx^2+cx+d$。由第一个极限为 2 得 $a=1$、$b=2$；由第二个极限为 1 且极限存在，得 $d=0$、$c=1$，故 $p(x)=x^3+2x^2+x$。"},{"id":607,"ch":107,"chName":"综合解答题(强化)","sec":"解答题","q":"求极限 $\\lim\\limits_{x\\to0}\\left(\\cos x+\\sin^{2}x\\right)^{\\frac{1}{x^{2}}}$。","a":"$e^{\\frac{1}{2}}$","s":"写成 $\\left[1+(\\cos x-1+\\sin^2x)\\right]^{1/x^2}$，其中 $\\lim\\frac{\\cos x-1+\\sin^2x}{x^2}=-\\frac12+1=\\frac12$，故原式 $=e^{1/2}$。"},{"id":608,"ch":107,"chName":"综合解答题(强化)","sec":"解答题","q":"求极限 $\\lim\\limits_{x\\to+\\infty}\\frac{\\left(1+\\frac{1}{x}\\right)^{x^{2}}}{e^{x}}$。","a":"$e^{-\\frac{1}{2}}$","s":"化为 $e^{x^2\\ln(1+1/x)-x}$，其中 $x^2[\\ln(1+\\frac1x)-\\frac1x]\\to-\\frac12$，故原式 $=e^{-1/2}$。注：$(1+\\frac1x)$ 与 $\\ln(1+\\frac1x)$ 都不是因子，不能先算极限或直接用 $\\sim\\frac1x$ 替换。"},{"id":609,"ch":107,"chName":"综合解答题(强化)","sec":"解答题","q":"求极限 $\\lim\\limits_{x\\to+\\infty}\\left(\\frac{2}{\\pi}\\arctan x\\right)^{x}$。","a":"$e^{-\\frac{2}{\\pi}}$","s":"写成 $[1+\\frac{2\\arctan x-\\pi}{\\p
