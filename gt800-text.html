<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<title>杰哥800题 · 纯文本版</title>
<link rel="stylesheet" id="katexCss" href="./assets/katex/katex.min.css">
<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--txt:#1b2130;--sub:#5c6478;--dim:#8c94a6;
  --pri:#2f6bff;--pri2:#7c4dff;--ok:#0fa678;--warn:#e08700;--line:#e6e9f2;
  --shadow:0 2px 10px rgba(22,32,60,.07);--radius:14px;--fs:16px;
  --notice-bg:#fff8ea;--notice-bd:#f0dcb2;--ok-soft:rgba(15,166,120,.12);
  --ok-bd:rgba(15,166,120,.42);--tag2-bg:rgba(47,107,255,.12);
}
:root[data-theme="dark"]{
  --bg:#11141b;--card:#1a1f29;--txt:#e9edf5;--sub:#a8b0c0;--dim:#7d8698;
  --pri:#6f9bff;--pri2:#a98bff;--ok:#35d0a0;--warn:#f0b23e;--line:#2a3141;
  --shadow:0 2px 12px rgba(0,0,0,.4);
  --notice-bg:rgba(240,178,62,.12);--notice-bd:rgba(240,178,62,.34);
  --ok-soft:rgba(53,208,160,.14);--ok-bd:rgba(53,208,160,.42);--tag2-bg:rgba(111,155,255,.16);
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --bg:#11141b;--card:#1a1f29;--txt:#e9edf5;--sub:#a8b0c0;--dim:#7d8698;
    --pri:#6f9bff;--pri2:#a98bff;--ok:#35d0a0;--warn:#f0b23e;--line:#2a3141;
    --shadow:0 2px 12px rgba(0,0,0,.4);
    --notice-bg:rgba(240,178,62,.12);--notice-bd:rgba(240,178,62,.34);
    --ok-soft:rgba(53,208,160,.14);--ok-bd:rgba(53,208,160,.42);--tag2-bg:rgba(111,155,255,.16);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:var(--fs);line-height:1.6;
  padding:0 12px calc(24px + env(safe-area-inset-bottom));
  max-width:860px;margin:0 auto;
  -webkit-text-size-adjust:100%;
  transition:background .2s,color .2s;
}
/* ---- 顶部 ---- */
.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:10px 0 8px;margin:0 -12px;padding-left:12px;padding-right:12px;
  border-bottom:1px solid transparent;
}
.top.stuck{border-bottom-color:var(--line);box-shadow:0 6px 16px -14px rgba(0,0,0,.5)}
.th1{display:flex;align-items:center;gap:8px}
.title{font-size:1.12em;font-weight:800;letter-spacing:.2px;flex:1;min-width:0;
  background:linear-gradient(100deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-size:1em;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--shadow);
}
.iconbtn:active{transform:scale(.96)}
.notice{
  margin:8px 0 0;padding:8px 12px;border-radius:12px;font-size:.8em;line-height:1.5;
  background:var(--notice-bg);
  color:var(--txt);border:1px solid var(--notice-bd);
}
.notice b{color:var(--warn)}
/* ---- 进度 ---- */
.progwrap{margin:10px 0 8px;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:12px 14px}
.progtop{display:flex;align-items:baseline;gap:8px;font-size:.92em}
.progtop b{font-size:1.5em;color:var(--pri);line-height:1}
.progtop .sm{color:var(--sub);font-size:.9em;margin-left:auto}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .3s}
/* ---- 工具栏 ---- */
.tools{position:sticky;top:56px;z-index:19;background:var(--bg);padding:6px 0 8px;margin:0 -12px;padding-left:12px;padding-right:12px}
.searchrow{display:flex;gap:8px}
.searchbox{flex:1;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:0 12px;box-shadow:var(--shadow);height:46px}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--txt);font-size:1em;height:44px;outline:none}
.searchbox input::placeholder{color:var(--dim)}
.clr{width:24px;height:24px;border:0;border-radius:50%;background:var(--line);color:var(--sub);font-size:.8em;display:none;cursor:pointer}
.clr.on{display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:99px;padding:0 14px;height:38px;font-size:.88em;display:inline-flex;align-items:center;gap:6px;
  cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);
}
.chip.on{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;font-weight:700}
.chip .n{font-size:.85em;opacity:.85}
/* 章节下拉 */
.chselrow{display:flex;gap:8px;padding:8px 0 0}
.chsel{
  flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--txt);font-size:.9em;padding:0 10px;box-shadow:var(--shadow);outline:none;cursor:pointer;
}
.chsel.on{border-color:var(--pri);color:var(--pri);font-weight:600}
/* ---- 章节分组 ---- */
.chgroup{margin-bottom:4px}
.chhead{
  display:flex;align-items:center;gap:8px;margin:16px 2px 10px;padding-bottom:7px;
  border-bottom:1px solid var(--line);font-size:.86em;color:var(--sub);
}
.chhead .chno{
  flex:0 0 auto;font-weight:800;color:var(--pri);background:var(--tag2-bg);
  border-radius:8px;padding:2px 8px;font-size:.95em;
}
.chhead .chttl{
  font-weight:700;color:var(--txt);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chhead .chsec{flex:0 0 auto;color:var(--dim);font-size:.92em}
.chhead .chcnt{flex:0 0 auto;margin-left:auto;color:var(--dim);font-size:.92em}
/* ---- 卡片 ---- */
.count{margin:10px 2px 8px;font-size:.82em;color:var(--dim)}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;margin-bottom:12px;border:1px solid transparent;
  animation:in .22s ease both;
}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 800 张卡片一次性渲染时降低首屏开销(离屏内容跳过渲染, 不改变 DOM 与逻辑) */
.card{content-visibility:auto;contain-intrinsic-size:auto 240px}
.card.mastered{border-color:var(--ok-bd)}
.qhead{display:flex;gap:10px;align-items:flex-start}
.num{
  flex:0 0 auto;min-width:36px;height:36px;padding:0 8px;border-radius:11px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;
  font-weight:800;font-size:.9em;display:flex;align-items:center;justify-content:center;
}
.card.mastered .num{background:linear-gradient(135deg,var(--ok),#4cd6a8)}
.qbody{flex:1;min-width:0}
.qtext{line-height:2;word-break:break-word}
.qtext .katex{font-size:1.05em}
/* 选择题选项：每个 A./B./C./D. 独占一行 */
.qtext .optln{display:inline-block;font-weight:700;color:var(--pri);margin-right:2px}
/* 选择题答案：单字母徽标醒目展示 */
.optKey{
  display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 10px;
  border-radius:10px;background:var(--ok);color:#fff;font-weight:800;font-size:1.05em;letter-spacing:.5px;
  box-shadow:0 2px 8px rgba(46,160,120,.28);
}
.sq .optln{display:inline-block;font-weight:700;color:var(--pri);margin-right:2px}
.sq .optKey{min-width:28px;height:28px;font-size:1.02em}
.meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72em;color:var(--sub);background:var(--line);border-radius:8px;padding:2px 8px}
.tag.t2{background:var(--tag2-bg);color:var(--pri)}
.ans{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.card.open .ans{display:block}
.arow{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.arow:last-child{margin-bottom:0}
.lab{flex:0 0 auto;font-size:.72em;font-weight:700;border-radius:8px;padding:3px 8px;margin-top:2px;color:#fff}
.lab-a{background:var(--ok)}
.lab-s{background:var(--pri)}
.aval,.sval{flex:1;min-width:0;line-height:1.95;word-break:break-word;font-size:.97em}
.sval{color:var(--sub)}
.acts{display:flex;gap:10px;margin-top:12px}
.btn{
  flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);
  font-size:.92em;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s,background .18s;
}
.btn:active{transform:scale(.97)}
.btn-pri{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
.btn-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-bd);font-weight:700}
.btn-wide{width:100%;flex:none}
/* ---- 刷题模式 ---- */
.study{
  position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
.study.on{display:flex}
.study-top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.study-top .st{flex:1;min-width:0;font-size:.9em;color:var(--sub)}
.study-top .st b{color:var(--pri);font-size:1.1em}
.study-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.study-foot{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.study-foot .btn{min-height:48px}
.scard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.scard .ans{display:block;margin-top:14px;padding-top:14px}
.snum{font-size:.78em;color:var(--dim);margin-bottom:8px}
.sq{line-height:2.05;font-size:1.04em;word-break:break-word}
.hide{display:none!important}
/* ---- 平板 / 触控适配 ---- */
a.iconbtn.back{text-decoration:none;font-weight:800;color:var(--pri);font-size:1.05em}
.iconbtn{width:44px;height:44px;min-width:44px;min-height:44px}
.iconbtn:focus-visible,.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.navbtn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:.9em;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
html,body{overflow-x:hidden}
input[type="search"],input[type="number"],select,textarea{font-size:16px}
@media (min-width:760px) and (max-width:1180px){
  body{max-width:960px}
}
@media (pointer:coarse){
  .btn,.navbtn,.iconbtn{min-height:46px}
  .card{padding:16px}
}
/* 桌面 */
@media (min-width:760px){
  body{padding-left:20px;padding-right:20px}
  .top,.tools{margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px}
  .card{padding:18px 20px}
  .acts{max-width:520px}
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="th1">
    <a class="iconbtn back" href="index.html" title="返回工作台" aria-label="返回工作台">←</a>
    <div class="title">杰哥800题 · 纯文本版</div>
    <button class="iconbtn" id="btnTheme" title="切换深色模式">🌗</button>
    <button class="iconbtn" id="btnFs" title="调整字号">A</button>
  </div>
  <div class="notice">本版为 <b>OCR 校对稿</b>，个别符号请与原书核对。当前批次：<span id="batchName"></span></div>
</header>

<div class="progwrap">
  <div class="progtop"><b id="mCount">0</b><span>/ <span id="tCount">0</span> 已掌握</span><span class="sm" id="mPct">0%</span></div>
  <div class="bar"><i id="mBar"></i></div>
</div>

<div class="tools" id="tools">
  <div class="searchrow">
    <div class="searchbox">
      <span style="color:var(--dim);font-size:.95em">🔍</span>
      <input id="q" type="search" inputmode="search" placeholder="搜题号(如 12 / 1-20) 或关键词" autocomplete="off">
      <button class="clr" id="clr" aria-label="清空">✕</button>
    </div>
    <button class="iconbtn" id="btnStudy" title="顺序刷题" style="width:46px;height:46px">▶</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip on" data-f="all">全部 <span class="n" id="cAll">0</span></button>
    <button class="chip" data-f="undone">未掌握 <span class="n" id="cUn">0</span></button>
    <button class="chip" data-f="done">已掌握 <span class="n" id="cDo">0</span></button>
  </div>
  <div class="chselrow">
    <select class="chsel" id="chSel" aria-label="按章节筛选"></select>
  </div>
</div>

<div class="count" id="count"></div>
<main id="list"></main>

<div class="study" id="study">
  <div class="study-top">
    <button class="iconbtn" id="sClose" aria-label="退出">✕</button>
    <div class="st">顺序刷题 · <b id="sIdx">1</b> / <span id="sTotal">49</span></div>
    <button class="iconbtn" id="sMaster" title="标记已掌握">☆</button>
  </div>
  <div class="study-body" id="sBody"></div>
  <div class="study-foot">
    <button class="btn" id="sPrev">← 上一题</button>
    <button class="btn btn-pri" id="sAns">看答案</button>
    <button class="btn" id="sNext">下一题 →</button>
  </div>
</div>

x^{2}+x+1}{3x^{3}+2x+1}=$______.","a":"$0$","s":"分母次数高于分子（抓大头：分母主导项 $3x^{3}$），极限为 $0$。"},{"id":13,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to+\\infty}\\dfrac{\\pi^{x}}{\\pi^{x}-e^{x}}=$______.","a":"$1$","s":"化为 $\\dfrac{1}{1-(e/\\pi)^{x}}$，因 $0<\\dfrac{e}{\\pi}<1$，故 $(e/\\pi)^{x}\\to 0$，极限为 $1$。"},{"id":14,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 0}\\dfrac{2\\tan 3x}{3\\sin 2x}=$______.","a":"$1$","s":"等价无穷小：$\\dfrac{2\\cdot 3x}{3\\cdot 2x}=1$。"},{"id":15,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 0}\\dfrac{1-\\cos 2x}{x\\sin x}=$______.","a":"$2$","s":"$1-\\cos 2x\\sim\\dfrac{1}{2}(2x)^{2}$，故 $\\dfrac{2x^{2}}{x^{2}}=2$。"},{"id":16,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{n\\to\\infty}3^{n}\\tan\\dfrac{2}{3^{n}}=$______.","a":"$2$","s":"$\\tan\\dfrac{2}{3^{n}}\\sim\\dfrac{2}{3^{n}}$，故极限为 $3^{n}\\cdot\\dfrac{2}{3^{n}}=2$。"},{"id":17,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 0}\\dfrac{1-\\sqrt{1-3x^{2}}}{2x^{2}}=$______.","a":"$\\dfrac{3}{4}$","s":"$(1-3x^{2})^{1/2}-1\\sim-\\dfrac{3}{2}x^{2}$，故 $-\\dfrac{-\\frac{3}{2}x^{2}}{2x^{2}}=\\dfrac{3}{4}$。"},{"id":18,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 0}\\dfrac{\\sin x-x}{x^{2}\\ln(1-x)}=$______.","a":"$\\dfrac{1}{6}$","s":"$\\sin x-x\\sim-\\dfrac{x^{3}}{6}$，$\\ln(1-x)\\sim -x$，故 $\\dfrac{-x^{3}/6}{-x^{3}}=\\dfrac{1}{6}$。"},{"id":19,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 1}\\dfrac{x^{5}-1}{x^{4}-1}=$______.","a":"$\\dfrac{5}{4}$","s":"洛必达：$\\dfrac{5x^{4}}{4x^{3}}\\to\\dfrac{5}{4}$；或分解因式约去 $x-1$。"},{"id":20,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to\\pi}\\dfrac{\\sin 3x}{\\tan 5x}=$______.","a":"$-\\dfrac{3}{5}$","s":"洛必达：$\\dfrac{3\\cos 3x}{5\\sec^{2}5x}$，代入 $x=\\pi$ 得 $-\\dfrac{3}{5}$。注意此题不能用等价替换（$3x\\to 3\\pi\\neq 0$）。"},{"id":21,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 0}(1+2x)^{\\frac{1}{3x}}=$______.","a":"$e^{\\frac{2}{3}}$","s":"$\\lim\\dfrac{2x}{3x}=\\dfrac{2}{3}$，故原式 $=e^{2/3}$。"},{"id":22,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to\\infty}\\left(\\dfrac{x+4}{x+5}\\right)^{\\frac{x-1}{3}}=$______.","a":"$e^{-\\frac{1}{3}}$","s":"化为 $\\left(1+\\dfrac{-1}{x+5}\\right)^{\\frac{x-1}{3}}$，指数极限 $\\dfrac{1-x}{3x+15}\\to-\\dfrac{1}{3}$，故 $e^{-1/3}$。"},{"id":23,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"已知 $\\lim\\limits_{n\\to\\infty}\\left(1+\\dfrac{5}{n}\\right)^{nk}=e^{-5}$，则 $k=$______.","a":"$-1$","s":"极限为 $e^{5k}=e^{-5}$，故 $k=-1$。"},{"id":24,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 0}(1+2\\sin x^{2})^{\\frac{1}{1-\\cos x}}=$______.","a":"$e^{4}$","s":"指数极限 $\\dfrac{2x^{2}}{\\frac{1}{2}x^{2}}=4$，故原式 $=e^{4}$。"},{"id":25,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 2}\\dfrac{x^{3}-3x^{2}+4}{x^{2}-4x+4}=$______.","a":"$3$","s":"两次洛必达：$\\dfrac{3x^{2}-6x}{2x-4}\\to\\dfrac{6x-6}{2}\\to 3$。"},{"id":26,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 0}\\dfrac{e^{-x}-e^{x}}{\\sin 2x}=$______.","a":"$-1$","s":"洛必达：$\\dfrac{-e^{-x}-e^{x}}{2\\cos 2x}\\to-1$。"},{"id":27,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 0^{+}}x\\ln x=$______.","a":"$0$","s":"化为 $\\dfrac{\\ln x}{1/x}$，洛必达得 $-x\\to 0$。"},{"id":28,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 0^{+}}x^{\\sin x}=$______.","a":"$1$","s":"$x^{\\sin x}=e^{\\sin x\\ln x}$，而 $x\\ln x\\to 0$，故极限 $=e^{0}=1$。"},{"id":29,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$\\lim\\limits_{x\\to 0}\\left(x^{-2}-\\dfrac{\\sin x}{x^{3}}\\right)=$______.","a":"$\\dfrac{1}{6}$","s":"通分得 $\\dfrac{x-\\sin x}{x^{3}}\\to\\dfrac{1}{6}$。"},{"id":30,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"若极限 $\\lim\\limits_{x\\to 0}\\dfrac{a+e^{x}-2}{x-x^{2}}$ 存在，则 $a=$______.","a":"$1$","s":"分母趋于 0，故分子极限须为 0：$a+1-2=0$，得 $a=1$。"},{"id":31,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"当 $x\\to 0$ 时，$\\sqrt{1-ax^{2}}-1$ 与 $x\\sin x$ 是等价无穷小，则 $a=$______.","a":"$-2$","s":"$\\dfrac{-\\frac{1}{2}ax^{2}}{x^{2}}=1$，得 $a=-2$。"},{"id":32,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"当 $x\\to 0$ 时，$2x\\arcsin x^{2}$ 与 $x\\sin x^{n+1}$ 是同阶无穷小，则 $n=$______.","a":"$1$","s":"分子 $\\sim 2x^{3}$，分母 $\\sim x^{n+2}$，同阶则 $n+2=3$，故 $n=1$。"},{"id":33,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"设 $f(x)=\\begin{cases}\\dfrac{\\sin kx}{x},&x>0\\\\ \\cos x+1,&x\\leqslant 0\\end{cases}$ 且 $\\lim\\limits_{x\\to 0}f(x)$ 存在，则 $k=$______.","a":"$2$","s":"右极限 $k$，左极限 $2$，故 $k=2$。"},{"id":34,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"设 $f(x)=\\dfrac{|x|}{x}$，则 $\\lim\\limits_{x\\to 0}f(x)$______（存在还是不存在）.","a":"不存在","s":"右极限 $1$，左极限 $-1$，左右不等故不存在。"},{"id":35,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"极限 $\\lim\\limits_{x\\to 0}\\dfrac{e^{1/x}+2}{e^{1/x}-2}$______（存在还是不存在）.","a":"不存在","s":"右极限 $1$，左极限 $-1$，故不存在。"},{"id":36,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"极限 $\\lim\\limits_{x\\to 0}\\arctan\\dfrac{1}{x}$______（存在还是不存在）.","a":"不存在","s":"右极限 $\\dfrac{\\pi}{2}$，左极限 $-\\dfrac{\\pi}{2}$。"},{"id":37,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$f(x)=\\begin{cases}e^{x}-1,&x\\leqslant 0\\\\ x^{2}\\sin\\dfrac{1}{x},&x>0\\end{cases}$ 在 $x=0$ 处______（连续还是间断）.","a":"连续","s":"左右极限均为 $0$ 且 $f(0)=0$，故连续。"},{"id":38,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$f(x)=\\begin{cases}2\\cos x-1,&x\\leqslant 0\\\\ x\\sin\\dfrac{1}{x}+\\dfrac{1}{x}\\sin x,&x>0\\end{cases}$ 在 $x=0$ 处______（连续还是间断）.","a":"连续","s":"左极限 $1$，右极限 $0+1=1$，$f(0)=1$，故连续。"},{"id":39,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"设 $f(x)=\\begin{cases}(1+2x)^{\\frac{1}{x}},&x\\neq 0\\\\ a,&x=0\\end{cases}$ 在 $x=0$ 处连续，则 $a=$______.","a":"$e^{2}$","s":"$\\lim\\limits_{x\\to 0}(1+2x)^{1/x}=e^{2}$，连续性要求 $a=e^{2}$。"},{"id":40,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$x=0$ 是 $y=x\\cos\\dfrac{1}{x}$ 的______间断点.","a":"可去","s":"$\\lim\\limits_{x\\to 0}x\\cos\\dfrac{1}{x}=0$，但 $x=0$ 处无定义，故为可去间断点。"},{"id":41,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"已知 $f(x)=\\begin{cases}\\dfrac{x^{2}-4}{x-2},&x\\neq 2\\\\ 0,&x=2\\end{cases}$，则 $x=2$ 是 $f(x)$ 的______间断点.","a":"可去","s":"$\\lim\\limits_{x\\to 2}f(x)=4\\neq f(2)=0$，故为可去间断点。"},{"id":42,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$x=0$ 是 $f(x)=\\begin{cases}\\dfrac{\\sin x^{2}}{x\\tan x},&x>0\\\\ 0,&x=0\\\\ \\dfrac{\\ln(1-x)}{2x},&x<0\\end{cases}$ 的______间断点.","a":"跳跃","s":"左极限 $-\\dfrac{1}{2}$，右极限 $1$，左右极限存在但不相等，故为跳跃间断点。"},{"id":43,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"$f(x)=\\dfrac{1}{1-e^{\\frac{x}{1-x}}}$ 在 $x=1$ 处为______间断点.","a":"跳跃","s":"$x\\to 1^{+}$ 时 $\\dfrac{x}{1-x}\\to-\\infty$，$f\\to 1$；$x\\to 1^{-}$ 时 $\\dfrac{x}{1-x}\\to+\\infty$，$f\\to 0$，故为跳跃间断点。"},{"id":44,"ch":1,"chName":"函数极限连续","sec":"基础填空","q":"设 $f(x)=\\begin{cases}\\dfrac{e^{2ax}-1}{x},&x\\neq 0\\\\ b,&x=0\\end{cases}$ 在 $x=0$ 处连续（$b>0$），则 $\\dfrac{a}{b}=$______.","a":"$\\dfrac{1}{2}$","s":"$\\lim\\limits_{x\\to 0}f(x)=\\dfrac{2ax}{x}=2a=b$，故 $\\dfrac{a}{b}=\\dfrac{1}{2}$。"},{"id":45,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $f'(x_{0})=\\dfrac{1}{2}$，则 $\\lim\\limits_{\\Delta x\\to 0}\\dfrac{f(x_{0}-2\\Delta x)-f(x_{0})}{\\Delta x}=$______.","a":"$-1$","s":"$=-2f'(x_{0})=-2\\cdot\\dfrac{1}{2}=-1$。"},{"id":46,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $f'(x_{0})=A$，则 $\\lim\\limits_{\\Delta x\\to 0}\\dfrac{f(x_{0}+2\\Delta x)-f(x_{0}-3\\Delta x)}{\\Delta x}=$______.","a":"$5A$","s":"拆成两段：$2f'(x_{0})+3f'(x_{0})=5A$。"},{"id":47,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设函数 $f(x)$ 在 $x=1$ 处连续，且 $\\lim\\limits_{x\\to 1}\\dfrac{f(x)}{x-1}=2$，则 $f(1)=$______，$f'(1)=$______.","a":"$f(1)=0$；$f'(1)=2$","s":"分母趋于 0 且极限存在，故 $\\lim f(x)=0$，由连续性得 $f(1)=0$；再由导数定义得 $f'(1)=2$。"},{"id":48,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $f'(x_{0})=2$，则 $\\lim\\limits_{n\\to\\infty}n\\left[f\\left(x_{0}+\\dfrac{1}{n}\\right)-f(x_{0})\\right]=$______.","a":"$2$","s":"该式即差商 $\\dfrac{f(x_{0}+1/n)-f(x_{0})}{1/n}\\to f'(x_{0})=2$。"},{"id":49,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $f(0)=0,\\ f'(0)=-1$，则 $\\lim\\limits_{x\\to 0}\\dfrac{f(3x)}{x}=$______.","a":"$-3$","s":"$=3\\cdot\\dfrac{f(3x)-f(0)}{3x}\\to 3f'(0)=-3$。（原书答案栏印作 3，按解析应为 $-3$，此处以解析为准。）"},{"id":50,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"若 $f(x)=\\begin{cases} x^3, & x \\leqslant 1, \\\\ ax+b, & x > 1 \\end{cases}$ 在 $x=1$ 处可导, 则 $a=$ \\_\\_, $b=$ \\_\\_.","a":"$3;\\ -2$","s":"由连续性知 $a+b=1$；由左右导数相等得 $a=3$，从而 $b=-2$。"},{"id":51,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $f(x)=|\\sin 2x|$, 则 $f'_{-}(0)=$ \\_\\_, $f'_{+}(0)=$ \\_\\_, $f'(0)=$ \\_\\_.","a":"$-2;\\ 2;$ 不存在","s":"$f'_-(0)=-2$，$f'_+(0)=2$，二者不相等，故 $f'(0)$ 不存在。"},{"id":52,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"$\\left(\\int_{0}^{1} x \\arcsin x \\mathrm{~d} x\\right)^{\\prime}=$ \\_\\_.","a":"$0$","s":"定积分 $\\int_0^1 x\\arcsin x\\,\\mathrm{d}x$ 是常数，故导数为 $0$。"},{"id":53,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"$\\left(2 x^{2} \\cdot \\sqrt[4]{x}\\right)^{\\prime}=$ \\_\\_.","a":"$\\dfrac{22}{5}x^{\\frac{6}{5}}$","s":"原书题目印 $\\sqrt[4]{x}$，答案按 $\\sqrt[5]{x}$ 计算：$2x^2\\cdot x^{\\frac{1}{5}}=2x^{\\frac{11}{5}}$，故导数为 $\\dfrac{22}{5}x^{\\frac{6}{5}}$。按答案收录。"},{"id":54,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"$y=\\ln (\\ln x)$, 则 $\\frac{\\mathrm{d} y}{\\mathrm{~d} x}=$ \\_\\_.","a":"$\\frac{1}{x \\ln x}$","s":"$(\\ln(\\ln x))'=\\frac{1}{\\ln x}\\cdot\\frac{1}{x}=\\frac{1}{x\\ln x}$。"},{"id":55,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"$y=\\arctan \\left(\\mathrm{e}^{2 x}\\right)$, 则 $\\left.y^{\\prime}\\right|_{x=0}=$ \\_\\_.","a":"$1$","s":"$y'=\\frac{2\\mathrm{e}^{2x}}{1+\\mathrm{e}^{4x}}$，故 $y'(0)=\\frac{2}{2}=1$。"},{"id":56,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"已知 $y=x^{2} f(\\sqrt{x})$, 且 $f(u)$ 可导, 则 $y^{\\prime}=$ \\_\\_.","a":"$2xf'(\\sqrt{x})+\\frac{1}{2}x^{\\frac{3}{2}}f'(\\sqrt{x})$","s":"$y'=2xf(\\sqrt{x})+x^2\\cdot f'(\\sqrt{x})\\cdot\\frac{1}{2\\sqrt{x}}=2xf(\\sqrt{x})+\\frac{1}{2}x^{\\frac{3}{2}}f'(\\sqrt{x})$。"},{"id":57,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"$y=x^{2} \\sin \\frac{1}{x}$, 则 $y^{\\prime}=$ \\_\\_.","a":"$2x \\sin \\frac{1}{x} - \\cos \\frac{1}{x}$","s":"$y'=2x\\sin\\frac{1}{x}+x^2\\cos\\frac{1}{x}\\cdot\\left(-\\frac{1}{x^2}\\right)=2x\\sin\\frac{1}{x}-\\cos\\frac{1}{x}$。"},{"id":58,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $y = \\frac{2x}{\\sqrt{x^2-1}}$, 则 $\\mathrm{d} y =$ \\_\\_.","a":"$-2(x^2-1)^{-\\frac{3}{2}} \\mathrm{d}x$","s":"$y'=-\\frac{2}{(x^2-1)^{\\frac{3}{2}}}$，故 $\\mathrm{d}y=-2(x^2-1)^{-\\frac{3}{2}}\\mathrm{d}x$。注：原书答案栏指数误印为正，按解析收录。"},{"id":59,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设函数 $y = f(2x^3)$, 且 $f(u)$ 二阶可导, 则 $\\frac{\\mathrm{d}^2y}{\\mathrm{d}x^2} =$ \\_\\_.","a":"$36x^4 f''(2x^3) + 12x f'(2x^3)$","s":"$y'=6x^2f'(2x^3)$，$y''=36x^4f''(2x^3)+12xf'(2x^3)$。"},{"id":60,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $y = y(x)$ 由 $y = xe^y$ 确定, 则 $\\frac{\\mathrm{d}y}{\\mathrm{d}x} =$ \\_\\_.","a":"$\\frac{\\mathrm{e}^y}{1-x\\mathrm{e}^y}$","s":"隐函数求导：$F_x'=-\\mathrm{e}^y$，$F_y'=1-x\\mathrm{e}^y$，故 $\\frac{\\mathrm{d}y}{\\mathrm{d}x}=-\\frac{F_x'}{F_y'}=\\frac{\\mathrm{e}^y}{1-x\\mathrm{e}^y}$。"},{"id":61,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $y = y(x)$ 由 $y^3 + x^3 - xy = 0$ 确定, 则 $\\mathrm{d} y =$ \\_\\_.","a":"$\\frac{y-3x^2}{3y^2-x} \\mathrm{d}x$","s":"隐函数求导：$F_x'=3x^2-y$，$F_y'=3y^2-x$，故 $\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{y-3x^2}{3y^2-x}$，$\\mathrm{d}y=\\frac{y-3x^2}{3y^2-x}\\mathrm{d}x$。"},{"id":62,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $y = f(x)$ 由 $\\begin{cases} x = \\mathrm{e}^{-2t}, \\\\ y = \\mathrm{e}^{3t} \\end{cases}$ 确定, 则 $\\frac{\\mathrm{d}y}{\\mathrm{d}x} =$ \\_\\_.","a":"$-\\frac{3}{2}\\mathrm{e}^{5t}$","s":"参数方程求导：$\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{y'(t)}{x'(t)}=\\frac{3\\mathrm{e}^{3t}}{-2\\mathrm{e}^{-2t}}=-\\frac{3}{2}\\mathrm{e}^{5t}$。"},{"id":63,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $y = f(x)$ 由 $\\begin{cases} x = t^2, \\\\ y = \\cos t \\end{cases}$ 确定, 则 $\\frac{\\mathrm{d}^2y}{\\mathrm{d}x^2} =$ \\_\\_.","a":"$\\frac{\\sin t-t\\cos t}{4t^3}$","s":"$\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{-\\sin t}{2t}$，$\\frac{\\mathrm{d}^2y}{\\mathrm{d}x^2}=\\frac{\\mathrm{d}(\\frac{\\mathrm{d}y}{\\mathrm{d}x})/\\mathrm{d}t}{\\mathrm{d}x/\\mathrm{d}t}=\\frac{\\sin t-t\\cos t}{4t^3}$。"},{"id":64,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $f(x) = \\begin{cases} x^2 \\cos \\frac{1}{x}, & x \\neq 0, \\\\ 0, & x = 0, \\end{cases}$ 则 $f'(x) =$ \\_\\_.","a":"$\\begin{cases} 2x \\cos \\frac{1}{x} + \\sin \\frac{1}{x}, & x \\neq 0, \\\\ 0, & x = 0 \\end{cases}$","s":"$f'(0)=\\lim_{x\\to0}\\frac{x^2\\cos\\frac{1}{x}}{x}=\\lim_{x\\to0}x\\cos\\frac{1}{x}=0$；$x\\neq0$ 时 $f'(x)=2x\\cos\\frac{1}{x}+\\sin\\frac{1}{x}$。"},{"id":65,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"$\\frac{d}{dx} \\left(\\int_a^x t \\sin t \\, dt\\right) =$ \\_\\_.","a":"$x \\sin x$","s":"变限积分求导：$\\frac{\\mathrm{d}}{\\mathrm{d}x}\\int_a^x f(t)\\mathrm{d}t=f(x)$。"},{"id":66,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $F(x) = \\int_{x^2}^{\\sin x} \\ln(1 + t) \\, dt$，则 $F'(x) =$ \\_\\_.","a":"$\\cos x \\ln(1+\\sin x) - 2x \\ln(1+x^2)$","s":"$F'(x)=\\cos x\\ln(1+\\sin x)-2x\\ln(1+x^2)$。"},{"id":67,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $g(x) = \\int_{-x}^1 \\sin t \\, dt$，则 $g'(x) =$ \\_\\_.","a":"$-2x \\sin x^2$","s":"$g'(x)=-\\sin(-x^2)\\cdot(-2x)=2x\\sin(-x^2)=-2x\\sin x^2$。"},{"id":68,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $F(x) = \\int_0^x x^2 \\cos t \\, dt$，则 $F'(x) =$ \\_\\_.","a":"$2x\\int_0^x \\cos t \\, dt + x^2 \\cos x$","s":"被积函数含 $x$ 时先提到积分外：$F(x)=x^2\\int_0^x\\cos t\\,\\mathrm{d}t$，故 $F'(x)=2x\\int_0^x\\cos t\\,\\mathrm{d}t+x^2\\cos x$。"},{"id":69,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $y = x^{x^2}$，则 $dy =$ \\_\\_.","a":"$\\mathrm{e}^{x^2\\ln x}(2x\\ln x + x)\\mathrm{d}x$","s":"$y=x^{x^2}=\\mathrm{e}^{x^2\\ln x}$，$y'=\\mathrm{e}^{x^2\\ln x}(2x\\ln x+x)$。"},{"id":70,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $y = xe^x$，则 $y^{(n)} =$ \\_\\_.","a":"$(x+n)\\mathrm{e}^x$","s":"$y'=(x+1)\\mathrm{e}^x$，$y''=(x+2)\\mathrm{e}^x$，归纳得 $y^{(n)}=(x+n)\\mathrm{e}^x$。"},{"id":71,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $y = e^{5x}$，则 $y^{(n)} =$ \\_\\_.","a":"$5^n\\mathrm{e}^{5x}$","s":"$y'=5\\mathrm{e}^{5x}$，$y''=5^2\\mathrm{e}^{5x}$，归纳得 $y^{(n)}=5^n\\mathrm{e}^{5x}$。"},{"id":72,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"设 $f(x)$ 可导且 $\\lim_{x \\to 0} \\frac{f(1-x) - f(1)}{2x} = 1$，则曲线在点 $[1, f(1)]$ 处切线的斜率为：\\_\\_.","a":"$-2$","s":"$\\lim_{x\\to0}\\frac{f(1-x)-f(1)}{2x}=-\\frac{1}{2}f'(1)=1$，故 $f'(1)=-2$。"},{"id":73,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"函数 $y = x + e^x$ 在 $x = 0$ 处的切线方程为: \\_\\_.","a":"$y = 2x+1$","s":"$y(0)=1$，$y'=1+\\mathrm{e}^x$，$y'(0)=2$，切线 $y-1=2x$，即 $y=2x+1$。"},{"id":74,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"曲线 $y = x^3 + x + 1$ 在其拐点处的切线方程为: \\_\\_.","a":"$y = x+1$","s":"$y''=6x$，拐点 $x=0$ 即 $(0,1)$；$y'=3x^2+1$，斜率 $1$，切线 $y=x+1$。"},{"id":75,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"函数 $y = ax^2 - 2bx - 1$ 在 $x = 1$ 处取得极大值 3, 则 $a =$ \\_\\_, $b =$ \\_\\_.","a":"$-4;\\ -4$","s":"$y(1)=a-2b-1=3$，$y'(1)=2a-2b=0$，解得 $a=b=-4$。"},{"id":76,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"$f(x) = \\arctan x$ 在 $[0, 1]$ 上满足拉格朗日中值定理的中值 $\\xi =$ \\_\\_.","a":"$\\sqrt{\\frac{4 - \\pi}{\\pi}}$","s":"$\\frac{1}{1+\\xi^2}=\\frac{f(1)-f(0)}{1-0}=\\frac{\\pi}{4}$，解得 $\\xi=\\sqrt{\\frac{4-\\pi}{\\pi}}$（负值舍去）。"},{"id":77,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"函数 $y = \\frac{2}{(x+3)^2}$ 的垂直渐近线为: \\_\\_.","a":"$x = -3$","s":"$\\lim_{x\\to-3}\\frac{2}{(x+3)^2}=\\infty$，故 $x=-3$ 为垂直渐近线。"},{"id":78,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"函数 $y = \\frac{1}{x} + \\arctan x$ 的水平渐近线为: \\_\\_.","a":"$y = \\frac{\\pi}{2};\\ y = -\\frac{\\pi}{2}$","s":"$\\lim_{x\\to+\\infty}(\\frac{1}{x}+\\arctan x)=\\frac{\\pi}{2}$，$\\lim_{x\\to-\\infty}(\\frac{1}{x}+\\arctan x)=-\\frac{\\pi}{2}$。"},{"id":79,"ch":2,"chName":"导数与微分","sec":"基础填空","q":"函数 $y = \\frac{x^2}{1 - x^3}$ 的水平渐近线为: \\_\\_.","a":"$y = 0$","s":"$\\lim_{x\\to\\infty}\\frac{x^2}{1-x^3}=0$。"},{"id":80,"ch":3,"chName":"不定积分","sec":"基础填空","q":"设函数 $f(x) = ae^{-2x}$ 的一个原函数是 $2e^{-2x}$, 则 $a =$ \\_\\_.","a":"$-4$","s":"$(2\\mathrm{e}^{-2x})'=-4\\mathrm{e}^{-2x}=a\\math ^{2} \\ln x \\, dx$ \\_\\_\\_ $\\int_{1}^{2} (\\ln x)^2 dx$.","a":"$>$","s":"当 $1\\le x\\le2$ 时 $0\\le\\ln x<1$，故 $\\ln x\\ge(\\ln x)^2$，仅 $x=1$ 取等。"},{"id":126,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"设 $\\int_{-1}^{1} 2 f(x) dx = 6$，$\\int_{-1}^{3} f(x) dx = 5$，则 $\\int_{1}^{3} f(x) dx =$ \\_\\_.","a":"$2$","s":"由前者得 $\\int_{-1}^1f=3$，故 $\\int_1^3f=\\int_{-1}^3f-\\int_{-1}^1f=5-3=2$。注：原书该题第二项积分上限印刷模糊，按解析逻辑收取 $\\int_{-1}^{3}$。"},{"id":127,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{-2}^{2} (3+x)\\sqrt{4-x^2} \\, dx =$ \\_\\_.","a":"$6\\pi$","s":"奇函数项 $\\int_{-2}^{2}x\\sqrt{4-x^2}\\mathrm{d}x=0$，余 $3\\int_{-2}^{2}\\sqrt{4-x^2}\\mathrm{d}x=3\\cdot2\\pi=6\\pi$。"},{"id":128,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{-\\frac{\\pi}{2}}^{\\frac{\\pi}{2}} \\left(\\sin^{3} x+\\cos^{4} x\\right) dx =$ \\_\\_.","a":"$\\frac{3}{8}\\pi$","s":"$\\sin^3x$ 为奇函数积分为 0；$\\int_{-\\pi/2}^{\\pi/2}\\cos^4x\\mathrm{d}x=2\\cdot\\frac34\\cdot\\frac12\\cdot\\frac{\\pi}{2}=\\frac{3}{8}\\pi$。"},{"id":129,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{1}^{4} \\sqrt{x}(2\\sqrt{x}-1) dx =$ \\_\\_.","a":"$\\frac{31}{3}$","s":"展开为 $2x-\\sqrt{x}$ 后积分：$(x^2-\\frac23x^{\\frac32})\\big|_1^4=\\frac{31}{3}$。"},{"id":130,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{\\frac{1}{\\sqrt{3}}}^{\\sqrt{3}} \\frac{1}{1+x^{2}} dx =$ \\_\\_.","a":"$\\frac{\\pi}{6}$","s":"$\\arctan x\\big|_{1/\\sqrt3}^{\\sqrt3}=\\frac{\\pi}{3}-\\frac{\\pi}{6}=\\frac{\\pi}{6}$。"},{"id":131,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{\\frac{\\pi}{4}} \\tan^{2}\\theta \\, d\\theta =$ \\_\\_.","a":"$1-\\frac{\\pi}{4}$","s":"$\\tan^2\\theta=\\sec^2\\theta-1$，积分得 $(\\tan\\theta-\\theta)\\big|_0^{\\pi/4}=1-\\frac{\\pi}{4}$。"},{"id":132,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{4\\pi} |\\sin x| dx =$ \\_\\_.","a":"$8$","s":"周期为 $\\pi$，共 4 个周期：$4\\int_0^{\\pi}\\sin x\\mathrm{d}x=4\\cdot2=8$。"},{"id":133,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"设 $f(x)=\\begin{cases} x^{2}+1, & x \\leqslant 1, \\\\ 4x^{3}, & x > 1, \\end{cases}$ 则 $\\int_{0}^{2} f(x) dx =$ \\_\\_.","a":"$\\frac{49}{3}$","s":"分两段：$\\int_0^1(x^2+1)\\mathrm{d}x+\\int_1^2 4x^3\\mathrm{d}x=\\frac43+15=\\frac{49}{3}$。"},{"id":134,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{1} \\frac{1}{(1+2x)^{3}} dx =$ \\_\\_.","a":"$\\frac{2}{9}$","s":"凑 $\\mathrm{d}(1+2x)$，得 $-\\frac14(1+2x)^{-2}\\big|_0^1=\\frac29$。"},{"id":135,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{\\frac{\\pi}{2}} \\sin x \\cos^{3} x \\, dx =$ \\_\\_.","a":"$\\frac{1}{4}$","s":"$-\\int_0^{\\pi/2}\\cos^3x\\mathrm{d}(\\cos x)=-\\frac14\\cos^4x\\big|_0^{\\pi/2}=\\frac14$。"},{"id":136,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{-1}^{1} \\frac{x}{\\sqrt{5-4x}} dx =$ \\_\\_.","a":"$\\frac{1}{6}$","s":"令 $\\sqrt{5-4x}=t$ 换元，化为 $\\frac18\\int_1^3(5-t^2)\\mathrm{d}t=\\frac16$。"},{"id":137,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{\\frac{1}{\\sqrt{2}}}^{1} \\frac{\\sqrt{1-x^{2}}}{x^{2}} dx =$ \\_\\_.","a":"$1-\\frac{\\pi}{4}$","s":"令 $x=\\sin t$，化为 $\\int_{\\pi/4}^{\\pi/2}\\cot^2t\\mathrm{d}t=( -\\cot t-t)\\big|_{\\pi/4}^{\\pi/2}=1-\\frac{\\pi}{4}$。"},{"id":138,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{1} t e^{-t^{2}} dt =$ \\_\\_.","a":"$\\frac{1}{2}(1-\\mathrm{e}^{-1})$","s":"$-\\frac12\\int_0^1\\mathrm{e}^{-t^2}\\mathrm{d}(-t^2)=-\\frac12\\mathrm{e}^{-t^2}\\big|_0^1$。"},{"id":139,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{1}^{e^{3}} \\frac{1}{x \\sqrt{1+\\ln x}} dx =$ \\_\\_.","a":"$2$","s":"凑 $\\mathrm{d}(1+\\ln x)$，得 $2\\sqrt{1+\\ln x}\\big|_1^{\\mathrm{e}^3}=2\\sqrt4-2=2$。"},{"id":140,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{1} \\frac{3x^{2}+2x}{x^{3}+x^{2}+1} dx =$ \\_\\_.","a":"$\\ln 3$","s":"分子正是分母的导数：$\\ln(x^3+x^2+1)\\big|_0^1=\\ln3$。"},{"id":141,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{2} \\frac{1}{x^{2}-2x+2} dx =$ \\_\\_.","a":"$\\frac{\\pi}{2}$","s":"配方 $(x-1)^2+1$，得 $\\arctan(x-1)\\big|_0^2=\\frac{\\pi}{2}$。"},{"id":142,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{1} \\frac{(\\arctan x)^{2}}{1+x^{2}} dx =$ \\_\\_.","a":"$\\frac{\\pi^{3}}{192}$","s":"$\\frac{\\mathrm{d}x}{1+x^2}=\\mathrm{d}(\\arctan x)$，得 $\\frac13(\\arctan x)^3\\big|_0^1=\\frac{\\pi^3}{192}$。"},{"id":143,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{1} x e^{-x} dx =$ \\_\\_.","a":"$1-2\\mathrm{e}^{-1}$","s":"分部：$-\\int_0^1x\\mathrm{d}(\\mathrm{e}^{-x})=1-2\\mathrm{e}^{-1}$。"},{"id":144,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{1}^{9} \\frac{\\ln x}{2\\sqrt{x}} dx =$ \\_\\_.","a":"$6\\ln 3-4$","s":"$\\int\\ln x\\,\\mathrm{d}(\\sqrt{x})=\\sqrt{x}\\ln x\\big|_1^9-\\int_1^9\\frac{1}{\\sqrt{x}}\\mathrm{d}x=6\\ln3-4$。"},{"id":145,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{1} x \\arctan x \\, dx =$ \\_\\_.","a":"$\\frac{\\pi}{4}-\\frac{1}{2}$","s":"$\\frac12\\int\\arctan x\\mathrm{d}(x^2)$，分部后得 $\\frac{\\pi}{4}-\\frac12$。"},{"id":146,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{1}^{+\\infty} \\frac{1}{x^{4}} dx =$ \\_\\_.","a":"$\\frac{1}{3}$","s":"$-\\frac13x^{-3}\\big|_1^{+\\infty}=\\frac13$。"},{"id":147,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"$\\int_{0}^{+\\infty} \\frac{1}{x^{2}+2x+2} dx =$ \\_\\_.","a":"$\\frac{\\pi}{4}$","s":"配方 $(x+1)^2+1$，得 $\\arctan(x+1)\\big|_0^{+\\infty}=\\frac{\\pi}{2}-\\frac{\\pi}{4}=\\frac{\\pi}{4}$。"},{"id":148,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"由曲线 $y=x^{2}$ 和直线 $x-y+2=0$ 所围成平面图形的面积为 \\_\\_.","a":"$\\frac{9}{2}$","s":"交点为 $x=-1,2$，$S=\\int_{-1}^{2}(x+2-x^2)\\mathrm{d}x=\\frac92$。"},{"id":149,"ch":4,"chName":"定积分与反常积分","sec":"基础填空","q":"设平面图形由 $y=x^{2}$ 和 $x=y^{2}$ 围成，则旋转体体积 $V_{y}=$ \\_\\_.","a":"$\\frac{3}{10}\\pi$","s":"绕 $y$ 轴柱壳法：$V_y=2\\pi\\int_0^1 x(\\sqrt{x}-x^2)\\mathrm{d}x=2\\pi(\\frac25-\\frac14)=\\frac{3}{10}\\pi$。"},{"id":150,"ch":5,"chName":"微分方程","sec":"基础填空","q":"微分方程 $x^{2}+x-y^{\\prime}=0$ 的通解为 \\_\\_\\_\\_.","a":"$y=\\frac{1}{3}x^{3}+\\frac{1}{2}x^{2}+C$","s":"由 $x^2+x-y'=0$ 得 $\\mathrm{d}y=(x^2+x)\\mathrm{d}x$，积分即得。"},{"id":151,"ch":5,"chName":"微分方程","sec":"基础填空","q":"微分方程 $y^{\\prime}=\\frac{1-x}{x}y$ 的通解是 \\_\\_\\_\\_.","a":"$y=Cx\\mathrm{e}^{-x}$","s":"齐次线性方程，$P(x)=1-\\frac1x$，$y=C\\mathrm{e}^{-\\int P\\mathrm{d}x}=C\\mathrm{e}^{\\ln x-x}=Cx\\mathrm{e}^{-x}$。"},{"id":152,"ch":5,"chName":"微分方程","sec":"基础填空","q":"微分方程 $\\frac{dy}{dx}=(1-y^{2})\\tan x$ 的通解为 \\_\\_\\_\\_.","a":"$\\frac{1+y}{1-y}=C\\sec^{2}x$","s":"分离变量 $\\frac{\\mathrm{d}y}{1-y^2}=\\tan x\\mathrm{d}x$，积分得 $\\frac12\\ln|\\frac{1+y}{1-y}|=\\ln|\\frac{C_1}{\\cos x}|$，整理即得。"},{"id":153,"ch":5,"chName":"微分方程","sec":"基础填空","q":"微分方程 $\\frac{dy}{dx}=\\frac{y}{x}+\\tan\\frac{y}{x}$ 的通解为 \\_\\_\\_\\_.","a":"$\\sin\\frac{y}{x}=Cx$","s":"令 $u=\\frac yx$，化 $x\\frac{\\mathrm{d}u}{\\mathrm{d}x}=\\tan u$，分离变量 $\\cot u\\mathrm{d}u=\\frac{\\mathrm{d}x}{x}$，得 $\\sin u=Cx$。"},{"id":154,"ch":5,"chName":"微分方程","sec":"基础填空","q":"微分方程 $\\frac{dy}{dx}-2xy=x$ 的通解为 \\_\\_\\_\\_.","a":"$y=C\\mathrm{e}^{x^{2}}-\\frac{1}{2}$","s":"一阶线性：$y=\\mathrm{e}^{x^2}(\\int x\\mathrm{e}^{-x^2}\\mathrm{d}x+C)=\\mathrm{e}^{x^2}(-\\frac12\\mathrm{e}^{-x^2}+C)$。"},{"id":155,"ch":5,"chName":"微分方程","sec":"基础填空","q":"微分方程 $y^{\\prime\\prime}+y^{\\prime}-2y=0$ 的通解为 \\_\\_\\_\\_.","a":"$y=C_{1}\\mathrm{e}^{-2x}+C_{2}\\mathrm{e}^{x}$","s":"$r^2+r-2=0$，$r_1=-2,r_2=1$。"},{"id":156,"ch":5,"chName":"微分方程","sec":"基础填空","q":"微分方程 $y^{\\prime\\prime}+6y^{\\prime}+13y=0$ 的通解为 \\_\\_\\_\\_.","a":"$y=\\mathrm{e}^{-3x}(C_{1}\\cos 2x+C_{2}\\sin 2x)$","s":"$r^2+6r+13=0$，$r=-3\\pm2i$。"},{"id":157,"ch":5,"chName":"微分方程","sec":"基础填空","q":"微分方程 $y^{\\prime\\prime}-2y^{\\prime}+y=0$ 的通解为 \\_\\_\\_\\_.","a":"$y=(C_{1}+C_{2}x)\\mathrm{e}^{x}$","s":"$(r-1)^2=0$，二重根 $r=1$。"},{"id":158,"ch":5,"chName":"微分方程","sec":"基础填空","q":"微分方程 $y^{\\prime\\prime\\prime}-4y^{\\prime}=0$ 的通解为 \\_\\_\\_\\_.","a":"$y=C_{1}+C_{2}\\mathrm{e}^{-2x}+C_{3}\\mathrm{e}^{2x}$","s":"$r^3-4r=r(r+2)(r-2)=0$，$r=0,\\pm2$。"},{"id":159,"ch":5,"chName":"微分方程","sec":"基础填空","q":"$y^{\\prime\\prime}-3y^{\\prime}+2y=e^{x}$ 的特解可设为 \\_\\_\\_\\_.","a":"$y^{*}=ax\\mathrm{e}^{x}$","s":"特征根 $r_1=1,r_2=2$，$\\lambda=1$ 为单根，故乘 $x$。"},{"id":160,"ch":5,"chName":"微分方程","sec":"基础填空","q":"$y^{\\prime\\prime}-y=(4x+1)e^{x}$ 的特解可设为 \\_\\_\\_\\_.","a":"$y^{*}=x(ax+b)\\mathrm{e}^{x}$","s":"特征根 $\\pm1$，$\\lambda=1$ 为单根，右端为 1 次多项式，故设 $x(ax+b)\\mathrm{e}^x$。"},{"id":161,"ch":5,"chName":"微分方程","sec":"基础填空","q":"$y^{\\prime\\prime}-y=2e^{-x}$ 的特解可设为 \\_\\_\\_\\_.","a":"$y^{*}=ax\\mathrm{e}^{-x}$","s":"$\\lambda=-1$ 为单根，故乘 $x$。"},{"id":162,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"$\\lim\\limits_{(x,y)\\to(0,0)}\\frac{2\\sin x^{2}y^{2}}{\\ln(1-x^{2}y^{2})}=$ \\_\\_\\_\\_.","a":"$-2$","s":"等价无穷小 $\\sin u\\sim u$，$\\ln(1-u)\\sim -u$，原式 $=\\frac{2x^2y^2}{-x^2y^2}=-2$。"},{"id":163,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"$\\lim\\limits_{\\substack{x\\to0\\y\\to0}}\\frac{\\sqrt{1+2xy}-1}{e^{2xy}-1}=$ \\_\\_\\_\\_.","a":"$\\frac{1}{2}$","s":"分子 $\\sim\\frac12(2xy)=xy$，分母 $\\sim2xy$，比值 $\\frac12$。"},{"id":164,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=\\ln(x+y^{2})$，则 $\\frac{\\partial^{2}z}{\\partial x^{2}}=$ \\_\\_\\_\\_.","a":"$-\\frac{1}{(x+y^{2})^{2}}$","s":"$\\frac{\\partial z}{\\partial x}=\\frac{1}{x+y^2}$，再对 $x$ 求导。"},{"id":165,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=x^{y}$，则 $\\frac{\\partial z}{\\partial x}=$ \\_\\_\\_\\_，$\\frac{\\partial z}{\\partial y}=$ \\_\\_\\_\\_.","a":"$yx^{y-1}$；$x^{y}\\ln x$","s":"对 $x$ 按幂函数求导，对 $y$ 按指数函数求导。注：原书该题指数印刷层叠不清，按答案解析收录为 $z=x^y$。"},{"id":166,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=(x+y)e^{yx}$，则 $dz=$ \\_\\_\\_\\_.","a":"$[\\mathrm{e}^{xy}+y\\mathrm{e}^{xy}(x+y)]dx+[\\mathrm{e}^{xy}+x\\mathrm{e}^{xy}(x+y)]dy$","s":"分别求偏导后代入 $\\mathrm{d}z=z_x\\mathrm{d}x+z_y\\mathrm{d}y$。"},{"id":167,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=\\arctan(x^{2}+y^{2})$，则 $dz\\big|_{(1,1)}=$ \\_\\_\\_\\_.","a":"$\\frac{2}{5}dx+\\frac{2}{5}dy$","s":"$z_x=\\frac{2x}{1+(x^2+y^2)^2}$，在 $(1,1)$ 处为 $\\frac{2}{5}$，$z_y$ 同。"},{"id":168,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=y\\ln(x^{2}y)$，则 $\\frac{\\partial^{2}z}{\\partial y\\partial x}=$ \\_\\_\\_\\_.","a":"$\\frac{2}{x}$","s":"$z_y=\\ln(x^2y)+1$，再对 $x$ 求导得 $\\frac{2}{x}$。"},{"id":169,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=\\sin xy$，而 $y=e^{2x}$，则 $\\frac{dz}{dx}=$ \\_\\_\\_\\_.","a":"$\\cos(x\\mathrm{e}^{2x})(\\mathrm{e}^{2x}+2x\\mathrm{e}^{2x})$","s":"复合求导 $z_x+z_y\\cdot y'$。"},{"id":170,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $w=x^{2}-xy^{3}+xyz$，则 $\\frac{\\partial w}{\\partial z}=$ \\_\\_\\_\\_.","a":"$xy$","s":"对 $z$ 求偏导，仅 $xyz$ 项有关。"},{"id":171,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=z(x,y)$ 由方程 $\\sin z-e^{z^{2}}+2xy=0$ 确定，则 $\\frac{\\partial z}{\\partial x}=$ \\_\\_\\_\\_.","a":"$\\frac{2y}{2\\mathrm{e}^{2z}-\\cos z}$","s":"隐函数：$F'_x=2y$，$F'_z=\\cos z-2\\mathrm{e}^{2z}$，$z_x=-\\frac{F'_x}{F'_z}$。"},{"id":172,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=u^{2}\\sin v$，而 $u=x-y$，$v=x+y$，则 $\\frac{\\partial z}{\\partial x}+\\frac{\\partial z}{\\partial y}=$ \\_\\_\\_\\_.","a":"$2(x-y)^{2}\\cos(x+y)$","s":"分别求 $z_x,z_y$ 后相加，正弦项抵消。"},{"id":173,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=f(u,v,w)$，其中 $f$ 可导，而 $u=2t^{3}$，$v=\\sin^{2}t$，$w=e^{-2t}$，则 $\\frac{dz}{dt}=$ \\_\\_\\_\\_.","a":"$6t^{2}f'_{u}+\\sin 2t\\,f'_{v}-2\\mathrm{e}^{-2t}f'_{w}$","s":"链式法则 $z'=f'_u\\cdot6t^2+f'_v\\cdot\\sin2t+f'_w\\cdot(-2\\mathrm{e}^{-2t})$。"},{"id":174,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=2\\sin y^{2}-x^{2}+f(u)$，而 $u=xy$，且 $f(u)$ 可微，则 $\\frac{\\partial z}{\\partial x}=$ \\_\\_\\_\\_.","a":"$-2x+yf'(u)$","s":"对 $x$ 求偏导，$f$ 项用 $f'(u)\\cdot u_x=yf'(u)$。"},{"id":175,"ch":6,"chName":"多元函数微分学","sec":"基础填空","q":"设 $z=f\\left(\\frac{y}{x},\\frac{x}{y}\\right)$，且 $f$ 可微，则 $\\frac{\\partial z}{\\partial x}=$ \\_\\_\\_\\_，$\\frac{\\partial z}{\\partial y}=$ \\_\\_\\_\\_.","a":"$-\\frac{y}{x^{2}}f'_{1}+\\frac{1}{y}f'_{2}$；$\\frac{1}{x}f'_{1}-\\frac{x}{y^{2}}f'_{2}$","s":"对两个中间变量分别用链式法则。"},{"id":176,"ch":7,"chName":"二重积分","sec":"基础填空","q":"设 $D$ 为 $|x|+|y|\\leqslant1$ 围成的区域，则 $\\iint_{D}3\\,d\\sigma=$ \\_\\_\\_\\_.","a":"$6$","s":"$D$ 为菱形，面积 $S_D=2$，故积分 $=3S_D=6$。"},{"id":177,"ch":7,"chName":"二重积分","sec":"基础填空","q":"设 $D$ 由直线 $y=x$，$y=-x$ 和 $x=1$ 围成，则 $\\iint_{D}x\\sin xy^{3}\\,dxdy=$ \\_\\_\\_\\_.","a":"$0$","s":"$D$ 关于 $x$ 轴对称，被积函数关于 $y$ 为奇函数，故积分为 0。"},{"id":178,"ch":7,"chName":"二重积分","sec":"基础填空","q":"设 $D:x^{2}+y^{2}\\leqslant1$，则 $\\iint_{D}2x^{2}\\left(y^{3}+\\frac{1}{x^{2}}\\right)dxdy=$ \\_\\_\\_\\_.","a":"$2\\pi$","s":"展开为 $2x^2y^3+2$，奇函数项积分为 0，余 $\\iint_D2\\mathrm{d}\\sigma=2\\pi$。"},{"id":179,"ch":7,"chName":"二重积分","sec":"基础填空","q":"设 $D$ 是由直线 $y=1$，$x=2$ 及 $y=x$ 围成的闭区域，则 $\\iint_{D}x^{2}y\\,dxdy=$ \\_\\_\\_\\_.","a":"$\\frac{29}{15}$","s":"化为 $\\int_1^2\\mathrm{d}x\\int_1^x x^2y\\mathrm{d}y=\\int_1^2(\\frac12x^4-\\frac12x^2)\\mathrm{d}x=\\frac{29}{15}$。"},{"id":180,"ch":7,"chName":"二重积分","sec":"基础填空","q":"设 $D$ 是由 $|x|\\leqslant1$，$|y|\\leqslant1$ 围成的闭区域，则 $\\iint_{D}(x^{2}+xy^{3})\\,dxdy=$ \\_\\_\\_\\_.","a":"$\\frac{4}{3}$","s":"$xy^3$ 项积分为 0，余 $\\int_{-1}^1 2x^2\\mathrm{d}x=\\frac43$。"},{"id":181,"ch":7,"chName":"二重积分","sec":"基础填空","q":"设 $D$ 是由圆周 $x^{2}+y^{2}=4$ 围成的闭区域，则 $\\iint_{D}e^{x^{2}+y^{2}}\\,dxdy=$ \\_\\_\\_\\_.","a":"$\\pi(\\mathrm{e}^{4}-1)$","s":"极坐标：$\\int_0^{2\\pi}\\mathrm{d}\\theta\\int_0^2 r\\mathrm{e}^{r^2}\\mathrm{d}r=\\pi\\mathrm{e}^{r^2}\\big|_0^2$。"},{"id":182,"ch":7,"chName":"二重积分","sec":"基础填空","q":"交换积分次序：$\\int_{0}^{\\ln2}dx\\int_{e^{x}}^{2}f(x,y)dy=$ \\_\\_\\_\\_.","a":"$\\int_{1}^{2}dy\\int_{0}^{\\ln y}f(x,y)dx$","s":"由 $\\mathrm{e}^x\\le y\\le2$ 反解区域：$1\\le y\\le2$，$0\\le x\\le\\ln y$。"},{"id":183,"ch":7,"chName":"二重积分","sec":"基础填空","q":"交换积分次序：$\\int_{0}^{1}dy\\int_{\\sqrt{y}}^{1}\\frac{y^{3}}{1+x^{2}}dx=$ \\_\\_\\_\\_.","a":"$\\int_{0}^{1}dx\\int_{0}^{x^{2}}\\frac{y^{3}}{1+x^{2}}dy$","s":"$\\sqrt{y}\\le x\\le1$，$0\\le y\\le1$ 反解为 $0\\le x\\le1$，$0\\le y\\le x^2$。"},{"id":184,"ch":8,"chName":"曲线积分","sec":"基础填空","q":"设 $L$ 为 $y=x^{2}$ 从点 $O(0,0)$ 到点 $A(1,1)$ 的一段弧，则 $\\int_{L}xy^{2}dx+2x^{3}dy=$ \\_\\_\\_\\_.","a":"$\\frac{29}{30}$","s":"化为对 $x$ 的积分：$\\int_0^1(x^5+4x^3)\\mathrm{d}x=\\frac{29}{30}$。"},{"id":185,"ch":8,"chName":"曲线积分","sec":"基础填空","q":"设 $L$ 是抛物线 $y=x^{3}$ 从点 $O(0,0)$ 到点 $A(2,8)$ 的一段弧，则曲线积分 $\\int_{L}(x^{2}-y)dx=$ \\_\\_\\_\\_.","a":"$-\\frac{4}{3}$","s":"代入 $y=x^3$：$\\int_0^2(x^2-x^3)\\mathrm{d}x=-\\frac43$。"},{"id":186,"ch":8,"chName":"曲线积分","sec":"基础填空","q":"设 $L$ 为正向圆周 $x^{2}+y^{2}=1$，则 $\\oint_{L}(xy^{2}+1)dy-(x^{2}y+1)dx=$ \\_\\_\\_\\_.","a":"$\\frac{\\pi}{2}$","s":"格林公式：$Q_x=y^2$，$P_y=-x^2$，原式 $=\\iint_D(x^2+y^2)\\mathrm{d}\\sigma=\\frac{\\pi}{2}$。"},{"id":187,"ch":8,"chName":"曲线积分","sec":"基础填空","q":"曲线积分 $\\int_{(1,2)}^{(2,3)}(3x^{2}+2y)dx+(2x-\\sin y)dy$ 与积分路径\\_\\_\\_\\_（有关、无关）。","a":"无关","s":"$P_y=2$，$Q_x=2$，两者相等，故与路径无关。"},{"id":188,"ch":8,"chName":"曲线积分","sec":"基础填空","q":"设曲线积分 $\\int_{(1,1)}^{(2,3)}(3xy^{2}-2y^{3})dx+(ax^{2}y-6xy^{2})dy$ 与积分路径无关，则 $a=$ \\_\\_\\_\\_.","a":"$a=3$","s":"$P_y=6xy-6y^2$，$Q_x=2axy-6y^2$，令相等得 $2a=6$，$a=3$。"},{"id":189,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}\\frac{(-1)^{n}}{n^{2}}$ 的前三项为 \\_\\_\\_\\_.","a":"$-1$；$\\frac{1}{4}$；$-\\frac{1}{9}$","s":"依次代入 $n=1,2,3$。"},{"id":190,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"$\\sum\\limits_{n=1}^{\\infty}\\frac{1}{n(n+1)}=$ \\_\\_\\_\\_.","a":"$1$","s":"裂项 $\\frac{1}{n}-\\frac{1}{n+1}$，$S_n=1-\\frac{1}{n+1}\\to1$。"},{"id":191,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"判断：若 $\\lim\\limits_{n\\to\\infty}u_{n}=0$，则 $\\sum\\limits_{n=1}^{\\infty}u_{n}$ 收敛\\_\\_\\_\\_（对、错）。","a":"错","s":"反例：$u_n=\\frac1n$，通项趋于 0 但调和级数发散。"},{"id":192,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}\\frac{n^{2}}{n^{2}+1}$ 的敛散性为 \\_\\_\\_\\_.","a":"发散","s":"通项趋于 1 而非 0，故发散。"},{"id":193,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}\\left(1+\\frac{1}{n}\\right)^{2n}$ 的敛散性为 \\_\\_\\_\\_.","a":"发散","s":"通项趋于 $\\mathrm{e}^2\\ne0$，故发散。"},{"id":194,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"$\\sum\\limits_{n=2}^{\\infty}\\frac{2^{n}}{3^{n}}$ 的敛散性为：\\_\\_\\_\\_，其和为：\\_\\_\\_\\_.","a":"收敛；$\\frac{4}{3}$","s":"等比级数，$q=\\frac23$，首项 $\\frac49$，和 $=\\frac{4/9}{1-2/3}=\\frac43$。"},{"id":195,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}\\left(\\frac{1}{\\sqrt[3]{n^{5}}}+\\frac{1}{2^{n}}\\right)$ 的敛散性为 \\_\\_\\_\\_.","a":"发散","s":"$\\sum\\frac{1}{n^{5/3}}$ 收敛、$\\sum\\frac{1}{2^n}$ 收敛，其和应收敛。注：原书答案栏及解析均判为发散且解析文字前后矛盾，此处按原书答案收录，存疑待核。"},{"id":196,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"设 $\\sum\\limits_{n=1}^{\\infty}\\frac{1}{2^{n}}=\\lim\\limits_{x\\to0}\\frac{\\sin ax}{\\ln(1+2x)}$，则 $a=$ \\_\\_\\_\\_.","a":"$a=2$","s":"左边 $=1$，右边 $=\\lim\\frac{ax}{2x}=\\frac a2$，故 $a=2$。"},{"id":197,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}\\frac{n+1}{1+n^{2}}$ 的敛散性为 \\_\\_\\_\\_.","a":"发散","s":"与 $\\sum\\frac1n$ 极限比值为 1，同发散。"},{"id":198,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}\\sin\\frac{1}{2^{n}}$ 的敛散性为 \\_\\_\\_\\_.","a":"收敛","s":"与 $\\sum\\frac{1}{2^n}$ 同敛散，收敛。"},{"id":199,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}\\frac{2^{n}}{n!}$ 的敛散性为 \\_\\_\\_\\_.","a":"收敛","s":"比值法：$\\lim\\frac{u_{n+1}}{u_n}=\\lim\\frac{2}{n+1}=0<1$。"},{"id":200,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}\\left(\\frac{n}{2n+1}\\right)^{n}$ 的敛散性为 \\_\\_\\_\\_.","a":"收敛","s":"根值法：$\\lim\\sqrt[n]{u_n}=\\frac12<1$。"},{"id":201,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}3^{n}\\tan\\frac{1}{4^{n}}$ 的敛散性为 \\_\\_\\_\\_.","a":"收敛","s":"与 $\\sum(\\frac34)^n$ 等价（$\\tan u\\sim u$），收敛。"},{"id":202,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $3+\\frac{3^{2}\\cdot2!}{2^{2}}+\\frac{3^{3}\\cdot3!}{3^{3}}+\\cdots+\\frac{3^{n}\\cdot n!}{n^{n}}+\\cdots$ 的敛散性为 \\_\\_\\_\\_.","a":"发散","s":"比值法极限 $=\\frac3{\\mathrm{e}}>1$，发散。"},{"id":203,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}\\frac{(-1)^{n}+1}{n}$ 的敛散性为 \\_\\_\\_\\_.","a":"发散","s":"拆为 $\\sum\\frac{(-1)^n}{n}+\\sum\\frac1n$，前者收敛后者发散，故发散。"},{"id":204,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{\\ln(1+2n)}$ 的敛散性为 \\_\\_\\_\\_.","a":"收敛","s":"莱布尼茨准则：$u_n$ 单调递减且趋于 0。"},{"id":205,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}(-1)^{n-1}\\frac{1}{\\sqrt{n}}$ \\_\\_\\_\\_（绝对收敛、条件收敛）。","a":"条件收敛","s":"取绝对值后 $\\sum\\frac{1}{\\sqrt n}$ 发散，原级数由莱布尼茨准则收敛。"},{"id":206,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"级数 $\\sum\\limits_{n=1}^{\\infty}(-1)^{n}\\frac{1}{n\\sqrt{n}}$ \\_\\_\\_\\_（绝对收敛、条件收敛）。","a":"绝对收敛","s":"绝对值级数为 $\\sum\\frac{1}{n^{3/2}}$，收敛。"},{"id":207,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"$\\sum\\limits_{n=1}^{\\infty}\\frac{x^{n}}{n!}$ 的收敛区间为：\\_\\_\\_\\_.","a":"$(-\\infty,+\\infty)$","s":"$\\lim|\\frac{u_{n+1}}{u_n}|=0$，$R=+\\infty$。"},{"id":208,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"$\\sum\\limits_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{2n+1}x^{n}$ 的收敛半径为 \\_\\_\\_\\_，收敛域为：\\_\\_\\_\\_.","a":"$1$；$(-1,1]$","s":"$R=1$；$x=1$ 时交错级数收敛，$x=-1$ 时 $\\sum\\frac{1}{2n+1}$ 发散。"},{"id":209,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"$\\sum\\limits_{n=1}^{\\infty}\\frac{2^{n}}{n+2}x^{2n}$ 的收敛域为：\\_\\_\\_\\_.","a":"$\\left(-\\frac{\\sqrt{2}}{2},\\frac{\\sqrt{2}}{2}\\right)$","s":"由比值法得 $x^2$ 级数收敛半径对应 $|x|<\\frac{\\sqrt2}{2}$；端点处化为 $\\sum\\frac{1}{n+2}$ 发散。"},{"id":210,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"设 $\\sum\\limits_{n=1}^{\\infty}a_{n}(x-1)^{n}$ 的收敛半径为 2，则 $\\sum\\limits_{n=1}^{\\infty}a_{n}(x+1)^{n}$ 的收敛区间为：\\_\\_\\_\\_.","a":"$(-3,1)$","s":"收敛半径不变仍为 2，中心为 $-1$，故 $-3<x<1$。"},{"id":211,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"若 $\\sum\\limits_{n=1}^{\\infty}a_{n}x^{n}$ 在 $x=1$ 处条件收敛，则 $\\sum\\limits_{n=1}^{\\infty}a_{n}(x+2)^{n}$ 的收敛区间为：\\_\\_\\_\\_.","a":"$(-3,-1)$","s":"在 $x=1$ 条件收敛说明 $R=1$；新级数中心 $-2$，故区间为 $(-3,-1)$。注：原书答案栏印作集合 $\\{-3,-1\\}$，按解析收录为开区间。"},{"id":212,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"当 $x=2$ 时，$\\sum\\limits_{n=1}^{\\infty}\\frac{(x-1)^{n}}{2^{n}\\cdot n}$ \\_\\_\\_\\_（收敛、发散）。","a":"收敛","s":"代入 $x=2$ 得 $\\sum\\frac{1}{2^nn}$，比值法极限 $\\frac12<1$，收敛。"},{"id":213,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"$\\sum\\limits_{n=1}^{\\infty}\\frac{x^{n}}{n!}$ 的和函数为：\\_\\_\\_\\_；$\\sum\\limits_{n=1}^{\\infty}\\frac{1}{2^{n}n!}$ 的和为：\\_\\_\\_\\_.","a":"$\\mathrm{e}^{x}-1,\\ x\\in(-\\infty,+\\infty)$；$\\mathrm{e}^{\\frac{1}{2}}-1$","s":"利用 $\\sum_{n=0}^\\infty\\frac{x^n}{n!}=\\mathrm{e}^x$，减去首项 1；再令 $x=\\frac12$。"},{"id":214,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"$\\sum\\limits_{n=1}^{\\infty}nx^{n}$ 在 $(-1,1)$ 内的和函数为：\\_\\_\\_\\_.","a":"$\\frac{x}{(1-x)^{2}}$","s":"$x(\\sum x^n)'=x(\\frac{x}{1-x})'=\\frac{x}{(1-x)^2}$。"},{"id":215,"ch":9,"chName":"无穷级数","sec":"基础填空","q":"$f(x)=\\frac{1}{5-x}$ 展开为 $x$ 的幂级数：\\_\\_\\_\\_.","a":"$\\sum\\limits_{n=0}^{\\infty}\\left(\\frac{1}{5}\\right)^{n+1}x^{n},\\ x\\in(-5,5)$","s":"$\\frac15\\cdot\\frac{1}{1-x/5}=\\frac15\\sum(\\frac x5)^n$，收敛域 $|x|<5$。"},{"id":216,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$y=\\sqrt{4-x^{2}}+\\ln(\\mathrm{e}^{x}-1)$ 的定义域为（ ） A. $[-2,2]$  B. $(0,2]$  C. $[0,2)$  D. $(-2,2)$","a":"B","s":"由 $4-x^{2}\\ge0$ 且 $\\mathrm{e}^{x}-1>0$，得 $-2\\le x\\le2$ 且 $x>0$，故定义域为 $(0,2]$。"},{"id":217,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"下列函数相同的是（ ） A. $f(x)=x$；$g(x)=\\sqrt{x^{2}}$  B. $f(x)=(\\sqrt{x})^{2}$；$g(x)=x$  C. $f(x)=\\mathrm{e}^{\\ln x}$；$g(x)=x$  D. $f(x)=\\sqrt[3]{x^{3}}$；$g(x)=x$","a":"D","s":"A 中 $g(x)=|x|$ 与 $f$ 对应法则不同；B、C 中 $f$ 的定义域为 $(0,+\\infty)$，与 $g$ 的定义域 $\\mathbf{R}$ 不同；D 中 $\\sqrt[3]{x^3}=x$ 且定义域均为 $\\mathbf{R}$。"},{"id":218,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"下列函数相同的是（ ） A. $f(x)=1$；$g(x)=\\frac{x}{x}$  B. $f(x)=1$；$g(x)=\\sin^{2}x+\\cos^{2}x$  C. $f(x)=x$；$g(x)=\\mathrm{e}^{\\ln x}$  D. $f(x)=\\mathrm{e}^{\\ln x}$；$g(x)=\\ln \\mathrm{e}^{x}$","a":"B","s":"A 中 $g$ 的定义域 $x\\ne0$；C 中 $g$ 的定义域 $(0,+\\infty)$；D 中 $f$ 定义域 $(0,+\\infty)$、$g$ 定义域 $\\mathbf{R}$；B 中两函数定义域均为 $\\mathbf{R}$ 且恒等。"},{"id":219,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"下列计算中，正确的是（ ） A. $\\arcsin\\frac{1}{2}=\\frac{\\pi}{3}$  B. $\\arccos\\frac{\\sqrt{3}}{2}=\\frac{\\pi}{3}$  C. $\\arctan 1=\\frac{\\pi}{4}$  D. $\\arcsin 1=0$","a":"C","s":"$\\arcsin\\frac12=\\frac{\\pi}{6}$，$\\arccos\\frac{\\sqrt3}{2}=\\frac{\\pi}{6}$，$\\arcsin1=\\frac{\\pi}{2}$，仅 C 正确。"},{"id":220,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"下列说法中，正确的是（ ） A. $\\operatorname{sgn}2=2$  B. $y=[x]$ 是周期函数  C. $y=x-[x]$ 是周期函数  D. $y=x-[x]$ 是无界函数","a":"C","s":"$y(x+1)=x+1-[x+1]=x-[x]=y$，故 $T=1$ 为周期，最小正周期为 1；取整函数不周期且有界。"},{"id":221,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"下列为奇函数的是（ ） A. $y=x^{2}(1-x^{2})$  B. $y=3x^{2}-x^{3}$  C. $y=\\frac{x^{2}\\cos x}{\\sin x}|x|$  D. $y=\\frac{x^{2}}{1+\\cos x}$","a":"C","s":"$x^{2}$、$\\cos x$、$|x|$ 为偶函数，$\\sin x$ 为奇函数，偶×偶×偶÷奇＝奇，故 C 为奇函数。"},{"id":222,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"下列为偶函数的是（ ） A. $f(x)+f(-x)$  B. $f(x)-f(-x)$  C. $\\sin(\\cot x)$  D. $\\tan(\\sin x)$","a":"A","s":"令 $y=f(x)+f(-x)$，则 $y(-x)=f(-x)+f(x)=y$，为偶函数；B、C、D 均为奇函数。"},{"id":223,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"设 $f(x)$ 在 $x=x_{0}$ 处有极限，则下列说法正确的是（ ） A. $f(x)$ 在 $x=x_{0}$ 连续  B. $f(x)$ 在 $x=x_{0}$ 有定义  C. $f(x)$ 在 $x=x_{0}$ 无定义  D. 无法判断 $f(x)$ 在 $x=x_{0}$ 处是否有定义","a":"D","s":"函数在某点的极限与函数在该点是否有定义、取何值无关。"},{"id":224,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"函数 $f(x)=\\begin{cases}2x^{3}-1,&0<x<1,\\ 2-x^{3},&1<x\\leqslant3\\end{cases}$ 在（ ）时极限为 1 A. $x\\to\\frac{3}{2}$  B. $x\\to1$  C. $x\\to2$  D. $x\\to\\frac{1}{2}$","a":"B","s":"$\\lim_{x\\to1^-}(2x^3-1)=1$，$\\lim_{x\\to1^+}(2-x^3)=1$，故 $x\\to1$ 时极限为 1。"},{"id":225,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$\\lim_{x\\to0}\\arctan\\frac{1}{x}=$（ ） A. $\\frac{\\pi}{2}$  B. $-\\frac{\\pi}{2}$  C. $\\frac{\\pi}{2}$ 或 $-\\frac{\\pi}{2}$  D. 不存在","a":"D","s":"右极限为 $\\frac{\\pi}{2}$、左极限为 $-\\frac{\\pi}{2}$，左右不等，故极限不存在。"},{"id":226,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$\\lim_{x\\to1}\\mathrm{e}^{\\frac{1}{1-x}}=$（ ） A. $0$  B. $+\\infty$  C. 不存在  D. 无法判断","a":"C","s":"$x\\to1^+$ 时趋于 0，$x\\to1^-$ 时趋于 $+\\infty$，左右极限不等，极限不存在。"},{"id":227,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$x\\to1$ 时，下列为无穷小量的是（ ） A. $x^{2}-2$  B. $\\ln x$  C. $\\frac{2}{1+x}$  D. $x\\cos x$","a":"B","s":"$\\lim_{x\\to1}\\ln x=\\ln1=0$，故 $\\ln x$ 为无穷小量。"},{"id":228,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"下列说法正确的是（ ） A. $0.00001$ 是无穷小量  B. $-\\infty$ 是无穷小量  C. $f(x)$ 为无穷大量，则 $\\frac{1}{f(x)}$ 为无穷小量  D. $f(x)$ 为无穷小量，则 $\\frac{1}{f(x)}$ 为无穷大量","a":"C","s":"无穷小量以 0 为极限，任何非零常数都不是无穷小量，0 是唯一作为常数的无穷小量；D 中若 $f(x)\\equiv0$ 则 $\\frac{1}{f(x)}$ 无意义。"},{"id":229,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"下列计算中，不正确的是（ ） A. $\\lim_{x\\to0}x\\sin\\frac{1}{x}=0$  B. $\\lim_{x\\to\\infty}\\frac{1}{x}\\sin x=0$  C. $\\lim_{x\\to0}\\left(x\\sin\\frac{1}{x}+\\frac{1}{x}\\sin x\\right)=0$  D. $\\lim_{x\\to\\infty}\\left(\\frac{1}{x}\\sin x+x\\sin\\frac{1}{x}\\right)=1$","a":"C","s":"原式 $=0+1=1$，故 C 不正确。"},{"id":230,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"极限 $\\lim_{x\\to\\infty}\\frac{\\arctan x}{x}=$（ ） A. $1$  B. $0$  C. $2$  D. 不存在","a":"B","s":"$\\arctan x$ 有界（$|\\arctan x|\\le\\frac{\\pi}{2}$），乘无穷小 $\\frac1x$ 得 0。"},{"id":231,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"极限 $\\lim_{x\\to1}\\arctan\\frac{2x+1}{3}=$（ ） A. $0$  B. $1$  C. $2$  D. $\\frac{\\pi}{4}$","a":"D","s":"$\\lim_{x\\to1}\\frac{2x+1}{3}=1$，故原式 $=\\arctan1=\\frac{\\pi}{4}$。"},{"id":232,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"极限 $\\lim_{n\\to\\infty}\\frac{n+1}{n^{2}-2n+1}=$（ ） A. $0$  B. $\\infty$  C. $1$  D. 不存在","a":"A","s":"分子次数低于分母，极限为 0。"},{"id":233,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$\\lim_{x\\to0}\\left[(1+x)^{x}+(1+x)^{\\frac{1}{x}}\\right]=$（ ） A. $1+\\mathrm{e}$  B. $\\mathrm{e}$  C. $1$  D. $2\\mathrm{e}$","a":"A","s":"$\\lim(1+x)^x=1$，$\\lim(1+x)^{1/x}=\\mathrm{e}$，故和为 $1+\\mathrm{e}$。"},{"id":234,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$\\lim_{x\\to\\infty}\\left(\\frac{2x+1}{2x-1}\\right)^{x}=$（ ） A. $0$  B. $\\mathrm{e}$  C. $\\mathrm{e}^{-1}$  D. $\\mathrm{e}^{2}$","a":"B","s":"化为 $\\lim\\left(1+\\frac{2}{2x-1}\\right)^x=\\mathrm{e}^{\\lim\\frac{2x}{2x-1}}=\\mathrm{e}$。"},{"id":235,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"下列计算中，错误的是（ ） A. $\\lim_{x\\to0}\\frac{\\sin^{2}x}{(1+\\cos x)x^{2}}=\\frac{1}{2}$  B. $\\lim_{x\\to0}\\frac{x-\\sin x}{x^{3}}=\\frac{1}{6}$  C. $\\lim_{x\\to0}\\frac{\\cos x-1}{x\\tan x}=-\\frac{1}{2}$  D. $\\lim_{x\\to0}\\frac{\\arcsin 2x^{2}}{x-\\sin x}=0$","a":"D","s":"D 中分子 $\\sim2x^2$、分母 $\\sim\\frac16x^3$，极限为 $\\infty$，故 D 错误。"},{"id":236,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"当 $x\\to0$ 时，下列无穷小量中，最高阶的是（ ） A. $x\\sin x^{2}$  B. $2x\\arctan^{2}x$  C. $x(x-\\sin x)$  D. $1-\\cos2x$","a":"C","s":"A $\\sim x^3$，B $\\sim2x^3$，C $\\sim\\frac16x^4$，D $\\sim2x^2$，阶数最高为 4 阶的 C。"},{"id":237,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$x\\to0$ 时，下列与 $x^{2}$ 为同阶无穷小的是（ ） A. $\\sqrt{1+2x}-1$  B. $\\cos x-1$  C. $x\\tan x^{2}$  D. $x^{3}+x^{2}\\sin x$","a":"B","s":"$\\cos x-1\\sim-\\frac12x^2$，为二阶无穷小。"},{"id":238,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"当 $x\\to0$ 时，$x\\sin ax^{2}$ 和 $\\sqrt{1-x^{3}}-1$ 是等价无穷小，则 $a=$（ ） A. $0$  B. $1$  C. $\\frac{1}{2}$  D. $-\\frac{1}{2}$","a":"D","s":"比值极限 $=\\frac{ax^3}{-\\frac12x^3}=-2a=1$，得 $a=-\\frac12$。"},{"id":239,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$x\\to0$ 时，下列选项中为 $x^{2}$ 的高阶无穷小的是（ ） A. $x^{2}+x^{4}$  B. $x-\\sin x$  C. $\\ln(1+2x)$  D. $x$","a":"B","s":"$x-\\sin x\\sim\\frac16x^3$，为三阶，高于二阶。"},{"id":240,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$x\\to0$ 时，$\\mathrm{e}^{x}-1-x$ 是 $x$ 的 $k$ 阶无穷小，则 $k=$（ ） A. $1$  B. $2$  C. $3$  D. $4$","a":"B","s":"$\\mathrm{e}^x=1+x+\\frac{x^2}{2}+o(x^2)$，故 $\\mathrm{e}^x-1-x\\sim\\frac{x^2}{2}$，$k=2$。"},{"id":241,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$x\\to0$ 时，$x\\sin x^{n+1}$ 是 $1-\\cos x^{2}$ 的低阶无穷小，是 $x\\sin2x$ 的高阶无穷小，则整数 $n=$（ ） A. $1$  B. $2$  C. $3$  D. $4$","a":"A","s":"$x\\sin x^{n+1}\\sim x^{n+2}$，$1-\\cos x^2\\sim\\frac12x^4$，$x\\sin2x\\sim2x^2$，由 $2<n+2<4$ 得 $n=1$。"},{"id":242,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"函数 $f(x)=\\frac{\\sqrt{x}}{(x-1)(x+2)}$ 的间断点个数为（ ） A. $1$  B. $2$  C. $3$  D. $4$","a":"A","s":"定义域为 $(0,1)\\cup(1,+\\infty)$，故只有 $x=1$ 为间断点。"},{"id":243,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$f(x)=\\frac{1}{x(x-3)(x+5)}$ 的连续区间为（ ） A. $(-8,0)$  B. $(-4,-1)$  C. $(1,4)$  D. $(-1,3)$","a":"B","s":"初等函数在定义域内连续；$x=0,3,-5$ 为间断点，$(-4,-1)$ 内不含间断点。"},{"id":244,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"已知函数 $f(x)=\\begin{cases}\\frac{\\mathrm{e}^{x}-1}{x},&x\\ne0,\\ 0,&x=0,\\end{cases}$ 则 $x=0$ 是 $f(x)$ 的（ ） A. 跳跃间断点  B. 无穷间断点  C. 可去间断点  D. 连续点","a":"C","s":"$\\lim_{x\\to0}\\frac{\\mathrm{e}^x-1}{x}=1\\ne f(0)=0$，极限存在但不等于函数值，为可去间断点。"},{"id":245,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"设 $f(x)=\\begin{cases}(1-ax)^{\\frac{1}{\\sin x}},&x\\ne0,\\ \\mathrm{e},&x=0\\end{cases}$ 在 $x=0$ 处连续，则 $a=$（ ） A. $1$  B. $-1$  C. $2$  D. $-2$","a":"B","s":"$\\lim_{x\\to0}f(x)=\\mathrm{e}^{-a}$，由 $\\mathrm{e}^{-a}=\\mathrm{e}$ 得 $a=-1$。"},{"id":246,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"$x=0$ 为 $f(x)=\\begin{cases}\\sin x,&x<0,\\ 0,&x=0,\\ \\frac{1}{\\mathrm{e}^{x}},&x>0\\end{cases}$ 的（ ）间断点 A. 跳跃  B. 无穷  C. 可去  D. 震荡","a":"B","s":"左极限为 0，$x\\to0^+$ 时 $\\mathrm{e}^{1/x}\\to+\\infty$，故为无穷间断点。"},{"id":247,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"若 $f(x)=\\begin{cases}x\\sin\\frac{1}{x},&x\\ne0,\\ a+1,&x=0\\end{cases}$ 在 $x=0$ 处连续，则 $a=$（ ） A. $0$  B. $1$  C. $-1$  D. $2$","a":"C","s":"$\\lim_{x\\to0}x\\sin\\frac1x=0$，由 $a+1=0$ 得 $a=-1$。"},{"id":248,"ch":1,"chName":"函数极限连续","sec":"选择题","q":"下列说法正确的是（ ） A. 若 $f(x)$ 在 $x_{0}$ 处连续，则 $\\lim_{x\\to x_{0}}f(x)$ 存在  B. 若 $\\lim_{x\\to x_{0}}f(x)$ 存在，则 $f(x)$ 在 $x_{0}$ 处连续  C. 若 $x_{0}$ 为 $f(x)$ 的跳跃间断点，则 $\\lim_{x\\to x_{0}}f(x)$ 存在  D. 若 $\\lim_{x\\to x_{0}}f(x)$ 存在，则 $x_{0}$ 为 $f(x)$ 的可去间断点","a":"A","s":"连续必推出极限存在，反之不成立；跳跃间断点左右极限存在但不相等，故极限不存在。"},{"id":249,"ch":2,"chName":"导数与微分","sec":"选择题","q":"设 $f(x)$ 在 $x=x_{0}$ 处可导，则下列说法错误的是（ ） A. $f(x)$ 在 $x=x_{0}$ 处连续  B. $f(x)$ 在 $x=x_{0}$ 处极限存在  C. $f(x)$ 在 $x=x_{0}$ 处可微  D. $f(x)$ 在 $x=x_{0}$ 处无定义","a":"D","s":"可导必连续、极限存在、可微，且必在该点有定义，故 D 错误。"},{"id":250,"ch":2,"chName":"导数与微分","sec":"选择题","q":"设 $f(x)=\\begin{cases}3x^{2}-1,&x\\leqslant1,\\ x^{3}+2,&x>1\\end{cases}$，则 $f(x)$ 在 $x=1$ 处（ ） A. 左导数存在，右导数不存在  B. 左、右导数均存在  C. 左、右导数均不存在  D. 左导数不存在，右导数存在","a":"A","s":"$f'_-(1)=\\lim_{x\\to1^-}\\frac{3x^2-3}{x-1}=6$；$f'_+(1)=\\lim_{x\\to1^+}\\frac{x^3}{x-1}=\\infty$，故左导数存在、右导数不存在。"},{"id":251,"ch":2,"chName":"导数与微分","sec":"选择题","q":"设 $f'(1)=\\frac{1}{2}$，则 $\\lim_{\\Delta x\\to0}\\frac{f(1-2\\Delta x)-f(1)}{\\Delta x}=$（ ） A. $1$  B. $-1$  C. $2$  D. $-2$","a":"B","s":"原式 $=-2\\lim\\frac{f(1-2\\Delta x)-f(1)}{-2\\Delta x}=-2f'(1)=-1$。"},{"id":252,"ch":2,"chName":"导数与微分","sec":"选择题","q":"设 $f(x)$ 在 $x=a$ 处可导，则 $\\lim_{\\Delta x\\to0}\\frac{f(a+\\Delta x)-f(a-\\Delta x)}{\\Delta x}=$（ ） A. $2f'(a)$  B. $f'(a)$  C. $0$  D. $f'(2a)$","a":"A","s":"拆成两个增量比之和：$f'(a)+f'(a)=2f'(a)$。"},{"id":253,"ch":2,"chName":"导数与微分","sec":"选择题","q":"设 $f(x)=\\begin{cases}x^{2}\\cos\\frac{1}{x},&x\\ne0,\\ 0,&x=0\\end{cases}$，则 $f(x)$ 在 $x=0$ 处（ ） A. 不连续  B. 连续但不可导  C. 可导且 $f'(0)=1$  D. 可导且 $f'(0)=0$","a":"D","s":"$\\lim_{x\\to0}x^2\\cos\\frac1x=0=f(0)$，连续；又 $\\lim_{x\\to0}\\frac{x^2\\cos(1/x)}{x}=\\lim x\\cos\\frac1x=0$，故 $f'(0)=0$。"},{"id":254,"ch":2,"chName":"导数与微分","sec":"选择题","q":"下列计算中正确的是（ ） A. $(x^{x})'=x\\cdot x^{x-1}$  B. $(\\cos \\mathrm{e})'=-\\sin \\mathrm{e}$  C. $(\\ln\\sin x)'=\\tan x$  D. $(\\ln\\cos x)'=-\\tan x$","a":"D","s":"$(x^x)'=(\\mathrm{e}^{x\\ln x})'=\\mathrm{e}^{x\\ln x}(\\ln x+1)$；$\\cos\\mathrm{e}$ 为常数导数为 0；$(\\ln\\sin x)'=\\cot x$；D 正确。"},{"id":255,"ch":2,"chName":"导数与微分","sec":"选择题","q":"已知 $f(x)=\\begin{cases}x^{3},&x<0,\\ 2x,&x\\geqslant0\\end{cases}$，以下错误的是（ ） A. $f'_{+}(0)=2$  B. $f'_{-}(0)=0$  C. $f'(x)=\\begin{cases}3x^{2},&x<0,\\ 2,&x\\geqslant0\\end{cases}$  D. $f'(0)$ 不存在","a":"C","s":"$f'_+(0)=2$、$f'_-(0)=0$，左右导数不等故 $f'(0)$ 不存在，C 在 $x=0$ 处写 $f'=2$ 有误。"},{"id":256,"ch":2,"chName":"导数与微分","sec":"选择题","q":"设 $\\varphi(x)=\\int_{0}^{x^{2}}\\sin t\\,dt$，则 $\\varphi'(x)=$（ ） A. $\\sin x^{2}$  B. $\\sin^{2}x$  C. $2x\\sin x^{2}$  D. $x^{2}\\sin x$","a":"C","s":"变限积分求导并乘内层导数：$\\varphi'(x)=\\sin x^2\\cdot2x$。"},{"id":257,"ch":2,"chName":"导数与微分","sec":"选择题","q":"设 $f(x)=x(x+1)(x+2)\\cdots(x+100)$，则 $f'(0)=$（ ） A. $100$  B. $100!$  C. $99!$  D. $0$","a":"B","s":"$f'(0)=\\lim_{x\\to0}\\frac{f(x)-f(0)}{x}=\\lim_{x\\to0}(x+1)(x+2)\\cdots(x+100)=100!$。"},{"id":258,"ch":2,"chName":"导数与微分","sec":"选择题","q":"已知 $y=xf(x^{2})$，则 $dy=$（ ） A. $2x^{2}f(x^{2})$  B. $f(x^{2})+2x^{2}f'(x^{2})$  C. $2x^{2}f(x^{2})dx$  D. $[f(x^{2})+2x^{2}f'(x^{2})]dx$","a":"D","s":"$y'=f(x^2)+x\\cdot f'(x^2)\\cdot2x$，故 $\\mathrm{d}y=[f(x^2)+2x^2f'(x^2)]\\mathrm{d}x$。"},{"id":259,"ch":2,"chName":"导数与微分","sec":"选择题","q":"设 $f(0)=0$ 且 $\\lim_{x\\to0}\\frac{f(x)}{x}=A$，则 $f(x)$ 在 $x=0$ 处（ ） A. 极限不存在  B. 极限存在但不连续  C. 连续但不可导  D. 可导且 $f'(0)=A$","a":"D","s":"由极限存在得 $\\lim f(x)=0=f(0)$ 故连续；又该极限即 $f'(0)=A$。"},{"id":260,"ch":2,"chName":"导数与微分","sec":"选择题","q":"若 $f(x)$ 在 $x=x_{0}$ 处取极值，则（ ） A. $f'(x_{0})=0$  B. $f'(x_{0})$ 不存在  C. 无法判断 $f'(x_{0})$ 是否存在  D. $f'(x_{0})\\ne0$","a":"C","s":"极值点只可能出现在驻点或不可导点，题目未说明可导性，故无法判断。"},{"id":261,"ch":2,"chName":"导数与微分","sec":"选择题","q":"若函数 $f(x)$ 二阶可导，则 $f''(x_{0})=0$ 是点 $(x_{0},f(x_{0}))$ 取得拐点的（ ） A. 必要条件  B. 充分条件  C. 充分必要条件  D. 既非充分也非必要条件","a":"A","s":"拐点处若二阶导存在则 $f''(x_0)=0$，反之不成立，故为必要条件。"},{"id":262,"ch":2,"chName":"导数与微分","sec":"选择题","q":"已知 $f(x)=x^{3}+ax^{2}+bx$ 在 $x=1$ 处取得极小值为 $-2$，则有（ ） A. $a=1,\\ b=2$  B. $a=0,\\ b=-3$  C. $a=2,\\ b=2$  D. $a=3,\\ b=0$","a":"B","s":"由 $f(1)=-2$、$f'(1)=0$ 得 $1+a+b=-2$、$3+2a+b=0$，解得 $a=0,b=-3$。"},{"id":263,"ch":2,"chName":"导数与微分","sec":"选择题","q":"下列函数在 $[-1,1]$ 上满足罗尔定理条件的是（ ） A. $y=x^{3}$  B. $y=\\ln|x|$  C. $y=x^{2}$  D. $y=\\frac{1}{\\sin x}$","a":"C","s":"$y=x^2$ 在 $[-1,1]$ 连续、$(-1,1)$ 可导且 $y(-1)=y(1)=1$，满足罗尔定理。"},{"id":264,"ch":3,"chName":"不定积分","sec":"选择题","q":"下列等式中正确的是（ ） A. $\\int f'(x)dx=f(x)$  B. $\\int df(x)=f(x)$  C. $\\frac{d}{dx}\\int f(x)dx=f(x)$  D. $d\\int f(x)=f(x)$","a":"C","s":"A、B 均缺常数 $C$；D 中微分结果应含 $\\mathrm{d}x$；C 正确。"},{"id":265,"ch":3,"chName":"不定积分","sec":"选择题","q":"已知 $f''(x)=x\\mathrm{e}^{-x^{2}}$，且 $f(0)=\\frac{1}{2}$，则 $f(x)$ 等于（ ） A. $\\mathrm{e}^{-x^{2}}+1$  B. $-\\frac{1}{2}\\mathrm{e}^{-x^{2}}+1$  C. $-\\frac{1}{2}\\mathrm{e}^{-x^{2}}$  D. $\\mathrm{e}^{-x^{2}}$","a":"B","s":"$f(x)=\\int x\\mathrm{e}^{-x^2}\\mathrm{d}x=-\\frac12\\mathrm{e}^{-x^2}+C$，由 $f(0)=\\frac12$ 得 $C=1$。"},{"id":266,"ch":3,"chName":"不定积分","sec":"选择题","q":"设函数 $f(x)=x\\mathrm{e}^{x}+1$，则 $\\int f'(x)dx$ 等于（ ） A. $x\\mathrm{e}^{x}+C$  B. $(x+1)\\mathrm{e}^{x}$  C. $(x+1)\\mathrm{e}^{x}+C$  D. $x\\mathrm{e}^{x}$","a":"A","s":"$\\int f'(x)\\mathrm{d}x=f(x)+C_1=x\\mathrm{e}^x+1+C_1=x\\mathrm{e}^x+C$。"},{"id":267,"ch":3,"chName":"不定积分","sec":"选择题","q":"设 $\\int f(x)dx=\\sin 2x+C$，则 $f(x)$ 等于（ ） A. $-\\frac{1}{2}\\cos 2x$  B. $-\\frac{1}{2}\\cos 2x+C$  C. $2\\cos 2x$  D. $2\\cos 2x+C$","a":"C","s":"$f(x)=(\\sin2x+C)'=2\\cos2x$。"},{"id":268,"ch":3,"chName":"不定积分","sec":"选择题","q":"设 $F(x)$ 与 $G(x)$ 都是 $f(x)$ 的一个原函数，则下列选项中正确的是（ ） A. $F(x)-G(x)=0$  B. $F(x)-G(x)=C$（$C$ 为常数）  C. $F(x)+G(x)=0$  D. $F(x)+G(x)=C$（$C$ 为常数）","a":"B","s":"同一函数的任意两个原函数相差一个常数。"},{"id":269,"ch":3,"chName":"不定积分","sec":"选择题","q":"设 $\\int f(x)dx=F(x)+C$，则 $\\int xf(3+x^{2})dx=$（ ） A. $\\frac{1}{2}F(3+x^{2})+C$  B. $F(3+x^{2})+C$  C. $xf(3+x^{2})$  D. $\\frac{1}{2}xf(3+x^{2})$","a":"A","s":"凑微分：$\\frac12\\int f(3+x^2)\\mathrm{d}(3+x^2)=\\frac12F(3+x^2)+C$。"},{"id":270,"ch":3,"chName":"不定积分","sec":"选择题","q":"设 $f(x)=\\mathrm{e}^{-2x}$，则 $\\int\\frac{f'(\\ln x)}{x}dx=$（ ） A. $\\mathrm{e}^{-2x}+C$  B. $\\frac{1}{x^{2}}+C$  C. $\\ln x+C$  D. $\\mathrm{e}^{(\\ln x)^{2}}+C$","a":"B","s":"$\\int f'(\\ln x)\\mathrm{d}(\\ln x)=f(\\ln x)+C=\\mathrm{e}^{-2\\ln x}+C=\\frac{1}{x^2}+C$。"},{"id":271,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"$f(x)$ 连续是定积分 $\\int_{a}^{b}f(x)dx$ 存在的（ ） A. 必要条件  B. 充分条件  C. 充分必要条件  D. 既非充分也非必要条件","a":"B","s":"连续必可积，但可积函数未必连续（可有有限个间断点）。"},{"id":272,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"下列不等式正确的是（ ） A. $\\int_{0}^{1}x^{2}dx>\\int_{0}^{1}x\\,dx$  B. $\\int_{0}^{1}\\mathrm{e}^{x}dx>\\int_{0}^{1}\\mathrm{e}^{x^{2}}dx$  C. $\\int_{0}^{\\frac{\\pi}{2}}\\sin x\\,dx>\\int_{0}^{\\frac{\\pi}{2}}x\\,dx$  D. $\\int_{1}^{2}\\mathrm{e}^{-x}dx<\\int_{2}^{3}\\mathrm{e}^{-x}dx$","a":"B","s":"$0<x<1$ 时 $x>x^2$，故 $\\mathrm{e}^x>\\mathrm{e}^{x^2}$，得 B 成立。"},{"id":273,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"$\\int_{1}^{3}|x-2|dx=$（ ） A. $0$  B. $1$  C. $2$  D. $3$","a":"B","s":"分段：$\\int_1^2(2-x)\\mathrm{d}x+\\int_2^3(x-2)\\mathrm{d}x=\\frac12+\\frac12=1$。"},{"id":274,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"下列积分值为零的是（ ） A. $\\int_{-1}^{1}x^{3}\\sin x\\,dx$  B. $\\int_{-1}^{1}[f(x)+f(-x)]dx$  C. $\\int_{-1}^{1}\\sin(\\tan x)dx$  D. $\\int_{-1}^{1}3dx$","a":"C","s":"$\\sin(\\tan x)$ 为奇函数，在对称区间上积分为 0。"},{"id":275,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"$\\int_{-2}^{2}(x+1)\\sqrt{4-x^{2}}dx=$（ ） A. $2\\pi$  B. $0$  C. $4\\pi$  D. $\\frac{\\pi}{2}$","a":"A","s":"奇函数项 $x\\sqrt{4-x^2}$ 积分为 0，余 $\\int_{-2}^{2}\\sqrt{4-x^2}\\mathrm{d}x=\\frac12\\pi\\cdot2^2=2\\pi$。"},{"id":276,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"$\\int_{-\\frac{\\pi}{2}}^{\\frac{\\pi}{2}}(x+2)\\sin^{2}x\\,dx=$（ ） A. $\\frac{\\pi}{4}$  B. $0$  C. $\\frac{\\pi}{2}$  D. $\\pi$","a":"D","s":"奇函数项积分为 0，余 $2\\int_{-\\pi/2}^{\\pi/2}\\sin^2x\\mathrm{d}x=4\\int_0^{\\pi/2}\\sin^2x\\mathrm{d}x=\\pi$。"},{"id":277,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"$\\int_{-1}^{1}(\\sin x+1)x^{2}dx=$（ ） A. $0$  B. $\\frac{1}{3}$  C. $\\frac{2}{3}$  D. $1$","a":"C","s":"$x^2\\sin x$ 为奇函数积分为 0，余 $\\int_{-1}^{1}x^2\\mathrm{d}x=\\frac23$。"},{"id":278,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"设 $\\lim_{x\\to0}(1-x)^{\\frac{a}{x}}=\\int_{-1}^{1}x\\left(\\sin x^{2}+\\frac{3}{2}x\\right)dx$，则 $a=$（ ） A. $0$  B. $1$  C. $2$  D. $3$","a":"A","s":"左边 $=\\mathrm{e}^{-a}$；右边奇函数项为 0，余 $\\frac32\\int_{-1}^{1}x^2\\mathrm{d}x=1$，由 $\\mathrm{e}^{-a}=1$ 得 $a=0$。"},{"id":279,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"设 $f(x)$ 满足 $f(0)=1$，$f(1)=2$，$f'(1)=5$，且 $f''(x)$ 连续，则 $\\int_{0}^{1}xf''(x)dx=$（ ） A. $2$  B. $3$  C. $4$  D. $5$","a":"C","s":"分部积分：$\\int_0^1xf''(x)\\mathrm{d}x=xf'(x)\\big|_0^1-\\int_0^1f'(x)\\mathrm{d}x=f'(1)-[f(1)-f(0)]=5-1=4$。注：原书该题印刷层叠，二阶导符号不清，按答案与解析收录为 $f''$。"},{"id":280,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"下列积分收敛的是（ ） A. $\\int_{2}^{+\\infty}\\frac{1}{x\\ln x}dx$  B. $\\int_{1}^{+\\infty}\\frac{1}{x^{2}}dx$  C. $\\int_{1}^{+\\infty}\\frac{x}{1+x^{2}}dx$  D. $\\int_{1}^{+\\infty}\\frac{1}{1+x}dx$","a":"B","s":"$\\int_1^{+\\infty}\\frac{1}{x^2}\\mathrm{d}x=1$ 收敛；A、C、D 均发散。"},{"id":281,"ch":4,"chName":"定积分与反常积分","sec":"选择题","q":"$\\int_{0}^{+\\infty}\\mathrm{e}^{-t}dt=$（ ） A. $0$  B. $+\\infty$  C. $1$  D. $-1$","a":"C","s":"原式 $=-\\mathrm{e}^{-t}\\big|_0^{+\\infty}=0-(-1)=1$。"},{"id":282,"ch":5,"chName":"微分方程","sec":"选择题","q":"微分方程 $xy'''+4(y'')^{4}+x^{2}y=0$ 的阶为（ ） A. 一阶  B. 二阶  C. 三阶  D. 四阶","a":"C","s":"微分方程的阶由最高阶导数的阶数决定，本题为 $y'''$ 即三阶。"},{"id":283,"ch":5,"chName":"微分方程","sec":"选择题","q":"微分方程 $\\frac{d^{2}s}{dt^{2}}+\\frac{ds}{dt}+t^{3}=0$ 的阶为（ ） A. 一阶  B. 二阶  C. 三阶  D. 四阶","a":"B","s":"最高阶导数为 $\\frac{\\mathrm{d}^2s}{\\mathrm{d}t^2}$，为二阶。"},{"id":284,"ch":5,"chName":"微分方程","sec":"选择题","q":"$y=x^{2}$ 是微分方程 $xy'=2y$ 的（ ） A. 通解  B. 特解  C. 是解，但既不是通解，也不是特解  D. 不是解","a":"B","s":"$y=x^2$ 时 $y'=2x$，代入 $x\\cdot2x=2x^2$ 成立，且不含任意常数，故为特解。"},{"id":285,"ch":5,"chName":"微分方程","sec":"选择题","q":"微分方程 $y'+y=\\mathrm{e}^{-x}$ 的通解为（ ） A. $y=x\\mathrm{e}^{-x}+C$  B. $y=(x-C)\\mathrm{e}^{-2x}$  C. $y=(x+C)\\mathrm{e}^{x}$  D. $y=(x+C)\\mathrm{e}^{-x}$","a":"D","s":"$y=\\mathrm{e}^{-x}\\left(\\int1\\mathrm{d}x+C\\right)=(x+C)\\mathrm{e}^{-x}$。"},{"id":286,"ch":5,"chName":"微分方程","sec":"选择题","q":"微分方程 $y'=xy$ 的通解为（ ） A. $y=C\\mathrm{e}^{\\frac{1}{2}x^{2}}$  B. $y=C\\mathrm{e}^{x^{2}}$  C. $y=\\mathrm{e}^{\\frac{1}{2}x^{2}}$  D. $y=\\mathrm{e}^{x^{2}}$","a":"A","s":"分离变量 $\\frac{\\mathrm{d}y}{y}=x\\mathrm{d}x$，积分得 $\\ln|y|=\\frac12x^2+C_1$。"},{"id":287,"ch":5,"chName":"微分方程","sec":"选择题","q":"微分方程 $xy'+y-x=0$ 的通解为（ ） A. $y=\\frac{x}{2}+\\frac{C}{x}$  B. $y=2x+\\frac{C}{x}$  C. $y=2x+Cx$  D. $y=\\frac{x}{2}+Cx$","a":"A","s":"化为 $y'+\\frac1xy=1$，$y=\\mathrm{e}^{-\\ln x}\\left(\\int x\\mathrm{d}x+C\\right)=\\frac1x\\left(\\frac{x^2}{2}+C\\right)=\\frac x2+\\frac Cx$。"},{"id":288,"ch":5,"chName":"微分方程","sec":"选择题","q":"微分方程 $y''-2y'+y=0$ 的通解为（ ） A. $y=C_{1}\\mathrm{e}^{x}+C_{2}\\mathrm{e}^{-x}$  B. $y=(C_{1}+C_{2}x)\\mathrm{e}^{x}$  C. $y=(C_{1}+C_{2}x)\\mathrm{e}^{-x}$  D. $y=C_{1}\\mathrm{e}^{2x}+C_{2}\\mathrm{e}^{x}$","a":"B","s":"特征方程 $(r-1)^2=0$，$r_{1}=r_{2}=1$，通解为 $(C_1+C_2x)\\mathrm{e}^x$。"},{"id":289,"ch":5,"chName":"微分方程","sec":"选择题","q":"微分方程 $y''-4y'+5y=0$ 的通解为（ ） A. $y=C_{1}\\mathrm{e}^{x}+C_{2}\\mathrm{e}^{2x}$  B. $y=\\mathrm{e}^{2x}(C_{1}\\cos x+C_{2}\\sin x)$  C. $y=\\mathrm{e}^{-x}(C_{1}\\cos x+C_{2}\\sin x)$  D. $y=\\mathrm{e}^{x}(C_{1}\\cos x+C_{2}\\sin x)$","a":"B","s":"特征根 $r=2\\pm i$，故通解为 $\\mathrm{e}^{2x}(C_1\\cos x+C_2\\sin x)$。"},{"id":290,"ch":5,"chName":"微分方程","sec":"选择题","q":"微分方程 $y''-6y'+9y=x\\mathrm{e}^{3x}$ 的特解可设为（ ） A. $y^{*}=x^{3}(ax+b)\\mathrm{e}^{3x}$  B. $y^{*}=x^{2}(ax+b)\\mathrm{e}^{3x}$  C. $y^{*}=x(ax+b)\\mathrm{e}^{3x}$  D. $y^{*}=(ax+b)\\mathrm{e}^{3x}$","a":"B","s":"特征根 $r=3$ 为二重根，$\\lambda=3$ 且右端为一次多项式，故应设 $x^{2}(ax+b)\\mathrm{e}^{3x}$。"},{"id":291,"ch":5,"chName":"微分方程","sec":"选择题","q":"微分方程 $y''-y'=1$ 的特解可设为（ ） A. $y^{*}=a$  B. $y^{*}=ax^{2}\\mathrm{e}^{2x}$  C. $y^{*}=ax\\mathrm{e}^{x}$  D. $y^{*}=ax$","a":"D","s":"特征根 $r_1=0,r_2=1$，$\\lambda=0$ 为单根，故设 $y^{*}=ax$。"},{"id":292,"ch":6,"chName":"多元函数微分学","sec":"选择题","q":"下列说法中，正确的是（ ） A. 若 $f'_{x}(x_{0},y_{0})$，$f'_{y}(x_{0},y_{0})$ 都存在，则 $f(x,y)$ 在 $(x_{0},y_{0})$ 处可微  B. 若 $f'_{x}(x_{0},y_{0})$，$f'_{y}(x_{0},y_{0})$ 都存在，则 $f(x,y)$ 在 $(x_{0},y_{0})$ 处连续  C. 若 $f(x,y)$ 在 $(x_{0},y_{0})$ 处可微，则 $f(x,y)$ 在 $(x_{0},y_{0})$ 处连续  D. 若 $f(x,y)$ 在 $(x_{0},y_{0})$ 处连续，则 $f'_{x}(x_{0},y_{0})$，$f'_{y}(x_{0},y_{0})$ 都存在","a":"C","s":"可微必连续、必可偏导；但偏导存在既推不出连续也推不出可微，连续也推不出可偏导。"},{"id":293,"ch":6,"chName":"多元函数微分学","sec":"选择题","q":"设 $z=y^{x}+\\ln 2$，则（ ） A. $\\frac{\\partial z}{\\partial x}=xy^{x-1}$  B. $\\frac{\\partial z}{\\partial y}=xy^{x-1}$  C. $\\frac{\\partial z}{\\partial x}=y^{x}\\ln x$  D. $\\frac{\\partial z}{\\partial y}=y^{x}\\ln y$","a":"B","s":"$z_x=y^x\\ln y$，$z_y=xy^{x-1}$。"},{"id":294,"ch":6,"chName":"多元函数微分学","sec":"选择题","q":"设 $z=xy+\\frac{x}{y}$，则 $dz=$（ ） A. $\\left(y-\\frac{1}{y}\\right)dx+\\left(x-\\frac{x}{y^{2}}\\right)dy$  B. $\\left(y+\\frac{1}{y}\\right)dx+\\left(x+\\frac{x}{y^{2}}\\right)dy$  C. $\\left(x-\\frac{x}{y^{2}}\\right)dx+\\left(y-\\frac{1}{y}\\right)dy$  D. $\\left(y+\\frac{1}{y}\\right)dx+\\left(x-\\frac{x}{y^{2}}\\right)dy$","a":"D","s":"$z_x=y+\\frac1y$，$z_y=x-\\frac{x}{y^2}$，代入全微分公式。"},{"id":295,"ch":6,"chName":"多元函数微分学","sec":"选择题","q":"设 $z=z(x,y)$ 由 $z^{3}+3xyz=14$ 确定，则（ ） A. $\\frac{\\partial z}{\\partial x}=\\frac{-yz}{xy+z^{2}}$  B. $\\frac{\\partial z}{\\partial y}=\\frac{xz}{xy+z^{2}}$  C. $\\frac{\\partial z}{\\partial x}=\\frac{yz}{xy+z^{2}}$  D. $\\frac{\\partial z}{\\partial y}=\\frac{-yz}{xy+z^{2}}$","a":"A","s":"$F_x=3yz$，$F_z=3z^2+3xy$，故 $z_x=-\\frac{F_x}{F_z}=-\\frac{yz}{z^2+xy}$。"},{"id":296,"ch":6,"chName":"多元函数微分学","sec":"选择题","q":"设 $z=\\sin u\\cdot\\ln v$，且 $u=x+y$，$v=x-y$，则（ ） A. $\\frac{\\partial z}{\\partial x}=\\cos(x+y)\\ln(x-y)-\\frac{\\sin(x+y)}{x-y}$  B. $\\frac{\\partial z}{\\partial x}=\\cos(x+y)\\ln(x-y)+\\frac{\\sin(x+y)}{x-y}$  C. $\\frac{\\partial z}{\\partial y}=\\cos(x+y)\\ln(x-y)+\\frac{\\sin(x+y)}{x-y}$  D. $\\frac{\\partial z}{\\partial y}=\\cos(x+y)\\ln(x-y)-\\frac{\\cos(x+y)}{x-y}$","a":"B","s":"$z_x=\\cos(x+y)\\ln(x-y)+\\frac{\\sin(x+y)}{x-y}$，$z_y=\\cos(x+y)\\ln(x-y)-\\frac{\\sin(x+y)}{x-y}$。"},{"id":297,"ch":6,"chName":"多元函数微分学","sec":"选择题","q":"设 $z=f(x,x^{2}y)$，且 $f$ 可微，则（ ） A. $\\frac{\\partial z}{\\partial x}=f'_{1}+f'_{2}$  B. $\\frac{\\partial z}{\\partial x}=f'_{1}+x^{2}f'_{2}$  C. $\\frac{\\partial z}{\\partial y}=f'_{1}+x^{2}f'_{2}$  D. $\\frac{\\partial z}{\\partial y}=x^{2}f'_{2}$","a":"D","s":"对 $y$ 求偏导时 $x$ 视为常数，第二个中间变量对 $y$ 的偏导为 $x^2$，故 $z_y=x^2f'_2$。"},{"id":298,"ch":6,"chName":"多元函数微分学","sec":"选择题","q":"设 $f'_{x}(x_{0},y_{0})=0$，$f'_{y}(x_{0},y_{0})=0$，则（ ） A. $f(x,y)$ 在 $(x_{0},y_{0})$ 处取得极值  B. $f(x,y)$ 在 $(x_{0},y_{0})$ 处不一定取得极值  C. $f(x,y)$ 在 $(x_{0},y_{0})$ 处一定不取得极值  D. $f(x,y)$ 在 $(x_{0},y_{0})$ 处连续","a":"B","s":"驻点只是极值的必要条件，是否取极值需进一步判定。"},{"id":299,"ch":7,"chName":"二重积分","sec":"选择题","q":"设 $D$ 由直线 $y=-x+1$，$y=x-1$ 和 $y$ 轴围成，则 $\\iint_{D}(1+x^{2}y)d\\sigma=$（ ） A. $1$  B. $\\frac{1}{2}$  C. $0$  D. $2$","a":"A","s":"区域面积 $S_D=1$；$x^2y$ 关于 $y$ 为奇函数且区域关于 $x$ 轴对称，积分为 0，故结果为 1。"},{"id":300,"ch":7,"chName":"二重积分","sec":"选择题","q":"设区域 $D$ 由直线 $y=x$，$y=x+1$，$y=1$，$y=3$ 围成，则 $\\iint_{D}x\\,d\\sigma=$（ ） A. $2$  B. $3$  C. $4$  D. $6$","a":"C","s":"化为 $\\int_1^3\\mathrm{d}y\\int_{y-1}^{y}x\\,\\mathrm{d}x=\\int_1^3(y-\\frac12)\\mathrm{d}y=4$。"},{"id":301,"ch":7,"chName":"二重积分","sec":"选择题","q":"设区域 $D=\\{(x,y)\\big||x|+|y|\\leqslant1\\}$，则 $\\iint_{D}(x+y^{2})d\\sigma=$（ ） A. $\\frac{1}{12}$  B. $\\frac{1}{3}$  C. $0$  D. $1$","a":"B","s":"$x$ 项为奇函数积分为 0，$y^2$ 项用对称性化为第一象限 $4\\iint_{D_1}y^2\\mathrm{d}\\sigma=\\frac13$。"},{"id":302,"ch":7,"chName":"二重积分","sec":"选择题","q":"设区域 $D=\\{(x,y)\\big|x^{2}+y^{2}\\leqslant1\\}$，则 $\\iint_{D}(x^{2}+y^{2})d\\sigma=$（ ） A. $4$  B. $\\frac{1}{4}$  C. $\\pi$  D. $\\frac{\\pi}{2}$","a":"D","s":"极坐标 $\\int_0^{2\\pi}\\mathrm{d}\\theta\\int_0^1r^3\\mathrm{d}r=2\\pi\\cdot\\frac14=\\frac{\\pi}{2}$。"},{"id":303,"ch":7,"chName":"二重积分","sec":"选择题","q":"交换累次积分次序：$\\int_{0}^{1}dy\\int_{y}^{1}f(x,y)dx=$（ ） A. $\\int_{0}^{1}dx\\int_{x}^{1}f(x,y)dy$  B. $\\int_{0}^{1}dx\\int_{0}^{1}f(x,y)dy$  C. $\\int_{0}^{1}dx\\int_{x}^{0}f(x,y)dy$  D. $\\int_{0}^{1}dx\\int_{0}^{x}f(x,y)dy$","a":"A","s":"区域为 $y\\le x\\le1,0\\le y\\le1$，改写为 $0\\le y\\le x,0\\le x\\le1$。"},{"id":304,"ch":7,"chName":"二重积分","sec":"选择题","q":"交换累次积分次序：$\\int_{0}^{1}dx\\int_{x^{2}}^{1}\\frac{y}{1+x^{2}}dy=$（ ） A. $\\int_{0}^{1}dy\\int_{0}^{y^{2}}\\frac{y}{1+x^{2}}dx$  B. $\\int_{0}^{1}dy\\int_{0}^{y}\\frac{y}{1+x^{2}}dx$  C. $\\int_{0}^{1}dy\\int_{0}^{1}\\frac{y}{1+x^{2}}dx$  D. $\\int_{0}^{1}dy\\int_{0}^{\\sqrt{y}}\\frac{y}{1+x^{2}}dx$","a":"D","s":"区域 $x^2\\le y\\le1,0\\le x\\le1$，改写为 $0\\le x\\le\\sqrt y,0\\le y\\le1$。"},{"id":305,"ch":7,"chName":"二重积分","sec":"选择题","q":"设 $D$ 由 $x^{2}+y^{2}=1$ 围成，则 $\\iint_{D}\\mathrm{e}^{-x^{2}-y^{2}}d\\sigma=$（ ） A. $\\pi$  B. $\\pi(\\mathrm{e}-1)$  C. $\\pi(1-\\mathrm{e}^{-1})$  D. $2\\pi(1-\\mathrm{e}^{-1})$","a":"C","s":"极坐标：$2\\pi\\int_0^1r\\mathrm{e}^{-r^2}\\mathrm{d}r=-\\pi\\mathrm{e}^{-r^2}\\big|_0^1=\\pi(1-\\mathrm{e}^{-1})$。"},{"id":306,"ch":7,"chName":"二重积分","sec":"选择题","q":"设 $D$ 由 $x$ 轴、$y$ 轴和 $x+y=2$ 围成，则 $\\iint_{D}(3x+2y)dxdy=$（ ） A. $\\frac{10}{3}$  B. $\\frac{1}{3}$  C. $\\frac{21}{6}$  D. $\\frac{20}{3}$","a":"D","s":"$\\int_0^2\\mathrm{d}x\\int_0^{2-x}(3x+2y)\\mathrm{d}y=\\int_0^2(-2x^2+2x+4)\\mathrm{d}x=\\frac{20}{3}$。"},{"id":307,"ch":8,"chName":"曲线积分","sec":"选择题","q":"设 $L$ 为 $y^{2}=x$ 上从点 $A(1,-1)$ 到点 $B(1,1)$ 的一段弧，则 $\\int_{L}xy\\,dx=$（ ） A. $\\frac{1}{5}$  B. $\\frac{4}{5}$  C. $\\frac{2}{5}$  D. $\\frac{3}{5}$","a":"B","s":"取 $x=y^2$，$\\mathrm{d}x=2y\\mathrm{d}y$，原式 $=\\int_{-1}^{1}y^2\\cdot y\\cdot2y\\mathrm{d}y=4\\int_0^1y^4\\mathrm{d}y=\\frac45$。"},{"id":308,"ch":8,"chName":"曲线积分","sec":"选择题","q":"设 $L$ 为 $(0,0),(2,0),(2,1)$ 所构成的三角形的正向边界，则 $\\oint_{L}(2x^{2}-y+1)dx+(5y+2x-3)dy=$（ ） A. $3$  B. $4$  C. $5$  D. $6$","a":"A","s":"$P_y=-1$，$Q_x=2$，由格林公式原式 $=\\iint_D3\\mathrm{d}\\sigma=3S_D=3$。"},{"id":309,"ch":8,"chName":"曲线积分","sec":"选择题","q":"设曲线积分 $\\int_{(1,1)}^{(3,4)}(axy^{2}-y^{3})dx+(6x^{2}y-bxy^{2})dy$ 与路径无关，则 $\\lim_{x\\to0}(1+ax)^{\\frac{a}{bx}}=$（ ） A. $\\mathrm{e}$  B. $\\sqrt{\\mathrm{e}}$  C. $\\mathrm{e}^{2}$  D. $1$","a":"C","s":"$P_y=2axy-3y^2$，$Q_x=12xy-by^2$，相等得 $a=6,b=3$；故极限 $=\\mathrm{e}^{a/b}=\\mathrm{e}^2$。注：原书题干指数部分印刷层叠，按解析收录为 $(1+ax)^{\\frac{a}{bx}}$。"},{"id":310,"ch":8,"chName":"曲线积分","sec":"选择题","q":"设 $L$ 为正向圆周 $x^{2}+y^{2}=3$ 在第一象限中的部分，则曲线积分 $\\int_{L}x\\,dy-3y\\,dx=$（ ） A. $\\pi$  B. $2\\pi$  C. $3\\pi$  D. $4\\pi$","a":"C","s":"补上两坐标轴段构成闭区域，$P_y=-3$，$Q_x=1$，格林公式得 $\\iint_D4\\mathrm{d}\\sigma=4S_D$，$S_D=\\frac{\\pi\\cdot3}{4}$，故为 $3\\pi$。"},{"id":311,"ch":9,"chName":"无穷级数","sec":"选择题","q":"若 $\\sum_{n=0}^{\\infty}u_{n}$ 收敛，则下列说法中不正确的是（ ） A. $\\lim_{n\\to\\infty}u_{n}=0$  B. $\\sum_{n=0}^{\\infty}u_{n+100}$ 收敛  C. $\\sum_{n=0}^{\\infty}|u_{n}|$ 收敛  D. $\\sum_{n=0}^{\\infty}|u_{n}|$ 敛散性不确定","a":"C","s":"收敛级数去项、增项不改敛散性，且通项趋于 0；但收敛推不出绝对收敛，如 $\\sum\\frac{(-1)^n}{n}$ 收敛而 $\\sum\\frac1n$ 发散，故 C 不正确。"},{"id":312,"ch":9,"chName":"无穷级数","sec":"选择题","q":"若 $\\sum_{n=0}^{\\infty}u_{n}$ 收敛，则 $\\lim_{n\\to\\infty}(u_{n}+2)=$（ ） A. $1$  B. $0$  C. $2$  D. 不存在","a":"C","s":"收敛级数通项趋于 0：$\\lim u_n=0$，故极限为 2。"},{"id":313,"ch":9,"chName":"无穷级数","sec":"选择题","q":"若 $\\sum_{n=0}^{\\infty}u_{n}$ 收敛，$\\sum_{n=0}^{\\infty}v_{n}$ 发散，则 $\\sum_{n=0}^{\\infty}(u_{n}+v_{n})$（ ） A. 条件收敛  B. 发散  C. 绝对收敛  D. 敛散性不确定","a":"B","s":"收敛±收敛=收敛，收敛±发散=发散，故必发散。"},{"id":314,"ch":9,"chName":"无穷级数","sec":"选择题","q":"下列级数收敛的是（ ） A. $\\sum_{n=1}^{\\infty}\\frac{(-3)^{n}}{2^{n}}$  B. $\\sum_{n=1}^{\\infty}\\frac{1}{\\sqrt[3]{n^{2}}}$  C. $\\sum_{n=1}^{\\infty}\\frac{1}{\\sqrt{n^{3}}}$  D. $\\sum_{n=1}^{\\infty}3$","a":"C","s":"$\\sum\\frac{1}{n^{3/2}}$ 为 $p=\\frac32>1$ 的 p 级数，收敛。"},{"id":315,"ch":9,"chName":"无穷级数","sec":"选择题","q":"下列级数收敛的是（ ） A. $\\sum_{n=1}^{\\infty}\\sqrt[n]{n}$  B. $\\sum_{n=1}^{\\infty}\\frac{n}{n^{2}+1}$  C. $\\sum_{n=1}^{\\infty}\\sin\\frac{1}{n}$  D. $\\sum_{n=1}^{\\infty}\\left(1-\\cos\\frac{1}{n}\\right)$","a":"D","s":"$1-\\cos\\frac1n\\sim\\frac{1}{2n^2}$，与 $\\sum\\frac{1}{n^2}$ 同敛散，收敛。"},{"id":316,"ch":9,"chName":"无穷级数","sec":"选择题","q":"下列级数发散的是（ ） A. $\\sum_{n=1}^{\\infty}\\frac{n+1}{n^{3}+2n}$  B. $\\sum_{n=1}^{\\infty}\\ln\\left(1+\\frac{1}{n^{2}}\\right)$  C. $\\sum_{n=1}^{\\infty}\\frac{(-1)^{n-1}+1}{n}$  D. $\\sum_{n=1}^
