\\mathrm{e}}\\arctan\\frac{u}{\\mathrm{e}}\\Big|_1^{\\mathrm{e}^2}=\\frac1{\\mathrm{e}}\\left(\\arctan\\mathrm{e}-\\arctan\\frac1{\\mathrm{e}}\\right)$，又 $\\arctan\\mathrm{e}+\\arctan\\frac1{\\mathrm{e}}=\\frac\\pi2$。"},{"id":797,"ch":107,"chName":"综合解答题(强化)","sec":"证明题","q":"证明：$\\int_{0}^{\\frac{\\pi}{2}}f(\\sin x)\\,\\mathrm{d}x=\\int_{0}^{\\frac{\\pi}{2}}f(\\cos x)\\,\\mathrm{d}x$，并计算 $\\int_{0}^{\\frac{\\pi}{2}}\\frac{\\sin x}{\\sin x+\\cos x}\\,\\mathrm{d}x$。","a":"两积分相等；$\\int_{0}^{\\frac{\\pi}{2}}\\frac{\\sin x}{\\sin x+\\cos x}\\,\\mathrm{d}x=\\frac{\\pi}{4}$","s":"令 $x=\\frac\\pi2-t$，$\\mathrm{d}x=-\\mathrm{d}t$，得 $\\int_0^{\\pi/2}f(\\sin x)\\mathrm{d}x=\\int_0^{\\pi/2}f\\left(\\cos t\\right)\\mathrm{d}t=\\int_0^{\\pi/2}f(\\cos x)\\mathrm{d}x$，即所证。记 $J=\\int_0^{\\pi/2}\\frac{\\sin x}{\\sin x+\\cos x}\\mathrm{d}x$，在同一代换下 $J=\\int_0^{\\pi/2}\\frac{\\cos x}{\\cos x+\\sin x}\\mathrm{d}x$，两式相加得 $2J=\\int_0^{\\pi/2}1\\,\\mathrm{d}x=\\frac\\pi2$，故 $J=\\frac\\pi4$。"},{"id":798,"ch":107,"chName":"综合解答题(强化)","sec":"证明题","q":"证明：$\\int_{0}^{\\pi}xf(\\sin x)\\,\\mathrm{d}x=\\frac{\\pi}{2}\\int_{0}^{\\pi}f(\\sin x)\\,\\mathrm{d}x$，并计算 $\\int_{0}^{\\pi}x\\sin^{2}x\\,\\mathrm{d}x$。","a":"等式成立；$\\int_{0}^{\\pi}x\\sin^{2}x\\,\\mathrm{d}x=\\frac{\\pi^{2}}{4}$","s":"令 $x=\\pi-t$，$\\mathrm{d}x=-\\mathrm{d}t$，因 $\\sin(\\pi-t)=\\sin t$，得 $\\int_0^\\pi xf(\\sin x)\\mathrm{d}x=\\int_0^\\pi(\\pi-t)f(\\sin t)\\mathrm{d}t=\\pi\\int_0^\\pi f(\\sin x)\\mathrm{d}x-\\int_0^\\pi xf(\\sin x)\\mathrm{d}x$，移项得 $2\\int_0^\\pi xf(\\sin x)\\mathrm{d}x=\\pi\\int_0^\\pi f(\\sin x)\\mathrm{d}x$，即所证。取 $f(u)=u^2$，得 $\\int_0^\\pi x\\sin^2x\\,\\mathrm{d}x=\\frac\\pi2\\int_0^\\pi\\sin^2x\\,\\mathrm{d}x=\\frac\\pi2\\cdot\\frac\\pi2=\\frac{\\pi^2}{4}$（原书答案栏印为 $\\frac{\\pi^4}{4}$，系排版笔误）。"},{"id":799,"ch":107,"chName":"综合解答题(强化)","sec":"证明题","q":"证明：$\\int_{x}^{1}\\dfrac{\\mathrm{d}t}{1+t^{2}}=\\int_{1}^{\\frac{1}{x}}\\dfrac{\\mathrm{d}t}{1+t^{2}}\\quad(x>0)$。","a":"$\\int_{x}^{1}\\frac{\\mathrm{d}t}{1+t^{2}}=\\int_{1}^{\\frac1x}\\frac{\\mathrm{d}t}{1+t^{2}}$","s":"令 $t=\\frac1u$，则 $\\mathrm{d}t=-\\frac{\\mathrm{d}u}{u^2}$；$t=x$ 时 $u=\\frac1x$，$t=1$ 时 $u=1$。于是 $\\int_x^1\\frac{\\mathrm{d}t}{1+t^2}=\\int_{1/x}^{1}\\frac{-\\mathrm{d}u/u^2}{1+1/u^2}=\\int_{1/x}^{1}\\frac{-\\mathrm{d}u}{u^2+1}=\\int_1^{1/x}\\frac{\\mathrm{d}u}{1+u^2}$，即 $\\int_1^{1/x}\\frac{\\mathrm{d}t}{1+t^2}$，所证成立。"},{"id":800,"ch":107,"chName":"综合解答题(强化)","sec":"证明题","q":"设 $f'(x)$ 在 $[0,a]$ 连续，$f(0)=0$ 且 $\\left|f'(x)\\right|\\leqslant M$，证明：$\\left|\\int_{0}^{a}f(x)\\,\\mathrm{d}x\\right|\\leqslant\\dfrac{M}{2}a^{2}$。","a":"$\\left|\\int_0^a f(x)\\,\\mathrm{d}x\\right|\\leqslant\\frac{M}{2}a^2$","s":"任取 $x\\in[0,a]$，由 $f(x)-f(0)=f'(\\xi)x\\ (\\xi\\in(0,x))$ 及 $f(0)=0$ 得 $|f(x)|=|f'(\\xi)|x\\leqslant Mx$。于是 $\\left|\\int_0^af(x)\\,\\mathrm{d}x\\right|\\leqslant\\int_0^a|f(x)|\\,\\mathrm{d}x\\leqslant\\int_0^aMx\\,\\mathrm{d}x=\\frac{M}{2}x^2\\Big|_0^a=\\frac{M}{2}a^2$。"}]};

(function(){
  "use strict";
  var KEY = "zsb6_gt800_text";
  var ITEMS = (GT_DATA && GT_DATA.items) || [];
  var FS = [14, 15, 16, 17, 18, 19, 20, 21, 22];
  var st = { mastered: {}, idx: 1, fs: 16, theme: "auto", filter: "all", q: "", ch: "all" };

  /* ---------- 存储 ---------- */
  function loadState(){
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch(e){}
    if (!raw) return;
    var o = null;
    try { o = JSON.parse(raw); } catch(e){ return; }
    if (!o || typeof o !== "object") return;
    if (o.mastered && typeof o.mastered === "object") st.mastered = o.mastered;
    if (o.idx > 0) st.idx = Math.min(ITEMS.length || 1, parseInt(o.idx, 10) || 1);
    if (o.fs) st.fs = Math.min(22, Math.max(14, parseInt(o.fs, 10) || 16));
    if (o.theme === "light" || o.theme === "dark" || o.theme === "auto") st.theme = o.theme;
    if (o.ch != null && o.ch !== "") st.ch = String(o.ch);
  }
  function saveState(){
    try { localStorage.setItem(KEY, JSON.stringify({ mastered: st.mastered, idx: st.idx, fs: st.fs, theme: st.theme, ch: st.ch })); } catch(e){}
  }
  function isM(id){ return !!st.mastered[id]; }
  function mTotal(){
    var n = 0, i;
    for (i = 0; i < ITEMS.length; i++) if (isM(ITEMS[i].id)) n++;
    return n;
  }

  /* ---------- 工具 ---------- */
  function $(s, r){ return (r || document).querySelector(s); }
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  /* 去掉 LaTeX 语法后的纯文本,用于关键词搜索 */
  function plain(s){
    return String(s || "")
      .replace(/\$/g, " ")
      .replace(/\\[a-zA-Z]+/g, " ")
      .replace(/[{}]/g, " ")
      .replace(/\s+/g, " ")
      .toLowerCase();
  }
  /* 章节标签：基础第 N 章 / 强化第 N 章（强化章号 = 100 + N，与基础章区分） */
  function chLabel(ch){
    var n = parseInt(ch, 10);
    if (isNaN(n)) return "第" + ch + "章";
    if (n >= 100) return "强化 第" + (n - 100) + "章";
    return "第" + n + "章";
  }
  /* ---------- 选择题展示：选项分行 + 单字母答案高亮 ---------- */
  function isChoice(it){ return /选择|单选|多选/.test(String((it && it.sec) || "")); }
  /* 题干转义：公式片段原样保留，非公式片段中的 " A." 类选项标记前插入换行 */
  function qHtml(it){
    var src = String((it && it.q) || "");
    var parts = src.split(/(\$[^$]*\$)/), out = "", i, seg;
    for (i = 0; i < parts.length; i++){
      seg = parts[i];
      if (i % 2 === 1){ out += esc(seg); continue; }
      seg = esc(seg);
      if (isChoice(it)){
        seg = seg.replace(/(\s)([A-E])\.\s*/g, function(m, sp, k){
          return sp + "<br>" + '<span class="optln">' + k + ".</span> ";
        });
      }
      out += seg;
    }
    return out;
  }
  /* 答案转义：选择题的单字母答案包成醒目徽标 */
  function aHtml(it){
    var a = String((it && it.a) || "");
    if (isChoice(it) && /^[A-Ea-e]$/.test(a.trim())){
      return '<span class="optKey">' + esc(a.trim().toUpperCase()) + "</span>";
    }
    return esc(a);
  }
  /* ---------- KaTeX：多 CDN 源 + 超时降级 ---------- */
  var CDN_BASES = [
    "./assets/katex/",
    "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/",
    "https://unpkg.com/katex@0.16.9/dist/",
    "https://registry.npmmirror.com/katex/0.16.9/files/dist/"
  ];
  var katexReady = false;
  function katexRenderOpts(){
    return {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false }
      ],
      throwOnError: false,
      errorColor: "#e05252",
      strict: false,
      ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code", "option"]
    };
  }
  function renderMath(root){
    if (!root || !katexReady) return;
    if (typeof window.renderMathInElement !== "function") return;
    try { window.renderMathInElement(root, katexRenderOpts()); } catch(e){ /* 异常不影响阅读 */ }
  }
  function onKatexReady(){
    katexReady = true;
    var tip = $("#katexTip");
    if (tip) tip.remove();
    renderMath($("#list"));
    if (studyOpen) renderMath($("#sBody"));
  }
  function injectCss(base){
    var href = base + "katex.min.css";
    var ls = document.querySelectorAll('link[rel="stylesheet"]');
    for (var i = 0; i < ls.length; i++){
      if (ls[i].getAttribute("href") === href) return;
    }
    var l = document.createElement("link");
    l.rel = "stylesheet"; l.href = href;
    document.head.appendChild(l);
  }
  function tryCdn(i){
    if (katexReady) return;
    if (i >= CDN_BASES.length){ showNoKatex(); return; }
    var base = CDN_BASES[i], settled = false;
    var timer = setTimeout(function(){
      if (!settled && !katexReady){ settled = true; tryCdn(i + 1); }
    }, 5000);
    injectCss(base);
    var s1 = document.createElement("script");
    s1.src = base + "katex.min.js";
    s1.async = true;
    s1.onload = function(){
      if (settled || katexReady) return;
      var s2 = document.createElement("script");
      s2.src = base + "contrib/auto-render.min.js";
      s2.async = true;
      s2.onload = function(){
        if (settled || katexReady) return;
        settled = true; clearTimeout(timer);
        onKatexReady();
      };
      s2.onerror = function(){
        if (settled || katexReady) return;
        settled = true; clearTimeout(timer); tryCdn(i + 1);
      };
      document.head.appendChild(s2);
    };
    s1.onerror = function(){
      if (settled || katexReady) return;
      settled = true; clearTimeout(timer); tryCdn(i + 1);
    };
    document.head.appendChild(s1);
  }
  function startKatex(){
    /* 已存在（离线内嵌/本地缓存）直接用，否则依次尝试 CDN */
    if (typeof window.renderMathInElement === "function"){ onKatexReady(); return; }
    tryCdn(0);
  }
  function showNoKatex(){
    if ($("#katexTip")) return;
    var d = el("div", "notice");
    d.id = "katexTip";
    d.innerHTML = "公式库未加载（离线或 CDN 不可达），当前按 <b>LaTeX 原文</b> 显示，联网后刷新即可正常渲染。";
    var top = $("#top");
    if (top) top.appendChild(d);
  }

  /* ---------- 渲染列表 ---------- */
  function cardHtml(it){
    return '<article class="card' + (isM(it.id) ? " mastered" : "") + '" id="c-' + it.id + '" data-id="' + it.id + '">'
      + '<div class="qhead">'
      +   '<div class="num">' + it.id + '</div>'
      +   '<div class="qbody">'
      +     '<div class="qtext">' + qHtml(it) + '</div>'
      +     '<div class="meta"><span class="tag">' + esc(chLabel(it.ch)) + ' ' + esc(it.chName) + '</span>'
      +       '<span class="tag t2">' + esc(it.sec) + '</span></div>'
      +   '</div>'
      + '</div>'
      + '<div class="ans">'
      +   '<div class="arow"><span class="lab lab-a">答案</span><div class="aval">' + aHtml(it) + '</div></div>'
      +   '<div class="arow"><span class="lab lab-s">解析</span><div class="sval">' + esc(it.s || "—") + '</div></div>'
      + '</div>'
      + '<div class="acts">'
      +   '<button class="btn btn-a" data-act="ans">看答案</button>'
      +   '<button class="btn ' + (isM(it.id) ? "btn-ok" : "") + ' btn-m" data-act="master">'
      +     (isM(it.id) ? "已掌握 ✓" : "标记已掌握") + '</button>'
      + '</div>'
      + '</article>';
  }
  function paintList(){
    var list = $("#list"), groups = [], map = {}, i, it, g, h = "", k;
    /* 按章节分组（保持题目顺序，章节首次出现即建组；同章节多种题型时合并展示） */
    for (i = 0; i < ITEMS.length; i++){
      it = ITEMS[i];
      k = String(it.ch);
      if (!map[k]){
        map[k] = { ch: it.ch, chName: it.chName, secs: [], html: "" };
        groups.push(map[k]);
      }
      if (map[k].secs.indexOf(it.sec) < 0) map[k].secs.push(it.sec);
      map[k].html += cardHtml(it);
    }
    for (i = 0; i < groups.length; i++){
      g = groups[i];
      h += '<section class="chgroup" data-ch="' + g.ch + '">'
        +   '<div class="chhead">'
        +     '<span class="chno">' + esc(chLabel(g.ch)) + '</span>'
        +     '<span class="chttl">' + esc(g.chName) + '</span>'
        +     '<span class="chsec">' + esc(g.secs.join(" · ")) + '</span>'
        +   '</div>'
        +   g.html
        + '</section>';
    }
    list.innerHTML = h;
    renderMath(list);
  }
  /* ---------- 章节下拉 ---------- */
  function buildChSel(){
    var sel = $("#chSel");
    if (!sel) return;
    var seen = {}, list = [], i, it, k, h;
    for (i = 0; i < ITEMS.length; i++){
      it = ITEMS[i];
      k = String(it.ch);
      if (!seen[k]){ seen[k] = { ch: it.ch, chName: it.chName, n: 0 }; list.push(seen[k]); }
      seen[k].n++;
    }
    h = '<option value="all">全部章节（' + ITEMS.length + ' 题）</option>';
    for (i = 0; i < list.length; i++){
      h += '<option value="' + list[i].ch + '">' + esc(chLabel(list[i].ch) + ' ' + list[i].chName)
        + '（' + list[i].n + ' 题）</option>';
    }
    sel.innerHTML = h;
    /* 恢复上次选择；失效值回退到全部 */
    var ok = false;
    for (i = 0; i < list.length; i++) if (String(list[i].ch) === String(st.ch)) ok = true;
    if (st.ch !== "all" && !ok) st.ch = "all";
    sel.value = st.ch;
    syncChSel();
  }
  function syncChSel(){
    var sel = $("#chSel");
    if (sel) sel.classList.toggle("on", sel.value !== "all");
  }
  /* ---------- 筛选/搜索 ---------- */
  function matchQ(it){
    var q = st.q.trim();
    if (!q) return true;
    var m = q.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m){
      var a = parseInt(m[1], 10), b = parseInt(m[2], 10);
      return it.id >= Math.min(a, b) && it.id <= Math.max(a, b);
    }
    if (/^\d+$/.test(q)){ return String(it.id) === q || String(it.id).indexOf(q) === 0; }
    var kw = plain(q);
    if (!kw) return true;
    return plain(it.q).indexOf(kw) > -1 || plain(it.a).indexOf(kw) > -1 || plain(it.s).indexOf(kw) > -1;
  }
  function matchF(it){
    if (st.filter === "done") return isM(it.id);
    if (st.filter === "undone") return !isM(it.id);
    return true;
  }
  function matchCh(it){ return st.ch === "all" || String(it.ch) === String(st.ch); }
  function applyFilter(){
    var list = $("#list"), cards = list.querySelectorAll(".card"), shown = 0, i, it, id, c;
    for (i = 0; i < cards.length; i++){
      c = cards[i];
      id = parseInt(c.getAttribute("data-id"), 10);
      it = byId(id);
      if (!it) continue;
      if (matchQ(it) && matchF(it) && matchCh(it)){ c.classList.remove("hide"); shown++; }
      else c.classList.add("hide");
    }
    /* 章节分组内无可见题目时隐藏该章节标题 */
    var groups = list.querySelectorAll(".chgroup"), j, g, inner;
    for (j = 0; j < groups.length; j++){
      g = groups[j];
      inner = g.querySelectorAll(".card:not(.hide)");
      if (inner.length) g.classList.remove("hide"); else g.classList.add("hide");
    }
    $("#count").textContent = "当前显示 " + shown + " / " + ITEMS.length + " 题";
  }
  function byId(id){
    var i;
    for (i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i];
    return null;
  }
  /* ---------- 进度与计数 ---------- */
  function paintProgress(){
    var t = ITEMS.length, m = mTotal(), pct = t ? Math.round(m / t * 100) : 0;
    $("#mCount").textContent = m;
    $("#tCount").textContent = t;
    $("#mPct").textContent = pct + "%";
    $("#mBar").style.width = pct + "%";
    $("#cAll").textContent = t;
    $("#cUn").textContent = t - m;
    $("#cDo").textContent = m;
  }
  /* ---------- 掌握标记 ---------- */
  function toggleMaster(id){
    var card = $("#c-" + id);
    if (isM(id)){ delete st.mastered[id]; }
    else { st.mastered[id] = true; }
    saveState();
    if (card){
      var on = isM(id);
      if (on) card.classList.add("mastered"); else card.classList.remove("mastered");
      var b = card.querySelector('[data-act="master"]');
      if (b){
        b.textContent = on ? "已掌握 ✓" : "标记已掌握";
        b.className = "btn btn-m" + (on ? " btn-ok" : "");
      }
    }
    paintProgress();
    if (st.filter !== "all") applyFilter();
    if (studyOpen) paintStudyMaster();
    if (studyOpen) { var m = $("#sMaster"); if (m) m.textContent = isM(id) ? "★" : "☆"; }
  }
  /* ---------- 字号/主题 ---------- */
  function applyFs(){
    document.documentElement.style.setProperty("--fs", st.fs + "px");
    saveState();
  }
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", st.theme);
    saveState();
  }
  /* ---------- 刷题模式 ---------- */
  var studyOpen = false;
  function openStudy(id){
    if (!ITEMS.length) return;
    var idx = 0, i;
    for (i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id){ idx = i; break; }
    st.idx = idx + 1;
    saveState();
    studyOpen = true;
    $("#study").classList.add("on");
    document.body.style.overflow = "hidden";
    paintStudy();
  }
  function closeStudy(){
    studyOpen = false;
    $("#study").classList.remove("on");
    document.body.style.overflow = "";
  }
  function paintStudy(){
    var it = ITEMS[st.idx - 1];
    if (!it) return;
    var body = $("#sBody");
    body.innerHTML = '<div class="scard">'
      + '<div class="snum">' + esc(chLabel(it.ch)) + ' ' + esc(it.chName) + ' · ' + esc(it.sec) + '</div>'
      + '<div class="sq">' + qHtml(it) + '</div>'
      + '<div class="ans hide"><div class="arow"><span class="lab lab-a">答案</span><div class="aval">' + aHtml(it) + '</div></div>'
      + '<div class="arow"><span class="lab lab-s">解析</span><div class="sval">' + esc(it.s || "—") + '</div></div></div>'
      + '</div>';
    $("#sIdx").textContent = st.idx;
    $("#sTotal").textContent = ITEMS.length;
    $("#sAns").textContent = "看答案";
    paintStudyMaster();
    renderMath(body);
    saveState();
  }
  function paintStudyMaster(){
    var it = ITEMS[st.idx - 1]; if (!it) return;
    $("#sMaster").textContent = isM(it.id) ? "★" : "☆";
    $("#sMaster").style.color = isM(it.id) ? "var(--ok)" : "var(--sub)";
  }
  function studyNav(d){
    if (!studyOpen) return;
    var n = st.idx + d;
    if (n < 1){ toast("已经是第一题"); return; }
    if (n > ITEMS.length){ toast("已经是最后一题"); return; }
    st.idx = n;
    paintStudy();
    $("#sBody").scrollTop = 0;
  }
  /* ---------- 轻提示 ---------- */
  var toastTimer = null;
  function toast(msg){
    var t = $("#toast");
    if (!t){
      t = el("div", null);
      t.id = "toast";
      t.style.cssText = "position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);"
        + "background:rgba(20,24,34,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:.86em;z-index:99;"
        + "max-width:80vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = "1";
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.style.opacity = "0"; }, 1400);
  }
  /* ---------- 事件 ---------- */
  function bind(){
    /* 列表:展开答案 / 标记掌握 */
    $("#list").addEventListener("click", function(e){
      var t = e.target;
      var btn = t.closest ? t.closest("[data-act]") : null;
      if (!btn) return;
      var card = btn.closest(".card");
      if (!card) return;
      var id = parseInt(card.getAttribute("data-id"), 10);
      if (btn.getAttribute("data-act") === "ans"){
        var open = card.classList.toggle("open");
        btn.textContent = open ? "收起答案" : "看答案";
      } else if (btn.getAttribute("data-act") === "master"){
        toggleMaster(id);
      }
    });
    /* 筛选 */
    $("#chips").addEventListener("click", function(e){
      var b = e.target.closest ? e.target.closest(".chip") : null;
      if (!b) return;
      st.filter = b.getAttribute("data-f");
      var all = $("#chips").querySelectorAll(".chip"), i;
      for (i = 0; i < all.length; i++) all[i].classList.remove("on");
      b.classList.add("on");
      applyFilter();
    });
    /* 章节下拉 */
    var cs = $("#chSel");
    if (cs){
      cs.addEventListener("change", function(){
        st.ch = cs.value || "all";
        syncChSel();
        saveState();
        applyFilter();
      });
    }
    /* 搜索 */
    var qi = $("#q"), clr = $("#clr"), tmr = null;
    qi.addEventListener("input", function(){
      st.q = qi.value;
      clr.classList.toggle("on", !!qi.value);
      if (tmr) clearTimeout(tmr);
      tmr = setTimeout(applyFilter, 120);
    });
    clr.addEventListener("click", function(){
      qi.value = ""; st.q = ""; clr.classList.remove("on"); applyFilter(); qi.focus();
    });
    /* 主题 */
    $("#btnTheme").addEventListener("click", function(){
      st.theme = st.theme === "auto" ? "dark" : (st.theme === "dark" ? "light" : "auto");
      applyTheme();
      toast("外观: " + (st.theme === "auto" ? "跟随系统" : (st.theme === "dark" ? "深色" : "浅色")));
    });
    /* 字号 */
    $("#btnFs").addEventListener("click", function(){
      var i = 0;
      for (i = 0; i < FS.length; i++) if (FS[i] === st.fs) break;
      st.fs = FS[(i + 1) % FS.length];
      applyFs();
      toast("字号: " + st.fs + "px");
    });
    /* 进入刷题 */
    $("#btnStudy").addEventListener("click", function(){ openStudy(ITEMS.length ? ITEMS[0].id : 1); });
    $("#sClose").addEventListener("click", closeStudy);
    $("#sPrev").addEventListener("click", function(){ studyNav(-1); });
    $("#sNext").addEventListener("click", function(){ studyNav(1); });
    $("#sAns").addEventListener("click", function(){
      var a = $("#sBody .ans");
      if (!a) return;
      var hide = a.classList.toggle("hide");
      $("#sAns").textContent = hide ? "看答案" : "收起答案";
    });
    $("#sMaster").addEventListener("click", function(){
      var it = ITEMS[st.idx - 1]; if (it) toggleMaster(it.id);
    });
    /* 键盘 */
    document.addEventListener("keydown", function(e){
      if (studyOpen){
        if (e.key === "ArrowLeft"){ e.preventDefault(); studyNav(-1); }
        else if (e.key === "ArrowRight"){ e.preventDefault(); studyNav(1); }
        else if (e.key === "Escape"){ closeStudy(); }
        else if (e.key === " "){ e.preventDefault(); $("#sAns").click(); }
        return;
      }
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      if (e.key === "s" || e.key === "S"){ $("#btnStudy").click(); }
    });
    /* 顶部投影 */
    window.addEventListener("scroll", function(){
      var top = $("#top");
      if (window.scrollY > 4) top.classList.add("stuck"); else top.classList.remove("stuck");
    }, { passive: true });
  }
  /* ---------- 启动 ---------- */
  loadState();
  applyFs();
  applyTheme();
  $("#batchName").textContent = (GT_DATA && GT_DATA.meta && GT_DATA.meta.batch) || "";
  paintList();
  buildChSel();
  paintProgress();
  applyFilter();
  bind();
  startKatex();
})();

</script>
</body>
</html>
